syntax = "proto3";

package orca.annotation.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/annotation/v1;annotationv1";

import "google/protobuf/timestamp.proto";

// AnnotationService owns inline code-review comments anchored to a file+line.
// See specs/backend-go/services/annotation-service.md.
service AnnotationService {
  rpc CreateAnnotation(CreateAnnotationRequest) returns (CreateAnnotationResponse);
  rpc ListAnnotations(ListAnnotationsRequest) returns (ListAnnotationsResponse);
  rpc UpdateAnnotation(UpdateAnnotationRequest) returns (UpdateAnnotationResponse);
  rpc DeleteAnnotation(DeleteAnnotationRequest) returns (DeleteAnnotationResponse);
  rpc MarkAnnotationsSent(MarkAnnotationsSentRequest) returns (MarkAnnotationsSentResponse);
}

enum Side {
  SIDE_UNSPECIFIED = 0; // non-diff comment (plain file/line note) — BR-CR-05 only applies to diff review
  SIDE_OLD = 1;
  SIDE_NEW = 2;
}

message Anchor {
  string repo_id = 1;
  string file_path = 2;
  int32 line = 3;
  string ref = 4; // commit sha or branch, best-effort
  string worktree_id = 5;  // NEW — optional; scope addition, see SOL-CR-02 rationale
  int32 end_line = 6;      // NEW — 0 or == line means single-line; must be >= line (BR-CR-06)
  Side side = 7;           // NEW — BR-CR-05
}

message Annotation {
  string id = 1;
  string tenant_id = 2;
  string author_id = 3;
  Anchor anchor = 4;
  string content = 5;
  bool resolved = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string original_code = 9;               // NEW — BL-CR-02 DiffComment.originalCode
  bool sent_to_agent = 10;                // NEW — distinct from `resolved` (BR-CR-08)
  google.protobuf.Timestamp sent_at = 11; // NEW — nil until MarkAnnotationsSent
}

message CreateAnnotationRequest {
  Anchor anchor = 1;
  string content = 2;
  string request_id = 3;
  string original_code = 4; // NEW
}

message CreateAnnotationResponse {
  Annotation annotation = 1;
}

message ListAnnotationsRequest {
  string repo_id = 1;
  string file_path = 2; // optional filter
  string page_token = 3;
  int32 page_size = 4;
  string worktree_id = 5;          // NEW — optional filter, alternative to repo_id+file_path
  optional bool sent_to_agent = 6; // NEW — lets a caller ask for only-unsent (SOL-CR-03's send flow)
}

message ListAnnotationsResponse {
  repeated Annotation annotations = 1;
  string next_page_token = 2;
}

message UpdateAnnotationRequest {
  string id = 1;
  string content = 2;
  bool resolved = 3;
}

message UpdateAnnotationResponse {
  Annotation annotation = 1;
}

message DeleteAnnotationRequest {
  string id = 1;
  bool confirmed = 2; // NEW — BR-CR-08; see TASK-CR-02-05
}

message DeleteAnnotationResponse {}

message MarkAnnotationsSentRequest {
  repeated string ids = 1;
}

message MarkAnnotationsSentResponse {
  repeated Annotation annotations = 1;
}
