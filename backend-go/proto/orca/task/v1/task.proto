syntax = "proto3";

package orca.task.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/task/v1;taskv1";

// TaskService owns the task DAG, edges, grants, comments. Does NOT own team
// membership (tenant-service) or execution (infra-fleet-service/orchestration-service).
// See specs/backend-go/services/task-service.md.
service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc AddEdge(AddEdgeRequest) returns (AddEdgeResponse);
  rpc Grant(GrantRequest) returns (GrantResponse);
  // RevokeGrant/ListGrants are the public grant-management surface for the
  // frontend's Access tab (FE-SOL-001) — distinct from the internal
  // ListGrantsForAncestors path ResolvePermission's BFS walk uses.
  rpc RevokeGrant(RevokeGrantRequest) returns (google.protobuf.Empty);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  rpc ResolvePermission(ResolvePermissionRequest) returns (ResolvePermissionResponse);
  rpc Execute(TaskServiceExecuteRequest) returns (TaskServiceExecuteResponse);

  // HasActiveExecutions answers "does this project have a task currently
  // dispatched for execution (status=in_progress)" — added for Epic C
  // (backend-go/docs/execution-plan.md §10) to close
  // project-service.RebindDevServer's guard, previously a client-side
  // no-op because this RPC didn't exist. See that RPC's Go doc comment
  // (internal/usecase/has_active_executions.go) for the honest limit on
  // what this can currently answer — task-service has no completion
  // callback yet, so "in_progress" is one-way until that's built.
  rpc HasActiveExecutions(HasActiveExecutionsRequest) returns (HasActiveExecutionsResponse);

  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
  rpc GetDependencies(GetDependenciesRequest) returns (GetDependenciesResponse);
  rpc FindTaskByNumber(FindTaskByNumberRequest) returns (FindTaskByNumberResponse);

  // AIDecompose relays to the Dev Server Agent's ai.complete method (via
  // infra-fleet-service's Relay RPC) to propose a subtask breakdown for
  // task_id — review-before-commit: proposals are not written to
  // task_edges until a subsequent AIApply call. See TASK-224's Context
  // note for why task-service goes through infra-fleet-service rather
  // than calling the Dev Server Agent directly.
  rpc AIDecompose(AIDecomposeRequest) returns (AIDecomposeResponse);
  // AIApply commits a (possibly user-edited) proposal set from a prior
  // AIDecompose call, creating one subtask + parent_child edge per
  // proposal.
  rpc AIApply(AIApplyRequest) returns (AIApplyResponse);

  rpc GetSubtree(GetSubtreeRequest) returns (GetSubtreeResponse);
  rpc RecalculateProgress(RecalculateProgressRequest) returns (RecalculateProgressResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);

  rpc GenerateAgentPrompt(GenerateAgentPromptRequest) returns (GenerateAgentPromptResponse);

  rpc CreatePublicLink(CreatePublicLinkRequest) returns (CreatePublicLinkResponse); // requires 'manage'; returns the plaintext token ONCE
  rpc RevokePublicLink(RevokePublicLinkRequest) returns (google.protobuf.Empty);
  rpc ResolvePublicLink(ResolvePublicLinkRequest) returns (ResolvePublicLinkResponse); // token -> task_id + read-only grant, no auth required

  // GenerateShareLink/GetTaskByShareToken (TASK-TG-003-05) is a second,
  // independently-built share-link path alongside CreatePublicLink/
  // ResolvePublicLink above — narrower (TaskShareView's 4-field projection
  // vs. a full read-only grant). Both landed with real, tested usecases;
  // kept side by side rather than unilaterally picking one, since
  // consolidating them is a product/architecture call, not a merge
  // decision. GetTaskByShareToken is task-service's first unauthenticated
  // read endpoint by design (the token itself is the authorization) —
  // SECURITY REVIEW REQUIRED before this path is exposed at api-gateway.
  rpc GenerateShareLink(GenerateShareLinkRequest) returns (GenerateShareLinkResponse);
  rpc GetTaskByShareToken(GetTaskByShareTokenRequest) returns (GetTaskByShareTokenResponse);

  // ReportTaskExecutionResult is the shared inbound completion callback for
  // Engine 2 (orchestration-service, via its autonomous coordinator,
  // SOL-TASKV1-005) and Engine 3 (workflow-service's runToCompletion,
  // BE-SOL-002) — never called by api-gateway/a user session. At-least-once
  // consumer idempotence is expected of the caller side (a duplicate/stale
  // report is ignored, not an error) — see
  // usecase.ReportTaskExecutionResult's doc comment for the concrete rule.
  //
  // BE-SOL-002 (TASK-FT-002-01) generalizes SOL-TG-04/TASK-TG-04-05's
  // original Engine-2-only 5-field shape (task_id, coordinator_run_id,
  // success, actual_hours, error_message) to also cover Engine 3: field 2
  // is renamed coordinator_run_id -> execution_ref and field 6 (engine) is
  // added. Implemented for real as of TASK-FT-002-04 (this was previously a
  // compile-only stub returning codes.Unimplemented).
  rpc ReportTaskExecutionResult(ReportTaskExecutionResultRequest) returns (google.protobuf.Empty);
}

message GenerateShareLinkRequest {
  string task_id = 1;
  string user_id = 2; // acting caller — must hold admin-level permission
}
message GenerateShareLinkResponse {
  string share_token = 1;
}

message GetTaskByShareTokenRequest {
  string share_token = 1;
}
message GetTaskByShareTokenResponse {
  TaskShareView task = 1;
}
// TaskShareView is a DEDICATED, narrow projection — NOT Task reused with
// fields blanked out, so a future Task field addition can never leak
// through this public, unauthenticated path by accident. ONLY these 4
// fields, ever — see domain.TaskShareView's own doc comment.
message TaskShareView {
  string id = 1;
  string title = 2;
  string status = 3;
  string description = 4;
}

message Task {
  string id = 1;
  string tenant_id = 2;
  string title = 3;
  string status = 4;
  string parent_id = 5;
  string project_id = 6; // added for Epic C's HasActiveExecutions — see that RPC's doc comment

  string description = 7;
  string task_type = 8;
  string priority = 9;
  string assignee_id = 10;
  string owner_id = 11; // see SOL-TG-03's owner-intrinsic short-circuit
  google.protobuf.Timestamp due_date = 12;
  google.protobuf.DoubleValue estimated_hours = 13;
  google.protobuf.DoubleValue actual_hours = 14; // see SOL-TG-04
  string prompt_template = 15;                   // see SOL-TG-02
  string ai_context = 16;
  string ai_plan_json = 17;                      // see SOL-TG-02
  string visibility = 18;
  string worktree_id = 19;                       // see SOL-TG-04
  string agent_session_id = 20;                   // see SOL-TG-04
  int32 progress_percent = 21;
  // Added SOL-PW-04: a per-project sequential number so a commit message
  // can reference "#TG-42" without embedding a UUID. Assigned once at
  // CreateTask, immutable, backed by a per-project sequence — never
  // reused even if the task is deleted, matching GitHub/Jira issue-number
  // semantics.
  int64 task_number = 22;
  // Set by the PR-creation write-back saga — empty until a PR
  // referencing this task's #TG-N is created.
  string pr_url = 23;
  // workflow_template_id: optional workflow-service template attached to
  // this task (Engine 3). Empty = none attached. See docs/backlog/BACKLOG-016.
  string workflow_template_id = 24; // BE-SOL-001/BE-SOL-002 — empty = unchanged behavior (selectEngine treats "" as "no workflow engine selected"); mirrors domain.Task.WorkflowTemplateID (TASK-FT-001-01/02)
  // Fields below (TASK-TG-001-02) were present on domain.Task before the
  // proto caught up — added here at the next-free numbers rather than the
  // task's own self-assigned ones, which collided with fields main had
  // already claimed (see workflow_template_id above).
  repeated string labels = 25;
  string reporter_id = 26;
  string workflow_exec_id = 27; // execution-tracking counterpart to workflow_template_id above — see domain.Task.WorkflowExecID
  int32 done_subtasks = 28;
  int32 total_subtasks = 29;
  // share_token: unset until GenerateShareLink mints one (TASK-TG-003-05 —
  // SECURITY REVIEW REQUIRED before merge). Only readable here via an
  // authenticated Task read (GetTask/ListTasks with a valid grant); the
  // public GetTaskByShareToken RPC returns a dedicated, narrower
  // TaskShareView instead — see that message's own doc comment.
  string share_token = 30;
}

message CreateTaskRequest {
  string tenant_id = 1;
  string title = 2;
  string parent_id = 3;
  string project_id = 4;
  string description = 5;
  string task_type = 6;
  string priority = 7;
  string assignee_id = 8;
  google.protobuf.Timestamp due_date = 9;
  google.protobuf.DoubleValue estimated_hours = 10;
  string prompt_template = 11;
  string ai_context = 12;
  string visibility = 13;
  // creator_id: the caller's own user id — mints an owner-level Grant for
  // this task (TASK-TG-003-02), separate from and NOT the same as
  // Task.owner_id (informational/display-only, never read by
  // ResolvePermission).
  string creator_id = 14;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  string id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

enum EdgeType {
  EDGE_TYPE_UNSPECIFIED = 0;
  EDGE_TYPE_PARENT_CHILD = 1;
  EDGE_TYPE_DEPENDS_ON = 2;
}

// AddEdge rejects cycles (domain-layer CycleDetector), see task-service.md.
message AddEdgeRequest {
  string from_task_id = 1;
  string to_task_id = 2;
  EdgeType type = 3;
}

message AddEdgeResponse {}

enum GrantLevel {
  GRANT_LEVEL_UNSPECIFIED = 0;
  GRANT_LEVEL_OWNER = 1;
  GRANT_LEVEL_ADMIN = 2;
  GRANT_LEVEL_USER = 3;
  GRANT_LEVEL_TEAM = 4;
  GRANT_LEVEL_COMPANY = 5;
}

message GrantRequest {
  string task_id = 1;
  string subject_id = 2; // user or team id
  GrantLevel level = 3;
  bool apply_tree = 4;
  // expires_at: optional (TASK-TG-003-03) — unset means the grant never
  // expires.
  google.protobuf.Timestamp expires_at = 5;
}

message GrantResponse {
  string id = 1; // new — the persisted grant's id, needed by RevokeGrant callers
}

message RevokeGrantRequest {
  string task_id = 1;
  string subject_id = 2;
  GrantLevel level = 3;
}

message ListGrantsRequest {
  string task_id = 1;
}
message ListGrantsResponse {
  repeated GrantView grants = 1;
}
// GrantView is a dedicated, narrow projection of task.task_grants — task_id
// is deliberately omitted (the caller already knows it, from
// ListGrantsRequest.task_id) and tenant_id is never exposed on the wire.
message GrantView {
  string subject_id = 1;
  GrantLevel level = 2;
  bool apply_tree = 3;
  google.protobuf.Timestamp expires_at = 4; // unset if never expires
}

// ResolvePermission runs the BFS ancestor-resolution algorithm in domain/,
// then the caller passes the result as OPA policy input for the final
// allow/deny — see task-service.md security notes.
message ResolvePermissionRequest {
  string task_id = 1;
  string user_id = 2;
  // action: the OPA action being authorized (e.g. "read"/"write"/"admin"),
  // forwarded to task_grant.rego's level_actions table. Empty (an older
  // client that hasn't been rebuilt against this field yet) defaults to
  // "read" at the server.go call site, not here — see that handler's doc
  // comment.
  string action = 3;
}

message ResolvePermissionResponse {
  GrantLevel effective_level = 1;
}

// Execute branches by complexity: simple tasks relay to infra-fleet-service
// (agent.exec-equivalent), complex ones route through orchestration-service.
message TaskServiceExecuteRequest {
  string task_id = 1;
  string request_id = 2;
  // prompt: caller-supplied override for the agent prompt (TaskPromptEditor.tsx
  // lets the user edit it before running). Empty = fall back to the
  // executor's own default prompt built from the task (e.g.
  // SimpleExecutor.buildExecutePrompt's plain "Complete the following
  // task: <title>"). Not persisted — a per-execution input, not a task
  // field. See docs/backlog/BACKLOG-016.
  string prompt = 3;
}

message TaskServiceExecuteResponse {
  string execution_ref = 1; // opaque handle into infra-fleet-service or orchestration-service
  // async is true for the complex path (orchestration-service dispatch is
  // async — completion arrives later via ReportTaskExecutionResult,
  // TASK-TG-04-05) and false for the simple path, which is already complete
  // (status=review, actual_hours persisted) by the time this response is
  // sent — see usecase.ExecuteTask's doc comment (SOL-TG-04).
  bool async = 2;
}

message HasActiveExecutionsRequest {
  string project_id = 1;
}

message HasActiveExecutionsResponse {
  bool has_active = 1;
}

message ListTasksRequest {
  string project_id = 1; // optional filter, empty = no filter
  string page_token = 2;
  int32 page_size = 3;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}

// UpdateTask uses optional (wrapper-typed) fields, same field-mask shape as
// UpdateAutomationRequest — a status-only edit (the common case, e.g.
// marking done) shouldn't require resending title. Status transitions into
// "in_progress" are rejected at the domain layer (domain.Task.SetStatus) —
// that transition is ExecuteTask's job only.
message UpdateTaskRequest {
  string id = 1;
  google.protobuf.StringValue title = 2;
  google.protobuf.StringValue status = 3;
  google.protobuf.StringValue description = 4;
  google.protobuf.StringValue task_type = 5;
  google.protobuf.StringValue priority = 6;
  google.protobuf.StringValue assignee_id = 7;
  google.protobuf.Timestamp due_date = 8;
  google.protobuf.DoubleValue estimated_hours = 9;
  google.protobuf.StringValue prompt_template = 10;
  google.protobuf.StringValue ai_context = 11;
  google.protobuf.StringValue visibility = 12;
  google.protobuf.StringValue pr_url = 13;
  google.protobuf.StringValue worktree_id = 14;
  // workflow_template_id: set (even to "") to change which workflow-service
  // template is attached; unset (field absent) leaves it untouched — same
  // wrapper-typed field-mask shape as title/status above. See
  // docs/backlog/BACKLOG-016.
  google.protobuf.StringValue workflow_template_id = 15;
}
message UpdateTaskResponse {
  Task task = 1;
}

// FindTaskByNumber resolves a project-scoped "#TG-N" reference to a task
// id. Project-scoped, not tenant-wide: two different projects can each
// have their own #TG-42, matching how GitHub/Jira issue numbers are
// repo/project-scoped, not org-wide.
message FindTaskByNumberRequest {
  string project_id = 1;
  int64 task_number = 2;
}
message FindTaskByNumberResponse {
  Task task = 1; // empty/NOT_FOUND if no task in project_id has this number
}

message DeleteTaskRequest {
  string id = 1;
}

// GetDependencies walks depends_on edges FROM task_id — distinct from
// AddEdge (write) and from the parent_child ancestor walk GetAncestors
// does internally (not on this proto's surface yet).
message GetDependenciesRequest {
  string task_id = 1;
}
message GetDependenciesResponse {
  repeated Task dependencies = 1;
}

message AIDecomposeRequest {
  string task_id = 1;
}
message SubtaskProposal {
  string title = 1;
  string description = 2;
  string type = 3; // task|bug|feature — mirrors Task.task_type
  google.protobuf.DoubleValue estimated_hours = 4;
  // DependsOnIndices names OTHER proposals in the SAME AIDecompose response
  // by their 0-based position — proposals have no Task.ID until AIApply
  // creates them.
  repeated int32 depends_on_indices = 5;
  string prompt_template = 6;
}
message AIDecomposeResponse {
  repeated SubtaskProposal proposals = 1; // review-before-commit — not yet written to task_edges
  string raw_response = 2; // unparsed AI JSON — persisted to ai_plan_json, shown on parse failure
  string notes = 3;
}

// AIApply commits a (possibly user-edited) proposal set from a prior
// AIDecompose call — the two-step review-before-commit shape.
message AIApplyRequest {
  string task_id = 1;
  repeated SubtaskProposal proposals = 2;
  string raw_ai_response = 3; // echoed back from AIDecomposeResponse.raw_response
}
message AIApplyResponse {
  repeated Task created_subtasks = 1;
}

message GetSubtreeRequest { string root_id = 1; }
message GetSubtreeResponse {
  repeated Task tasks = 1;
  repeated AddEdgeRequest depends_on_edges = 2; // reuses the existing edge shape rather than a new message
}

message RecalculateProgressRequest { string root_id = 1; }
message RecalculateProgressResponse { int32 progress_percent = 1; }

message AddCommentRequest { string task_id = 1; string content = 2; }
message AddCommentResponse { string id = 1; string author_id = 2; string content = 3; string created_at = 4; }
message ListCommentsRequest { string task_id = 1; string page_token = 2; int32 page_size = 3; }
message ListCommentsResponse { repeated AddCommentResponse comments = 1; string next_page_token = 2; }

message GenerateAgentPromptRequest { string task_id = 1; bool save = 2; }
message GenerateAgentPromptResponse { string prompt = 1; }

message CreatePublicLinkRequest { string task_id = 1; google.protobuf.Timestamp expires_at = 2; }
message CreatePublicLinkResponse { string id = 1; string token = 2; } // token returned ONCE, plaintext, never again
message RevokePublicLinkRequest { string id = 1; }
message ResolvePublicLinkRequest { string token = 1; }
message ResolvePublicLinkResponse { string task_id = 1; }

// ReportTaskExecutionResultRequest's shape is BE-SOL-002's engine-neutral
// generalization of SOL-TG-04/TASK-TG-04-05's original Engine-2-only
// version (see the RPC's own doc comment above): task_id/execution_ref
// identify which task and which engine-specific run (coordinator_run_id
// for Engine 2, workflow execution_id for Engine 3) this report is for —
// execution_ref matches task.execution_links.external_ref_id
// (TASK-FT-001-01); success/error_message/actual_hours carry the terminal
// outcome CompleteExecution (postgres/repository.go) needs to write.
message ReportTaskExecutionResultRequest {
  string task_id = 1;
  string execution_ref = 2; // renamed from coordinator_run_id (TASK-FT-002-01) — coordinator_run_id (Engine 2) or workflow execution_id (Engine 3)
  bool success = 3;
  double actual_hours = 4;
  string error_message = 5; // set when success = false
  string engine = 6; // "orchestration" | "workflow" (NEW, BE-SOL-002) — picks which execution_links row to validate staleness against
}
