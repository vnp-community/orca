syntax = "proto3";

package orca.credentialbroker.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/credentialbroker/v1;credentialbrokerv1";

// CredentialBrokerService mediates ALL tenant/user secret material through
// Vault — it stores metadata only, never plaintext or ciphertext itself.
// Every service EXCEPT this one is Vault-scoped only to its own dynamic DB
// credential lease. See specs/backend-go/services/credential-broker-service.md
// and architecture/06-secrets-vault-architecture.md — this is the centerpiece
// of the user's "use Vault for sensitive data" requirement.
service CredentialBrokerService {
  rpc WriteCredential(WriteCredentialRequest) returns (WriteCredentialResponse);
  rpc ResolveCredential(ResolveCredentialRequest) returns (ResolveCredentialResponse);
  rpc RotateCredential(RotateCredentialRequest) returns (RotateCredentialResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);

  // GetCredentialMetadata is a metadata-only read — id/tenant/owner/
  // category/status/vault_path, NEVER a value. Added for Epic B
  // (docs/execution-plan.md §8): ai-provider-service's
  // usecase.CredentialBrokerClient.ResolveCredential port must never see
  // plaintext (see that service's grpcclient package doc comment's
  // SECURITY-CRITICAL note) but does need to observe a credential's
  // current status. Distinct from ResolveCredential, which this RPC never
  // calls into and shares no code path with beyond the metadata repository
  // read itself.
  rpc GetCredentialMetadata(GetCredentialMetadataRequest) returns (GetCredentialMetadataResponse);

  // ResolveCredentialByOwner is ResolveCredential's lookup-by-id, but keyed
  // by (tenant_id, category, owner_id) instead — for callers that know
  // which tenant+category+logical-owner they need a token for but were
  // never handed an opaque credential_id (they didn't create the
  // credential; they're the one that resolves it at call time). Added for
  // Epic B: scm-integration-service (owner_id = provider name, e.g.
  // "github") and issue-tracking-service (owner_id = provider name, e.g.
  // "jira") both resolve this way — see those services' README "Known
  // gaps" for the convention. Same authorized-caller list and fail-closed/
  // audited semantics as ResolveCredential (see that RPC's doc comment);
  // this is a different lookup key, not a different security posture.
  rpc ResolveCredentialByOwner(ResolveCredentialByOwnerRequest) returns (ResolveCredentialByOwnerResponse);

  // RevokeCredentialByOwner is RevokeCredential's revoke-by-id counterpart,
  // keyed by (tenant_id, category, owner_id) instead — for callers (e.g.
  // scm-integration-service's RevokeAuth) that never received an opaque
  // credential_id, the same way ResolveCredentialByOwner exists for the
  // read side. Same fail-closed/audited semantics as RevokeCredential; a
  // different lookup key, not a different security posture.
  rpc RevokeCredentialByOwner(RevokeCredentialByOwnerRequest) returns (RevokeCredentialByOwnerResponse);

  // SignVapidPayload signs a Web Push VAPID JWT payload with a per-tenant
  // Vault Transit key this service manages — added for Epic B so
  // notification-service (previously the one documented exception, calling
  // common/secrets.TransitEncrypt directly) no longer touches Vault at all.
  // Deliberately narrow (one named operation, not a generic "Transit-sign
  // anything" RPC) rather than folded into WriteCredential/
  // ResolveCredential: a VAPID signing key is not tenant-supplied secret
  // material with a lifecycle (write/rotate/revoke) the way an OAuth token
  // is — it's a service-managed key this broker provisions implicitly on
  // first use, scoped by tenant_id alone. See
  // specs/backend-go/architecture/06-secrets-vault-architecture.md's
  // updated "credential-broker-service's role" section for why this is
  // documented as the fix, not an accepted deviation.
  rpc SignVapidPayload(SignVapidPayloadRequest) returns (SignVapidPayloadResponse);

  // GetCredentialMetadataByOwner is GetCredentialMetadata's lookup-by-owner
  // counterpart — for callers that know (tenant_id, category, owner_id) but
  // were never handed an opaque credential_id, mirroring
  // ResolveCredentialByOwner's existing by-owner convention but for a
  // metadata-only read instead of a plaintext resolve.
  rpc GetCredentialMetadataByOwner(GetCredentialMetadataByOwnerRequest) returns (GetCredentialMetadataByOwnerResponse);

  // ListCredentialsByCategory answers "which owner_ids have a credential in
  // this category for this tenant" — backs credentials.list.
  rpc ListCredentialsByCategory(ListCredentialsByCategoryRequest) returns (ListCredentialsByCategoryResponse);
}

enum CredentialCategory {
  CREDENTIAL_CATEGORY_UNSPECIFIED = 0;
  CREDENTIAL_CATEGORY_SCM_OAUTH = 1;
  CREDENTIAL_CATEGORY_ISSUE_TRACKER_OAUTH = 2;
  CREDENTIAL_CATEGORY_AI_PROVIDER_KEY = 3;
  CREDENTIAL_CATEGORY_SSH = 4;
  CREDENTIAL_CATEGORY_SERVICE_SECRET = 5;
}

message CredentialMetadata {
  string id = 1;
  string tenant_id = 2;
  string owner_id = 3; // user id or service name
  CredentialCategory category = 4;
  string status = 5; // active|rotating|revoked
  string vault_path = 6; // reference only, never the secret itself
  string config_json = 7; // mirrors WriteCredentialRequest.config_json — never secret
}

// WriteCredential accepts a client-side-encrypted envelope; the broker
// decrypts it transiently in-memory for this single request only, then
// immediately re-encrypts via Vault Transit / writes to KV — plaintext never
// touches disk or logs. See credential-broker-service.md section 9.
message WriteCredentialRequest {
  string tenant_id = 1;
  string owner_id = 2;
  CredentialCategory category = 3;
  bytes encrypted_envelope = 4;
  // config_json is non-secret sidecar configuration only (e.g. a
  // self-hosted Gitea/Jira instance base URL). NEVER put anything
  // sensitive here: unlike encrypted_envelope, this field is returned
  // verbatim by metadata-only reads (GetCredentialMetadataByOwner,
  // GetCredentialMetadata).
  string config_json = 5;
}

message WriteCredentialResponse {
  CredentialMetadata metadata = 1;
}

// ResolveCredential is called only by services explicitly authorized to
// mediate a secret on behalf of a request (ai-provider-service,
// scm-integration-service, issue-tracking-service, infra-fleet-service) —
// enforced by Vault policy, not just by this RPC's caller list.
message ResolveCredentialRequest {
  string credential_id = 1;
}

message ResolveCredentialResponse {
  bytes value = 1; // plaintext, caller must not persist or log
}

message RotateCredentialRequest {
  string credential_id = 1;
  bytes new_encrypted_envelope = 2;
}

message RotateCredentialResponse {
  CredentialMetadata metadata = 1;
}

message RevokeCredentialRequest {
  string credential_id = 1;
}

message RevokeCredentialResponse {}

message GetCredentialMetadataRequest {
  string credential_id = 1;
}

message GetCredentialMetadataResponse {
  CredentialMetadata metadata = 1;
}

message ResolveCredentialByOwnerRequest {
  string tenant_id = 1;
  CredentialCategory category = 2;
  string owner_id = 3;
}

message ResolveCredentialByOwnerResponse {
  bytes value = 1; // plaintext, caller must not persist or log — same contract as ResolveCredentialResponse.value
}

message RevokeCredentialByOwnerRequest {
  string tenant_id = 1;
  CredentialCategory category = 2;
  string owner_id = 3;
}

message RevokeCredentialByOwnerResponse {}

message SignVapidPayloadRequest {
  string tenant_id = 1;
  bytes payload = 2;
}

message SignVapidPayloadResponse {
  string signature = 1; // Vault Transit's ciphertext/signature string form, opaque to the caller
}

message GetCredentialMetadataByOwnerRequest {
  string tenant_id = 1;
  CredentialCategory category = 2;
  string owner_id = 3;
}
message GetCredentialMetadataByOwnerResponse {
  // metadata is unset (not an error) when no credential exists yet for
  // this (tenant, category, owner) — the normal "not configured" case
  // credentials.status must distinguish from a real error.
  optional CredentialMetadata metadata = 1;
}

message ListCredentialsByCategoryRequest {
  string tenant_id = 1;
  CredentialCategory category = 2;
}
message ListCredentialsByCategoryResponse {
  repeated CredentialMetadata credentials = 1;
}
