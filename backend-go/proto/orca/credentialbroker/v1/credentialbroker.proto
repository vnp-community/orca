syntax = "proto3";

package orca.credentialbroker.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/credentialbroker/v1;credentialbrokerv1";

// CredentialBrokerService mediates ALL tenant/user secret material through
// Vault — it stores metadata only, never plaintext or ciphertext itself.
// Every service EXCEPT this one is Vault-scoped only to its own dynamic DB
// credential lease. See specs/backend-go/services/credential-broker-service.md
// and architecture/06-secrets-vault-architecture.md — this is the centerpiece
// of the user's "use Vault for sensitive data" requirement.
service CredentialBrokerService {
  rpc WriteCredential(WriteCredentialRequest) returns (WriteCredentialResponse);
  rpc ResolveCredential(ResolveCredentialRequest) returns (ResolveCredentialResponse);
  rpc RotateCredential(RotateCredentialRequest) returns (RotateCredentialResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
}

enum CredentialCategory {
  CREDENTIAL_CATEGORY_UNSPECIFIED = 0;
  CREDENTIAL_CATEGORY_SCM_OAUTH = 1;
  CREDENTIAL_CATEGORY_ISSUE_TRACKER_OAUTH = 2;
  CREDENTIAL_CATEGORY_AI_PROVIDER_KEY = 3;
  CREDENTIAL_CATEGORY_SSH = 4;
  CREDENTIAL_CATEGORY_SERVICE_SECRET = 5;
}

message CredentialMetadata {
  string id = 1;
  string tenant_id = 2;
  string owner_id = 3; // user id or service name
  CredentialCategory category = 4;
  string status = 5; // active|rotating|revoked
  string vault_path = 6; // reference only, never the secret itself
}

// WriteCredential accepts a client-side-encrypted envelope; the broker
// decrypts it transiently in-memory for this single request only, then
// immediately re-encrypts via Vault Transit / writes to KV — plaintext never
// touches disk or logs. See credential-broker-service.md section 9.
message WriteCredentialRequest {
  string tenant_id = 1;
  string owner_id = 2;
  CredentialCategory category = 3;
  bytes encrypted_envelope = 4;
}

message WriteCredentialResponse {
  CredentialMetadata metadata = 1;
}

// ResolveCredential is called only by services explicitly authorized to
// mediate a secret on behalf of a request (ai-provider-service,
// scm-integration-service, issue-tracking-service, infra-fleet-service) —
// enforced by Vault policy, not just by this RPC's caller list.
message ResolveCredentialRequest {
  string credential_id = 1;
}

message ResolveCredentialResponse {
  bytes value = 1; // plaintext, caller must not persist or log
}

message RotateCredentialRequest {
  string credential_id = 1;
  bytes new_encrypted_envelope = 2;
}

message RotateCredentialResponse {
  CredentialMetadata metadata = 1;
}

message RevokeCredentialRequest {
  string credential_id = 1;
}

message RevokeCredentialResponse {}
