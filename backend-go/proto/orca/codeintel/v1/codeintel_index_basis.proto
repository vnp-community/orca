// IndexBasis proto definition - CR-CV-080 / BE-CV-TASK-080-01.
syntax = "proto3";

package orca.codeintel.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/codeintel/v1;codeintelv1";

import "google/protobuf/timestamp.proto";

message IndexBasis {
  string tool = 1;
  string index_scope = 2;
  string freshness = 3;
  string indexed_commit = 4;
  string head_commit = 5;
  string merge_base = 6;
  google.protobuf.Timestamp indexed_at = 7;
  bool dirty_since_index = 8;
  int32 changed_files_not_in_index = 9;
  string refresh_state = 10;
  string trigger = 11;
  string tool_version = 12;
  string index_policy = 13;
}
