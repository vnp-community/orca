// Quality gate service and models - CR-CV-085 / BE-CV-TASK-085-02.
syntax = "proto3";

package orca.codeintel.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/codeintel/v1;codeintelv1";

import "google/protobuf/timestamp.proto";
import "orca/codeintel/v1/codeintel_common.proto";
import "orca/codeintel/v1/codeintel_quality.proto";

service QualityGateService {
  rpc StartQualityRun(StartQualityRunRequest) returns (StartQualityRunResponse);
  rpc GetQualityRun(GetQualityRunRequest) returns (GetQualityRunResponse);
  rpc ListQualityRuns(ListQualityRunsRequest) returns (ListQualityRunsResponse);
  rpc CancelQualityRun(CancelQualityRunRequest) returns (CancelQualityRunResponse);
  rpc ListQualityFindings(ListQualityFindingsRequest) returns (ListQualityFindingsResponse);
  rpc WaiveFinding(WaiveFindingRequest) returns (WaiveFindingResponse);
  rpc GetQualityGate(GetQualityGateRequest) returns (GetQualityGateResponse);
  rpc GetQualityProfile(GetQualityProfileRequest) returns (GetQualityProfileResponse);
  rpc SaveQualityProfile(SaveQualityProfileRequest) returns (SaveQualityProfileResponse);
  rpc GetQualityTrend(GetQualityTrendRequest) returns (GetQualityTrendResponse);
}

message QualityGate {
  string status = 1; // pass | warn | fail | unknown
  string profile = 2;
  repeated QualityGateReason reasons = 3;
}

message QualityGateReason {
  string category = 1;
  string tool = 2;
  string code = 3;
  string message = 4;
  map<string, string> params = 5;
  string run_id = 6;
  int32 waived_count = 7;
}

message QualityProfileDefinition {
  int32 schema_version = 1;
  string name = 2;
  string mode = 3; // warn | block
  int32 max_errors = 4;
  int32 max_warnings = 5;
  int32 max_failed = 6;
  repeated string when_changed_paths = 7;
  string raw_json = 8;
}

message QualityProfile {
  string id = 1;
  string name = 2;
  string scope = 3; // tenant | repo
  string scope_id = 4;
  QualityProfileDefinition definition = 5;
  int64 version = 6;
  string origin = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message QualityWaiver {
  string id = 1;
  string subject_kind = 2;
  string subject_key = 3;
  string reason = 4;
  google.protobuf.Timestamp expires_at = 5;
  string scope = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

message QualityTrendPoint {
  string key = 1;
  google.protobuf.Timestamp timestamp = 2;
  int32 error_count = 3;
  int32 warning_count = 4;
  int32 info_count = 5;
  string status = 6;
}

message GetQualityGateRequest {
  WorktreeSelector selector = 1;
  string base_ref = 2;
  string profile_name = 3;
  string turn_key = 4;
  bool record = 5;
  bool include_waived_detail = 6;
}

message GetQualityGateResponse {
  QualityGate gate = 1;
  repeated QualityWaiver waivers = 2;
  google.protobuf.Timestamp evaluated_at = 3;
  string profile_definition_digest = 4;
}

message GetQualityProfileRequest {
  WorktreeSelector selector = 1;
  string repo_id = 2;
  string name = 3;
}

message GetQualityProfileResponse {
  QualityProfile profile = 1;
  string origin = 2;
  int64 version = 3;
  repeated string runnable_profiles = 4;
}

message SaveQualityProfileRequest {
  WorktreeSelector selector = 1;
  string scope = 2;
  string name = 3;
  QualityProfileDefinition definition = 4;
  int64 expected_version = 5;
}

message SaveQualityProfileResponse {
  QualityProfile profile = 1;
  repeated string warnings = 2;
}

message StartQualityRunRequest {
  WorktreeSelector selector = 1;
  string profile = 2;
  string scope = 3;
  string base = 4;
}

message StartQualityRunResponse {
  QualityRun run = 1;
}

message GetQualityRunRequest {
  WorktreeSelector selector = 1;
  string run_id = 2;
}

message GetQualityRunResponse {
  QualityRun run = 1;
}

message ListQualityRunsRequest {
  WorktreeSelector selector = 1;
  int32 limit = 2;
  string source = 3;
  string page_token = 4;
}

message ListQualityRunsResponse {
  repeated QualityRun runs = 1;
  string next_page_token = 2;
}

message CancelQualityRunRequest {
  WorktreeSelector selector = 1;
  string run_id = 2;
}

message CancelQualityRunResponse {
  QualityRun run = 1;
}

message ListQualityFindingsRequest {
  WorktreeSelector selector = 1;
  string run_id = 2;
  repeated string severities = 3;
  repeated string categories = 4;
  string file = 5;
  bool in_scope = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message ListQualityFindingsResponse {
  repeated QualityFinding findings = 1;
  int64 total_count = 2;
  bool truncated = 3;
  int32 outside_scope_count = 4;
  string next_page_token = 5;
}

message WaiveFindingRequest {
  WorktreeSelector selector = 1;
  string subject_kind = 2;
  string subject_key = 3;
  string action = 4;
  string reason = 5;
  google.protobuf.Timestamp expires_at = 6;
  string scope = 7;
}

message WaiveFindingResponse {
  QualityWaiver waiver = 1;
}

message GetQualityTrendRequest {
  WorktreeSelector selector = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int32 limit = 4;
  string group_by = 5;
}

message GetQualityTrendResponse {
  repeated QualityTrendPoint points = 1;
  bool truncated = 2;
  int64 total_count = 3;
}
