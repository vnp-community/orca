syntax = "proto3";

package orca.project.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/project/v1;projectv1";

// ProjectService owns projects, membership, dev-server binding, repo/worktree metadata.
// See specs/backend-go/services/project-service.md.
service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RebindDevServer(RebindDevServerRequest) returns (RebindDevServerResponse);

  // UpdateProject's field list deliberately excludes dev_server_id —
  // RebindDevServer (with its active-execution guard) stays the sole path
  // that may change it, per project-service.md §3's explicit note. An empty
  // string on any field below means "no change", not "clear the field".
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // Repo surface — project-service.md §4's Repo entity, ordered per project.
  rpc AddRepo(AddRepoRequest) returns (AddRepoResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc ReorderRepos(ReorderReposRequest) returns (ReorderReposResponse);
  rpc RemoveRepo(RemoveRepoRequest) returns (RemoveRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  // GetRepo answers git-gateway-service's "does this repo exist, and which
  // dev server does it live on" — ListRepos(project_id) was the only repo
  // lookup RPC before this, unusable when a caller only has a repo_id (see
  // git-gateway-service's project_client.go GetRepo doc comment for the
  // confirmed gap this closes).
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);

  // repo_members — a functional-role tier (developer/lead/admin) layered on
  // top of project membership (AddMember/ListMembers/... above): decides
  // what a project member can do on ONE specific repo, not the project as a
  // whole. See policy/orca-authz/repo.rego and project-service's
  // requireRepoAccess.
  rpc AddRepoMember(AddRepoMemberRequest) returns (AddRepoMemberResponse);
  rpc ListRepoMembers(ListRepoMembersRequest) returns (ListRepoMembersResponse);
  rpc RemoveRepoMember(RemoveRepoMemberRequest) returns (RemoveRepoMemberResponse);
  rpc UpdateRepoMemberRole(UpdateRepoMemberRoleRequest) returns (UpdateRepoMemberRoleResponse);

  // Worktree surface — metadata only, never authoritative for on-disk
  // existence (git-gateway-service reconciles on demand, per
  // project-service.md §4's Worktree note).
  rpc RecordWorktreeCreated(RecordWorktreeCreatedRequest) returns (RecordWorktreeCreatedResponse);
  rpc RecordWorktreeRemoved(RecordWorktreeRemovedRequest) returns (RecordWorktreeRemovedResponse);
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);
  rpc SetWorktreeActivation(SetWorktreeActivationRequest) returns (SetWorktreeActivationResponse);
  rpc RenameWorktree(RenameWorktreeRequest) returns (RenameWorktreeResponse);
  // ListWorktreeLineage returns every worktree with an explicitly-captured
  // parent (tenant-scoped via RLS, no request params — mirrors the old TS
  // backend's worktree.lineageList, explicit-capture only per
  // docs/execution-plan.md's frontend-compatibility-layer coverage table).
  rpc ListWorktreeLineage(ListWorktreeLineageRequest) returns (ListWorktreeLineageResponse);

  // ProjectGroup surface — self-referential tree via parent_group_id, per
  // project-service.md §4.
  rpc CreateProjectGroup(CreateProjectGroupRequest) returns (CreateProjectGroupResponse);
  rpc UpdateProjectGroup(UpdateProjectGroupRequest) returns (UpdateProjectGroupResponse);
  rpc DeleteProjectGroup(DeleteProjectGroupRequest) returns (DeleteProjectGroupResponse);
  rpc ListProjectGroups(ListProjectGroupsRequest) returns (ListProjectGroupsResponse);

  // Folder workspaces — standalone, non-git filesystem paths added directly
  // to the workspace. No project_id — see FolderWorkspace's doc comment
  // below. See specs/backend-go/bugs/missing-v1/solutions/SOL-010-folderworkspace-channels.md.
  rpc CreateFolderWorkspace(CreateFolderWorkspaceRequest) returns (CreateFolderWorkspaceResponse);
  rpc UpdateFolderWorkspace(UpdateFolderWorkspaceRequest) returns (UpdateFolderWorkspaceResponse);
  rpc DeleteFolderWorkspace(DeleteFolderWorkspaceRequest) returns (DeleteFolderWorkspaceResponse);
  rpc ListFolderWorkspaces(ListFolderWorkspacesRequest) returns (ListFolderWorkspacesResponse);
  // GetFolderWorkspacePathStatus is a DB-conflict check against this
  // service's own tables, NOT a live filesystem probe — see the response
  // message's doc comment.
  rpc GetFolderWorkspacePathStatus(GetFolderWorkspacePathStatusRequest) returns (GetFolderWorkspacePathStatusResponse);

  // MoveProject/ScanNested/ImportNested: nested-repo import workflow —
  // project-service.md §5's project_groups.project_id column, first
  // exercised by these RPCs.
  rpc MoveProject(MoveProjectRequest) returns (MoveProjectResponse);
  rpc ScanNested(ScanNestedRequest) returns (ScanNestedResponse);
  rpc ImportNested(ImportNestedRequest) returns (ImportNestedResponse);

  // ── projectHostSetup.* — pre-project dev-server-folder wizard ─────────
  rpc CreateHostSetup(CreateHostSetupRequest) returns (CreateHostSetupResponse);
  rpc ListHostSetups(ListHostSetupsRequest) returns (ListHostSetupsResponse);
  rpc UpdateHostSetup(UpdateHostSetupRequest) returns (UpdateHostSetupResponse);
  rpc DeleteHostSetup(DeleteHostSetupRequest) returns (DeleteHostSetupResponse);
  rpc SetupExistingFolder(SetupExistingFolderRequest) returns (SetupExistingFolderResponse);
}

message Project {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string dev_server_id = 4;
  string description = 5;
  string default_branch = 6;
  string visibility = 7; // private | team | department | company
  string created_by = 8; // logical FK -> tenant-service user id
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateProjectRequest {
  string tenant_id = 1;
  string name = 2;
  string description = 3;
  string default_branch = 4;
  string visibility = 5;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  string tenant_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  string next_page_token = 2;
}

enum ProjectRole {
  PROJECT_ROLE_UNSPECIFIED = 0;
  PROJECT_ROLE_MEMBER = 1;
  PROJECT_ROLE_OWNER = 2;
}

message AddMemberRequest {
  string project_id = 1;
  string user_id = 2;
  ProjectRole role = 3;
}

message AddMemberResponse {}

message Member {
  string user_id = 1;
  ProjectRole role = 2;
}

message ListMembersRequest {
  string project_id = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message RemoveMemberRequest {
  string project_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message UpdateMemberRoleRequest {
  string project_id = 1;
  string user_id = 2;
  ProjectRole role = 3;
}

message UpdateMemberRoleResponse {
  Member member = 1;
}

// RebindDevServer closes TS's PROJECT_HAS_ACTIVE_WORKFLOWS gap: the usecase
// layer checks workflow-service/task-service for active executions before
// allowing this to succeed. See project-service.md section on the rebind guard.
message RebindDevServerRequest {
  string project_id = 1;
  string new_dev_server_id = 2;
}

message RebindDevServerResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string project_id = 1;
  string name = 2; // empty = no change
  string description = 3; // empty = no change
  string default_branch = 4; // empty = no change
  string visibility = 5; // empty = no change
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {}

message Repo {
  string id = 1;
  string project_id = 2;
  string url = 3;
  string display_name = 4;
  int32 position = 5; // ordering within project — see ReorderRepos
}

message AddRepoRequest {
  string project_id = 1;
  string url = 2;
  string display_name = 3;
}

message AddRepoResponse {
  Repo repo = 1;
}

message ListReposRequest {
  string project_id = 1;
}

message ListReposResponse {
  repeated Repo repos = 1; // ordered by position
}

message ReorderReposRequest {
  string project_id = 1;
  repeated string repo_ids_in_order = 2;
}

message ReorderReposResponse {}

message RemoveRepoRequest {
  string repo_id = 1;
}

message RemoveRepoResponse {}

message UpdateRepoRequest {
  string repo_id = 1;
  string url = 2;          // empty = no change
  string display_name = 3; // empty = no change
}

message UpdateRepoResponse {
  Repo repo = 1;
}

message GetRepoRequest {
  string repo_id = 1;
}

message GetRepoResponse {
  Repo repo = 1;
  // dev_server_id is the repo's OWNING PROJECT's dev-server binding, not a
  // field on Repo itself (project.repos has no such column — see
  // domain.Repo's doc comment) — resolved server-side by joining through
  // Repo.project_id so callers like git-gateway-service don't need a
  // second RPC to look up the project.
  string dev_server_id = 2;
}

enum RepoRole {
  REPO_ROLE_UNSPECIFIED = 0;
  REPO_ROLE_DEVELOPER = 1;
  REPO_ROLE_LEAD = 2;
  REPO_ROLE_ADMIN = 3;
}

message RepoMember {
  string repo_id = 1;
  string user_id = 2;
  RepoRole role = 3;
}

message AddRepoMemberRequest {
  string repo_id = 1;
  string user_id = 2;
  RepoRole role = 3;
}

message AddRepoMemberResponse {
  RepoMember member = 1;
}

message ListRepoMembersRequest {
  string repo_id = 1;
}

message ListRepoMembersResponse {
  repeated RepoMember members = 1;
}

message RemoveRepoMemberRequest {
  string repo_id = 1;
  string user_id = 2;
}

message RemoveRepoMemberResponse {}

message UpdateRepoMemberRoleRequest {
  string repo_id = 1;
  string user_id = 2;
  RepoRole role = 3;
}

message UpdateRepoMemberRoleResponse {
  RepoMember member = 1;
}

message Worktree {
  string id = 1;
  string project_id = 2;
  string repo_id = 3;
  string path = 4;
  string branch = 5;
  bool active = 6;

  // Lineage — explicit-capture only for now (see WorktreeLineageEntry's doc
  // comment). Unset when this worktree wasn't created with a captured
  // parent context.
  optional string parent_worktree_id = 7;
  optional string origin = 8;
  optional string capture_source = 9;
  optional string capture_confidence = 10;
  optional string task_id = 11;
  optional string orchestration_run_id = 12;
  optional string coordinator_handle = 13;
  optional string created_by_terminal_handle = 14;
  int64 created_at_unix_ms = 15;
}

message RecordWorktreeCreatedRequest {
  string project_id = 1;
  string repo_id = 2;
  string path = 3;
  string branch = 4;

  // Optional lineage-capture context, threaded through from the caller
  // (git-gateway-service's CreateWorktree saga) when this worktree was
  // branched from another one. capture_confidence is NOT a caller input —
  // project-service always stamps "explicit" when any of these are set,
  // since inferred capture (branch-description scanning) isn't ported yet.
  optional string parent_worktree_id = 5;
  optional string origin = 6;
  optional string capture_source = 7;
  optional string task_id = 8;
  optional string orchestration_run_id = 9;
  optional string coordinator_handle = 10;
  optional string created_by_terminal_handle = 11;
}

message RecordWorktreeCreatedResponse {
  Worktree worktree = 1;
}

message RecordWorktreeRemovedRequest {
  string worktree_id = 1;
}

message RecordWorktreeRemovedResponse {}

message ListWorktreesRequest {
  string project_id = 1;
}

message ListWorktreesResponse {
  repeated Worktree worktrees = 1;
}

message SetWorktreeActivationRequest {
  string worktree_id = 1;
  bool active = 2;
}

message SetWorktreeActivationResponse {
  Worktree worktree = 1;
}

message RenameWorktreeRequest {
  string worktree_id = 1;
  string branch = 2;
}

message RenameWorktreeResponse {
  Worktree worktree = 1;
}

message ListWorktreeLineageRequest {}

message ListWorktreeLineageResponse {
  repeated WorktreeLineageEntry lineage = 1;
}

// WorktreeLineageEntry mirrors frontend/src/shared/types.ts's WorktreeLineage
// — one entry per worktree that has an explicitly-captured parent.
// capture_confidence is always "explicit" today: inferring lineage from a
// worktree's git branch description (the old TS backend's
// extractOrchestrationTaskId) isn't ported — git-gateway-service has no RPC
// to read a branch description yet. worktree_instance_id/
// parent_worktree_instance_id from the TS shape are deliberately omitted:
// backend-go has no separate "instance" concept, so wscompat mirrors
// worktree_id/parent_worktree_id into both wire fields.
message WorktreeLineageEntry {
  string worktree_id = 1;
  optional string parent_worktree_id = 2;
  optional string origin = 3;
  optional string capture_source = 4;
  optional string capture_confidence = 5;
  optional string task_id = 6;
  optional string orchestration_run_id = 7;
  optional string coordinator_handle = 8;
  optional string created_by_terminal_handle = 9;
  int64 created_at_unix_ms = 10;
}

message ProjectGroup {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string parent_group_id = 4; // empty = root of its tree
  string project_id = 5;      // empty = pure folder node, not yet linked to a project
}

message CreateProjectGroupRequest {
  string name = 1;
  string parent_group_id = 2;
}

message CreateProjectGroupResponse {
  ProjectGroup group = 1;
}

message UpdateProjectGroupRequest {
  string group_id = 1;
  string name = 2;
}

message UpdateProjectGroupResponse {
  ProjectGroup group = 1;
}

message DeleteProjectGroupRequest {
  string group_id = 1;
}

message DeleteProjectGroupResponse {}

message ListProjectGroupsRequest {}

message ListProjectGroupsResponse {
  repeated ProjectGroup groups = 1;
}

// FolderWorkspace is a standalone, non-git filesystem path added directly
// to the workspace — distinct from ProjectGroup (a project-organizing tree
// node with no path field) and from Repo (git-backed, owned by a Project).
// See specs/backend-go/bugs/missing-v1/solutions/SOL-010-folderworkspace-channels.md.
message FolderWorkspace {
  string id = 1;
  string dev_server_id = 2;   // logical FK -> infra-fleet-service.dev_servers
  string path = 3;            // absolute path on the bound dev server
  string name = 4;            // display name (defaults to basename(path) if unset on create)
  string added_by = 5;        // logical FK -> tenant-service.users
  google.protobuf.Timestamp created_at = 6;
  string project_group_id = 7; // empty = no group, logical FK -> project.project_groups
}

message CreateFolderWorkspaceRequest {
  string dev_server_id = 1;
  string path = 2;
  string name = 3;
  string project_group_id = 4; // empty = no group
}

message CreateFolderWorkspaceResponse {
  FolderWorkspace folder_workspace = 1;
}

message UpdateFolderWorkspaceRequest {
  string id = 1;
  string name = 2;   // the only mutable field — path/dev_server_id are re-add, not edit
}

message UpdateFolderWorkspaceResponse {
  FolderWorkspace folder_workspace = 1;
}

message DeleteFolderWorkspaceRequest {
  string id = 1;
}

message DeleteFolderWorkspaceResponse {}

message ListFolderWorkspacesRequest {} // tenant-scoped, no filter params observed at the frontend call site

message ListFolderWorkspacesResponse {
  repeated FolderWorkspace folder_workspaces = 1;
}

// GetFolderWorkspacePathStatus answers purely from project-service's own
// tables — a DB-conflict check, NOT a live filesystem probe. See this RPC's
// design note in SOL-010 before changing that assumption.
message GetFolderWorkspacePathStatusRequest {
  string dev_server_id = 1;
  string path = 2;
}

message GetFolderWorkspacePathStatusResponse {
  // PATH_STATUS_AVAILABLE | PATH_STATUS_ALREADY_FOLDER_WORKSPACE |
  // PATH_STATUS_ALREADY_REPO | PATH_STATUS_INVALID
  string status = 1;
  string existing_folder_workspace_id = 2;  // set when status == ALREADY_FOLDER_WORKSPACE
}

message MoveProjectRequest {
  string project_id = 1;
  string target_parent_group_id = 2; // empty = move to tree root
}

message MoveProjectResponse {
  ProjectGroup group = 1; // the project's (possibly newly-created) leaf group node, relocated
}

message ScanNestedRequest {
  string dev_server_id = 1;
  string root_path = 2; // absolute path on that dev server to scan under
}

message NestedRepoCandidate {
  string path = 1;
  string suggested_name = 2;
  bool is_git_repo = 3;
}

message ScanNestedResponse {
  repeated NestedRepoCandidate candidates = 1;
}

message ImportNestedRequest {
  string dev_server_id = 1;
  string parent_group_id = 2; // where the imported tree attaches; empty = root
  repeated NestedRepoCandidate selected = 3; // subset of a prior ScanNested's candidates the caller chose
}

message ImportNestedResponse {
  repeated ProjectGroup created_groups = 1;
  repeated Project created_projects = 2;
}

message HostSetup {
  string id = 1;
  string tenant_id = 2;
  string dev_server_id = 3; // logical FK -> infra-fleet-service.dev_servers
  string folder_path = 4;
  string display_name = 5;
  string status = 6;        // pending | validated | completed | failed
  string project_id = 7;    // empty until completed
}

message CreateHostSetupRequest {
  string dev_server_id = 1;
  string folder_path = 2;
  string display_name = 3;
}
message CreateHostSetupResponse {
  HostSetup setup = 1;
}

message ListHostSetupsRequest {}
message ListHostSetupsResponse {
  repeated HostSetup setups = 1;
}

message UpdateHostSetupRequest {
  string id = 1;
  string folder_path = 2;  // empty = no change
  string display_name = 3; // empty = no change
}
message UpdateHostSetupResponse {
  HostSetup setup = 1;
}

message DeleteHostSetupRequest {
  string id = 1;
}
message DeleteHostSetupResponse {}

// SetupExistingFolder validates folder_path exists on dev_server_id
// (relayed to the Dev Server Agent via infra-fleet-service, never checked
// against project-service's own host), then creates a real Project + Repo
// from it and marks the HostSetup completed (or failed).
message SetupExistingFolderRequest {
  string id = 1; // the HostSetup being finalized
}
message SetupExistingFolderResponse {
  HostSetup setup = 1;  // status now "completed" or "failed"
  Project project = 2;  // set only on success
}
