syntax = "proto3";

package orca.orchestration.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/orchestration/v1;orchestrationv1";

// OrchestrationService: real-time multi-agent coordination (messages, gates,
// dispatch contexts) — a distinct id space from task-service's tasks table.
// See specs/backend-go/services/orchestration-service.md.
service OrchestrationService {
  rpc CreateDispatchContext(CreateDispatchContextRequest) returns (CreateDispatchContextResponse);
  rpc CreateGate(CreateGateRequest) returns (CreateGateResponse);
  rpc ResolveGate(ResolveGateRequest) returns (ResolveGateResponse);
  // UpdateTaskStatusAndPromote is one atomic RPC (single DB transaction) —
  // mirrors TS's updateTaskStatus -> promoteReadyTasks chain.
  rpc UpdateTaskStatusAndPromote(UpdateTaskStatusAndPromoteRequest) returns (UpdateTaskStatusAndPromoteResponse);

  // GetDispatchContextForTask is orchestration-service's first read RPC —
  // a scope addition beyond both the shipped proto and
  // orchestration-service.md §3's own drafted surface (neither has a
  // dispatch-context read). Backs orchestration.dispatchShow: "which
  // terminal was this task dispatched to." See SOL-018 for the "not a
  // missing assignee_handle field, a missing read RPC" distinction.
  rpc GetDispatchContextForTask(GetDispatchContextForTaskRequest) returns (GetDispatchContextForTaskResponse);

  // ListActiveDispatchContextsForUser: every non-terminal dispatch context
  // for the calling user (tenant/user from identity, not a request field).
  // Added for CR-STORAGE-006/007 — see
  // docs/backlog/BACKLOG-006-dispatch-context-user-linkage-decision.md.
  rpc ListActiveDispatchContextsForUser(ListActiveDispatchContextsForUserRequest) returns (ListActiveDispatchContextsForUserResponse);

  // FailDispatch records a real dispatch-attempt failure against
  // dispatch_context_id, tripping the circuit breaker at
  // failure_count >= 3 (orchestration-service.md §4). The caller passes the
  // gRPC status code its own failed dispatch/relay call returned so this
  // RPC can classify transport-vs-real failure the same way
  // ClassifyDispatchFailure does for an in-process caller — a transport
  // failure (UNAVAILABLE/DEADLINE_EXCEEDED) is intentionally NOT recorded,
  // matching BE-SOL-STORAGE-003 §4's "a transient network blip must not
  // trip the circuit breaker" rule. See
  // docs/backlog/BACKLOG-009-orchestration-service-fail-dispatch-missing.md.
  rpc FailDispatch(FailDispatchRequest) returns (FailDispatchResponse);

  // StartCoordinatorRun is task-service's entry point into the complex
  // execution path (orchestration-service.md §2.2/§3): starts a
  // coordinator_run for a spec_json-described DAG and returns immediately —
  // this call does NOT block for the DAG to finish. orchestration-service's
  // own tick loop (TASK-TASKV1-005-10) autonomously advances the run and
  // calls back into task-service (ReportTaskExecutionResult, SOL-TG-04) to
  // report the terminal result.
  rpc StartCoordinatorRun(StartCoordinatorRunRequest) returns (CoordinatorRun);

  // GetCoordinatorRun is a plain point-in-time read, used by any caller
  // polling a run's current status/result.
  rpc GetCoordinatorRun(GetCoordinatorRunRequest) returns (CoordinatorRun);

  // CompleteCoordinatorRun and FailCoordinatorRun are exposed as
  // caller-invokable RPCs (not only internal transitions the tick loop
  // triggers) so an operator/admin path can force-finalize a stuck run
  // without waiting for the autonomous loop — orchestration-service.md §3
  // lists both as part of the RPC surface, not only as an internal detail.
  rpc CompleteCoordinatorRun(CompleteCoordinatorRunRequest) returns (CoordinatorRun);
  rpc FailCoordinatorRun(FailCoordinatorRunRequest) returns (CoordinatorRun);

  // RecordHeartbeat sits in the coordinator's tight poll loop
  // (orchestration-service.md §8: "p99 < 30ms, no cross-service calls on
  // that path") — reuses DispatchContext, no new message type needed,
  // matching GetDispatchContextForTaskResponse's existing convention.
  rpc RecordHeartbeat(RecordHeartbeatRequest) returns (DispatchContext);

  // ListPendingDecisionGates: every pending decision_gates row for the
  // calling tenant (tenant from identity, not a request field) — matches
  // ListActiveDispatchContextsForUserRequest's pattern.
  rpc ListPendingDecisionGates(ListPendingDecisionGatesRequest) returns (ListPendingDecisionGatesResponse);
}

message OrchestrationTaskSpec {
  string temp_id = 1; // task-service's own Task.ID, carried as a reference — NOT the primary key here (distinct id spaces, §2.1)
  string title = 2;
  string prompt = 3;         // description or prompt_template, whichever the caller resolved
  repeated string deps = 4;  // temp_ids of sibling nodes in THIS SAME request this node depends on
}

message DispatchContext {
  string id = 1;
  string handle = 2; // KeyedAsyncQueue serialization key
  string coordinator_run_id = 3;
  // orchestration_task_id round-trips the owning task id set on creation.
  // See docs/execution-plan.md Epic C: added so callers can observe the FK
  // they supplied on CreateDispatchContextRequest.
  string orchestration_task_id = 4;
  // user_id: the caller who initiated this dispatch, from identity at
  // creation time. Empty for a system-initiated dispatch with no end-user
  // caller. Added for CR-STORAGE-006/007.
  string user_id = 5;
  string status = 6;
  int32 failure_count = 7;
  string last_heartbeat_at = 8; // RFC3339; empty if never heartbeated
  // worktree_id: the frontend worktree this dispatch is running for,
  // caller-supplied on CreateDispatchContextRequest (like handle/
  // coordinator_run_id/orchestration_task_id, unlike user_id). Empty for a
  // dispatch with no worktree association. See
  // docs/backlog/BACKLOG-013-dispatch-context-handle-worktree-linkage.md.
  string worktree_id = 9;
}

message CreateDispatchContextRequest {
  string handle = 1;
  string coordinator_run_id = 2;
  // orchestration_task_id is the owning OrchestrationTask this dispatch
  // attempt belongs to. Optional: an ad-hoc coordinator-only dispatch (no
  // task yet) legitimately omits it. See docs/execution-plan.md Epic C —
  // without this, dispatch_contexts.orchestration_task_id was always NULL
  // and CreateGate could never resolve a task to block, failing closed with
  // ORCH_DISPATCH_CONTEXT_NO_TASK for every dispatch context.
  string orchestration_task_id = 3;
  // worktree_id: the frontend worktree this dispatch is running for.
  // Optional — an ad-hoc dispatch with no worktree association
  // legitimately omits it. See
  // docs/backlog/BACKLOG-013-dispatch-context-handle-worktree-linkage.md.
  string worktree_id = 4;
}

message CreateDispatchContextResponse {
  DispatchContext context = 1;
}

message DecisionGate {
  string id = 1;
  string dispatch_context_id = 2;
  string status = 3; // pending|resolved|failed
  // question/options round-trip what the gate asked. See
  // docs/execution-plan.md Epic C — the usecase/repository layer already
  // accepted and persisted these; only the proto lacked the fields to carry
  // them over the wire.
  string question = 4;
  repeated string options = 5;
}

message CreateGateRequest {
  string dispatch_context_id = 1;
  // orchestration_task_id is intentionally NOT threaded into the CreateGate
  // usecase: it derives the owning task from dispatch_context_id itself via
  // a locked read (see orchestration-service's create_gate.go), a
  // deliberate derive-not-trust boundary. This field exists for API
  // symmetry / future callers but the server does not read it — see
  // docs/execution-plan.md Epic C.
  string orchestration_task_id = 2;
  // question/options: see docs/execution-plan.md Epic C — the
  // usecase/repository layer already accepted these but the proto never
  // carried them from the gRPC caller, so they always arrived empty.
  string question = 3;
  repeated string options = 4;
}

message CreateGateResponse {
  DecisionGate gate = 1;
}

message ResolveGateRequest {
  string gate_id = 1;
  string outcome_json = 2;
}

message ResolveGateResponse {
  DecisionGate gate = 1;
}

message UpdateTaskStatusAndPromoteRequest {
  string orchestration_task_id = 1;
  string new_status = 2;
}

message UpdateTaskStatusAndPromoteResponse {
  repeated string promoted_task_ids = 1;
}

message GetDispatchContextForTaskRequest {
  string orchestration_task_id = 1;
}

message GetDispatchContextForTaskResponse {
  // Unset when no dispatch context exists yet for this task — a legitimate
  // state (the task hasn't been dispatched), not an error. Reuses the
  // existing DispatchContext message; no new message type needed.
  DispatchContext dispatch = 1;
}

message ListActiveDispatchContextsForUserRequest {}   // tenant/user from identity, not a field — same pattern as infra-fleet-service's GetFleetConnectivitySummaryRequest

message ListActiveDispatchContextsForUserResponse {
  repeated DispatchContext dispatch_contexts = 1;
}

message FailDispatchRequest {
  string dispatch_context_id = 1;
  // Human-readable detail from the caller's own failed dispatch/relay call —
  // persisted verbatim as dispatch_contexts.last_failure when the failure is
  // actually recorded (see recorded in the response).
  string error_message = 2;
  // The standard gRPC status code (google.golang.org/grpc/codes.Code, e.g.
  // 14 = Unavailable, 4 = DeadlineExceeded) the caller's own failed call
  // returned. 0 (OK) or an unrecognized code both classify as a real
  // dispatch failure (fail-closed: count it) — only UNAVAILABLE/
  // DEADLINE_EXCEEDED are treated as transport, mirroring
  // usecase.ClassifyDispatchFailure exactly.
  uint32 grpc_status_code = 3;
}

message FailDispatchResponse {
  // The dispatch context as it stands after this call — unchanged from
  // before the call when recorded is false.
  DispatchContext context = 1;
  // True when this failure was classified as real and actually counted
  // toward failure_count/circuit_broken. False means it was classified as a
  // transient transport failure and intentionally NOT recorded.
  bool recorded = 2;
}

message CoordinatorRun {
  string id = 1;
  string origin_task_id = 2;      // logical FK -> task-service.Task.id, per §2.1
  string spec_json = 3;           // round-trips the caller-supplied spec verbatim
  string status = 4;              // idle|running|completed|failed
  string coordinator_handle = 5;
  int32 poll_interval_ms = 6;
  string worktree_id = 7;         // caller-supplied, same optional/nullable pattern as DispatchContext.worktree_id
  string result_json = 8;         // set when status=completed
  string error_message = 9;       // set when status=failed
}

// StartCoordinatorRunRequest.spec_json is an OPAQUE payload from
// task-service's ComplexExecutor (SOL-TG-04's buildOrchestrationSpec) —
// this service does not interpret task-service's shape, only the
// {tempId, title, spec, deps: [tempId,...]}[] array domain.ExpandSpec
// requires (TASK-TASKV1-005-03), matching §2.1's "distinct id space...
// task-service.Task.ID rides along as each node's origin reference, not
// as the primary key here."
message StartCoordinatorRunRequest {
  string origin_task_id = 1;
  string spec_json = 2;
  string worktree_id = 3; // optional
}

message GetCoordinatorRunRequest { string id = 1; }

message CompleteCoordinatorRunRequest {
  string id = 1;
  string result_json = 2;
}

message FailCoordinatorRunRequest {
  string id = 1;
  string error_message = 2;
}

message RecordHeartbeatRequest { string dispatch_context_id = 1; }

message ListPendingDecisionGatesRequest {}  // tenant from identity, matches ListActiveDispatchContextsForUserRequest's pattern

message ListPendingDecisionGatesResponse {
  repeated DecisionGate gates = 1;
}
