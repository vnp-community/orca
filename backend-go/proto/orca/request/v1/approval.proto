syntax = "proto3";

package orca.request.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

enum ApprovalSubjectType {
  APPROVAL_SUBJECT_TYPE_UNSPECIFIED = 0;
  APPROVAL_SUBJECT_TYPE_REQUEST_TYPE = 1;
  APPROVAL_SUBJECT_TYPE_SOLUTION = 2;
  APPROVAL_SUBJECT_TYPE_FINDINGS = 3;
  APPROVAL_SUBJECT_TYPE_ANSWER = 4;
  APPROVAL_SUBJECT_TYPE_PLAN = 5;
  APPROVAL_SUBJECT_TYPE_PHASE = 6;
  APPROVAL_SUBJECT_TYPE_TASK_LIST = 7;
  APPROVAL_SUBJECT_TYPE_PRE_DEPLOY = 8;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_REJECTED = 3;
  APPROVAL_STATUS_CANCELLED = 4;
  APPROVAL_STATUS_EXPIRED = 5;
}

message Approval {
  string id = 1;
  string tenant_id = 2;
  string request_id = 3;
  ApprovalSubjectType subject_type = 4;
  string subject_id = 5;
  string stage = 6;
  ApprovalStatus status = 7;
  string requested_by = 8;
  string decided_by = 9;
  google.protobuf.Timestamp decided_at = 10;
  string comment = 11;
  google.protobuf.Timestamp due_at = 12;
  int64 version = 13;
  string subject_digest = 14;
  bool self_approval_allowed = 15;
  string idempotency_key = 16;
  google.protobuf.Timestamp reminded_at = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  // 20 to 22 are filled only by ListPendingForUser (CONTRACT section 9 Q3) so the inbox needs no N+1 GetRequest.
  string request_title = 20;
  string request_type = 21;
  int64 request_number = 22;
}

message RequestApprovalRequest {
  string request_id = 1;
  ApprovalSubjectType subject_type = 2;
  string idempotency_key = 3;
  // CR-REQ-009: PRE_DEPLOY and reopening a closed gate need an explicit subject.
  string subject_id = 4;
  string comment = 5;
}

message ApproveRequest {
  string id = 1;
  string comment = 2;
  string expected_digest = 3;
  int64 expected_version = 4;
}

message RejectRequest {
  string id = 1;
  string comment = 2;
  string expected_digest = 3;
  int64 expected_version = 4;
}

// Deprecated: kept so buf breaking stays clean; Cancel now uses ApprovalServiceCancelRequest.
message CancelApprovalRequest {
  string id = 1;
  string reason = 2;
}

message ApprovalServiceCancelRequest {
  string id = 1;
  string reason = 2;
}

message ApprovalServiceCancelResponse {
  Approval approval = 1;
}

message GetApprovalRequest {
  string id = 1;
}

message GetApprovalResponse {
  Approval approval = 1;
}

message RequestApprovalResponse {
  Approval approval = 1;
}

message ApproveResponse {
  Approval approval = 1;
  string request_status = 2;
}

message RejectResponse {
  Approval approval = 1;
  string request_status = 2;
}

message ExtendApprovalRequest {
  string id = 1;
  // New absolute deadline is due_at + extend_seconds; admin or requester only.
  int32 extend_seconds = 2;
  string reason = 3;
  int64 expected_version = 4;
}

message ExtendApprovalResponse {
  Approval approval = 1;
}

message ListApprovalsRequest {
  string request_id = 1;
  ApprovalSubjectType subject_type = 2;
  ApprovalStatus status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
  string next_page_token = 2;
}

message ListPendingForUserRequest {
  ApprovalSubjectType subject_type = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPendingForUserResponse {
  repeated Approval approvals = 1;
  string next_page_token = 2;
}

// Deprecated: kept so buf breaking stays clean; Approve and Reject now return ApproveResponse and RejectResponse.
message DecideApprovalResponse {
  Approval approval = 1;
  string request_status = 2;
}

// CR-REQ-010 section 2.3. Admin-only CRUD of approver policies; separate service so its catalog group is admin.
message ApprovalPolicy {
  string id = 1;
  string tenant_id = 2;
  string project_id = 3;
  ApprovalSubjectType subject_type = 4;
  string request_type = 5;
  string size = 6;
  string urgency = 7;
  // Principals: "reporter", "user:<id>", "team:<id>", "role:admin".
  repeated string approvers = 8;
  bool allow_requester_approve = 9;
  optional int32 due_after_seconds = 10;
  int32 priority = 11;
  bool enabled = 12;
  int64 version = 13;
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message ListApprovalPoliciesRequest {
  string project_id = 1;
  ApprovalSubjectType subject_type = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListApprovalPoliciesResponse {
  repeated ApprovalPolicy policies = 1;
  string next_page_token = 2;
}

message UpsertApprovalPolicyRequest {
  ApprovalPolicy policy = 1;
  int64 expected_version = 2;
}

message UpsertApprovalPolicyResponse {
  ApprovalPolicy policy = 1;
}

message DeleteApprovalPolicyRequest {
  string id = 1;
  int64 expected_version = 2;
}

message DeleteApprovalPolicyResponse {}

service ApprovalService {
  rpc RequestApproval(RequestApprovalRequest) returns (RequestApprovalResponse);
  rpc Approve(ApproveRequest) returns (ApproveResponse);
  rpc Reject(RejectRequest) returns (RejectResponse);
  rpc Cancel(ApprovalServiceCancelRequest) returns (ApprovalServiceCancelResponse);
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc ListPendingForUser(ListPendingForUserRequest) returns (ListPendingForUserResponse);
  // README v6 section 8 row 12 / CR-REQ-010 Q4: extend the deadline instead of expire-then-reopen.
  rpc ExtendApproval(ExtendApprovalRequest) returns (ExtendApprovalResponse);
}

service ApprovalPolicyAdminService {
  rpc ListApprovalPolicies(ListApprovalPoliciesRequest) returns (ListApprovalPoliciesResponse);
  rpc UpsertApprovalPolicy(UpsertApprovalPolicyRequest) returns (UpsertApprovalPolicyResponse);
  rpc DeleteApprovalPolicy(DeleteApprovalPolicyRequest) returns (DeleteApprovalPolicyResponse);
}
