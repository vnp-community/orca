syntax = "proto3";

package orca.request.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

// AI governance admin API (CR-REQ-034). Every RPC requires role=admin.
// Money is a decimal string to avoid double rounding.

message AiBudget {
  string id = 1;
  // tenant | request_type | step | project
  string scope_kind = 2;
  string scope_value = 3;
  // day | month | request
  string period = 4;
  optional int64 limit_tokens = 5;
  optional int32 limit_calls = 6;
  optional int32 limit_agent_seconds = 7;
  optional string limit_cost_usd_est = 8;
  double warn_ratio = 9;
  // block | warn_only
  string action = 10;
  bool enabled = 11;
  int64 version = 12;
  string updated_by = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message AiStepPolicyEntry {
  string model = 1;
  string egress_class = 2;
  int32 max_tokens = 3;
  int32 timeout_seconds = 4;
}

message AiStepPolicy {
  string id = 1;
  string step = 2;
  string request_type = 3;
  string size = 4;
  repeated AiStepPolicyEntry chain = 5;
  int64 version = 6;
  string updated_by = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message AiTenantSettings {
  string ai_egress_mode = 1;
  string ai_trace_level = 2;
  // off | shadow (enforce is refused in v1).
  string ai_gate_mode = 3;
}

message ListAiBudgetsRequest {
  string scope_kind = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListAiBudgetsResponse {
  repeated AiBudget budgets = 1;
  string next_page_token = 2;
}

message UpsertAiBudgetRequest {
  AiBudget budget = 1;
  int64 expected_version = 2;
}

message UpsertAiBudgetResponse {
  AiBudget budget = 1;
}

message DeleteAiBudgetRequest {
  string id = 1;
  int64 expected_version = 2;
}

message DeleteAiBudgetResponse {}

message ListAiStepPoliciesRequest {
  string step = 1;
}

message ListAiStepPoliciesResponse {
  repeated AiStepPolicy policies = 1;
}

message UpsertAiStepPolicyRequest {
  AiStepPolicy policy = 1;
  int64 expected_version = 2;
}

message UpsertAiStepPolicyResponse {
  AiStepPolicy policy = 1;
  // Models the tenant config could not resolve; a warning, not an error.
  repeated string unresolved_models = 2;
}

message GetAiTenantSettingsRequest {}

message GetAiTenantSettingsResponse {
  AiTenantSettings settings = 1;
}

message SetAiTenantSettingsRequest {
  AiTenantSettings settings = 1;
}

message SetAiTenantSettingsResponse {
  AiTenantSettings settings = 1;
}

service AiBudgetAdminService {
  rpc ListAiBudgets(ListAiBudgetsRequest) returns (ListAiBudgetsResponse);
  rpc UpsertAiBudget(UpsertAiBudgetRequest) returns (UpsertAiBudgetResponse);
  rpc DeleteAiBudget(DeleteAiBudgetRequest) returns (DeleteAiBudgetResponse);
  rpc ListAiStepPolicies(ListAiStepPoliciesRequest) returns (ListAiStepPoliciesResponse);
  rpc UpsertAiStepPolicy(UpsertAiStepPolicyRequest) returns (UpsertAiStepPolicyResponse);
  rpc GetAiTenantSettings(GetAiTenantSettingsRequest) returns (GetAiTenantSettingsResponse);
  rpc SetAiTenantSettings(SetAiTenantSettingsRequest) returns (SetAiTenantSettingsResponse);
}
