syntax = "proto3";

package orca.request.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

import "google/protobuf/timestamp.proto";

// Test scripts generated by the Test Script Agent from the TCIR of a Request's test specs, in a worktree of their own, while the
// Request is executing (docs/integrate/TDD-REQ-TESTSCRIPT-001). A read model over the service's own table plus two actions; the
// lane never changes the status of the Request.

message TestScriptRun {
  string id = 1;
  // 1 for the first attempt; a Re-run or new test specs add one.
  int32 attempt = 2;
  // pending, running, completed, needs_review, blocked, failed, skipped or cancelled.
  string status = 3;
  // Why a run is needs_review, blocked, failed, skipped or cancelled (REQUEST_TESTSCRIPT_*).
  string reason_code = 4;
  string reason_message = 5;
  // The test specs read: their attempt, feature and version.
  string test_spec_run_id = 6;
  string feature = 7;
  int32 spec_version = 8;
  // The job on the dev server and where the scripts are: tsa/REQ-<n>-<feature>-v<version>, the worktree, the commit.
  string tsa_job_id = 9;
  string branch = 10;
  string base_ref = 11;
  string worktree_path = 12;
  string commit_sha = 13;
  // The job as the agent reported it when it ended: counts, files, report and manifest paths, cost. "{}" until then.
  string summary_json = 14;
  string started_by = 15;
  google.protobuf.Timestamp started_at = 16;
  google.protobuf.Timestamp finished_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message GetTestScriptsRequest {
  string request_id = 1;
}

message GetTestScriptsResponse {
  string request_id = 1;
  // False when the deployment does not generate test scripts: the screen shows nothing.
  bool enabled = 2;
  TestScriptRun current = 3;
  // Earlier attempts, newest first.
  repeated TestScriptRun history = 4;
}

message StartTestScriptsRequest {
  string request_id = 1;
}

message StartTestScriptsResponse {
  TestScriptRun run = 1;
}

message GetTestScriptReportRequest {
  string request_id = 1;
  int32 offset = 2;
}

message GetTestScriptReportResponse {
  // Path of tsa-report.md inside the worktree.
  string path = 1;
  // Characters of the whole report.
  int32 length = 2;
  string text = 3;
  bool has_next = 4;
  int32 next = 5;
}

// One output of the finished job: a generated script, assertion-manifest.json or tsa-report.md (the paths the run's summary lists).
message GetTestScriptFileRequest {
  string request_id = 1;
  string path = 2;
  int32 offset = 3;
}

message GetTestScriptFileResponse {
  string path = 1;
  // Characters of the whole file.
  int32 length = 2;
  string text = 3;
  bool has_next = 4;
  int32 next = 5;
}
