syntax = "proto3";

package orca.request.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

import "google/protobuf/timestamp.proto";

// Test specs generated by tdd-agent next to the code of a Request (docs/integrate/TDD-REQ-TESTSPEC-001). A read model over the
// service's own table plus two actions; the lane never changes the status of the Request.

message TestSpecRun {
  string id = 1;
  // 1 for the first attempt; a Re-run adds one.
  int32 attempt = 2;
  // pending, starting, running, completed, blocked, failed, skipped or cancelled.
  string status = 3;
  // Why a run is blocked, failed, skipped or cancelled (REQUEST_TESTSPEC_*, or a TESTSPEC_* code of tdd-agent).
  string reason_code = 4;
  string reason_message = 5;
  // solution or plan: the document tdd-agent read; empty before the run started.
  string context_mode = 6;
  // REQ-<number>: the reference in the codes of the nodes tdd-agent added.
  string context_ref = 7;
  string context_sha256 = 8;
  // The run on the dev server (run-…) and the feature it wrote (for example TDD-NOTES).
  string tdd_run_id = 9;
  string feature = 10;
  // Snapshot of the finished run: counts, files, open gaps, the context it used. A small JSON object ("{}" until completed).
  string summary_json = 11;
  string started_by = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message GetTestSpecsRequest {
  string request_id = 1;
}

message GetTestSpecsResponse {
  string request_id = 1;
  // False when the deployment does not generate test specs: the screen shows nothing.
  bool enabled = 2;
  // The attempt the screen shows; unset when the Request never had one.
  TestSpecRun current = 3;
  // Earlier attempts, newest first.
  repeated TestSpecRun history = 4;
}

message StartTestSpecsRequest {
  string request_id = 1;
}

message StartTestSpecsResponse {
  TestSpecRun run = 1;
}

message GetTestSpecDocumentRequest {
  string request_id = 1;
  // requirements, design or cases.
  string document = 2;
  int32 offset = 3;
}

message GetTestSpecDocumentResponse {
  string document = 1;
  int32 version = 2;
  // Draft: test specs are read only and are not baselined.
  string status = 3;
  // Characters of the whole document.
  int32 length = 4;
  string text = 5;
  bool has_next = 6;
  // Offset of the next page when has_next.
  int32 next = 7;
}
