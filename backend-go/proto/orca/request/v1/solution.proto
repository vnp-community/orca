syntax = "proto3";

package orca.request.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

// Solution and analysis messages (CR-REQ-007, 008, 026, 027, 028). RPCs live in RequestService (request.proto).

enum SolutionKind {
  SOLUTION_KIND_UNSPECIFIED = 0;
  SOLUTION_KIND_SOLUTION = 1;
  SOLUTION_KIND_DIAGNOSIS = 2;
  SOLUTION_KIND_FINDINGS = 3;
  SOLUTION_KIND_ANSWER = 4;
}

enum SolutionStatus {
  SOLUTION_STATUS_UNSPECIFIED = 0;
  SOLUTION_STATUS_DRAFT = 1;
  SOLUTION_STATUS_PROPOSED = 2;
  SOLUTION_STATUS_APPROVED = 3;
  SOLUTION_STATUS_REJECTED = 4;
  SOLUTION_STATUS_SUPERSEDED = 5;
}

enum AnalysisMode {
  // Unspecified means "follow the flow registry".
  ANALYSIS_MODE_UNSPECIFIED = 0;
  ANALYSIS_MODE_COMPLETE = 1;
  ANALYSIS_MODE_AGENT_READONLY = 2;
}

message Solution {
  string id = 1;
  string request_id = 2;
  SolutionKind kind = 3;
  SolutionStatus status = 4;
  // AI-generated JSON, validated server side; keys stay snake_case (CONTRACT C13).
  string options_json = 5;
  // 0-based index; -1 means not chosen yet.
  int32 chosen_option = 6;
  string content_ref = 7;
  string generation_run_id = 8;
  google.protobuf.Timestamp created_at = 9;
  int64 version = 10;
  // 11 to 15: CR-REQ-027 artifact fields.
  string display_id = 11;
  int32 seq = 12;
  string provenance_json = 13;
  int32 input_request_revision = 14;
  string content_digest = 15;
  // 16 to 17: CR-REQ-026 engine fields.
  string engine = 16;
  string proposal_branch = 17;
  // CR-REQ-041: the reviewer's request for changes that produced this version (the feedback of its generation run);
  // empty for a first version. Readable by anyone who can read the Request.
  string revision_feedback = 18;
}

message AnalysisRun {
  string id = 1;
  SolutionKind kind = 2;
  // running | succeeded | failed
  string status = 3;
  string error_code = 4;
  string error_message = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string engine = 8;
  string proposal_branch = 9;
  // Set only for an agent run that reported anything.
  RunStats stats = 10;
}

// RunStats is what an agent run says about itself: how often it called each tool (names and numbers only, never what a tool
// read or returned) and claude's usage figures. It is evidence for a reviewer, not a verdict.
message RunStats {
  map<string, int32> tool_calls = 1;
  // How many of those calls went to the knowledge graph's tools.
  int32 knowledge_tool_calls = 2;
  int32 turns = 3;
  int64 duration_ms = 4;
  // cost_usd means something only when has_cost is true: a cost claude did not report is "not reported", never zero.
  bool has_cost = 5;
  double cost_usd = 6;
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  int64 cache_read_tokens = 9;
  int64 cache_creation_tokens = 10;
}

message GenerateSolutionRequest {
  string request_id = 1;
  string idempotency_key = 2;
  // Regenerate hint, at most 2000 characters.
  string feedback = 3;
  AnalysisMode analysis_mode = 4;
  // CR-REQ-026: only "native" is accepted from clients.
  string engine_override = 5;
}

message GenerateSolutionResponse {
  string solution_id = 1;
  string run_id = 2;
}

message ListSolutionsRequest {
  string request_id = 1;
  SolutionKind kind = 2;
  SolutionStatus status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListSolutionsResponse {
  repeated Solution solutions = 1;
  repeated AnalysisRun runs = 2;
  string next_page_token = 3;
}

message ChooseSolutionOptionRequest {
  string request_id = 1;
  string solution_id = 2;
  // "opt-N".
  string option_id = 3;
  string comment = 4;
  // CR-REQ-028: required when the chosen option differs from the recommendation.
  string rationale = 5;
}

message ChooseSolutionOptionResponse {
  Solution solution = 1;
  // Send back as ApproveRequest.expected_digest.
  string approval_digest = 2;
  // 3 to 4: CR-REQ-028 decision state (open | chosen | effective).
  string decision_status = 3;
  bool requires_confirmation = 4;
}

// CR-REQ-026 per-project solution engine settings.
message ProjectEngineSettings {
  string project_id = 1;
  string solution_engine = 2;
  string openspec_min_version = 3;
  int64 version = 4;
  // Writes the Solution with the read-only agent and the project's knowledge graph; off keeps ai.complete.
  bool solution_agent = 5;
  // step_by_step (default) or continuous: how Requests of this project run after their plan is approved (CR-REQ-038).
  string execution_mode = 6;
  // CR-REQ-044: Orca starts the Plan by itself once the Analysis is approved. True unless the project turned it off.
  bool plan_auto_generate = 7;
}

message GetProjectEngineSettingsRequest {
  string project_id = 1;
  // Also asks the project's dev server whether the engines can run there.
  bool check = 2;
}

message GetProjectEngineSettingsResponse {
  ProjectEngineSettings settings = 1;
  // Set only when check was asked for.
  EnginePreflight preflight = 2;
}

message SetProjectEngineSettingsRequest {
  string project_id = 1;
  string solution_engine = 2;
  string openspec_min_version = 3;
  int64 expected_version = 4;
  bool solution_agent = 5;
  // Empty keeps the stored mode; otherwise step_by_step or continuous.
  string execution_mode = 6;
  // Absent keeps the stored value (CR-REQ-044), so an older client never flips the switch.
  optional bool plan_auto_generate = 7;
}

message SetProjectEngineSettingsResponse {
  ProjectEngineSettings settings = 1;
  // The result of the readiness check run for what was switched on; saving is never blocked by it.
  EnginePreflight preflight = 2;
}

// EnginePreflight says whether a dev server can run the engines of a project. blockers stop the openspec engine; gaps only
// mean the knowledge hub will not be used (the Solution and Plan then work as before).
message EnginePreflight {
  bool ran = 1;
  bool ok = 2;
  repeated EnginePreflightNote blockers = 3;
  repeated EnginePreflightNote gaps = 4;
  repeated string warnings = 5;
  string openspec_version = 6;
  string checked_at = 7;
}

message EnginePreflightNote {
  string code = 1;
  string message = 2;
  string fix_hint = 3;
}
