syntax = "proto3";

package orca.request.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "orca/request/v1/solution.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

// Plan, Phase, execution and per-type check messages (CR-REQ-012, 013, 014). RPCs live in RequestService.

message TaskProposal {
  string title = 1;
  string description = 2;
  string task_type = 3;
  google.protobuf.DoubleValue estimated_hours = 4;
  string prompt_template = 5;
  repeated int32 depends_on_indices = 6;
  repeated string labels = 7;
  bool irreversible = 8;
  // 9 onwards reserved for CR-REQ-029 (acceptance criteria, related files).
}

message PhaseProposal {
  string title = 1;
  string description = 2;
  repeated TaskProposal tasks = 3;
  repeated int32 depends_on_phase_indices = 4;
}

message PlanProposal {
  string title = 1;
  string summary = 2;
  repeated PhaseProposal phases = 3;
  // Tasks directly under the Plan when it has no Phase.
  repeated TaskProposal tasks = 4;
  string notes = 5;
}

// PROPOSE writes nothing in the domain tables; it runs in the background (IMPLEMENTATION-PLAN D3).
message GeneratePlanRequest {
  string request_id = 1;
  string feedback = 2;
  // At most 128 characters. A repeated start with the same key returns the run it created instead of a second one (CR-REQ-045).
  string idempotency_key = 3;
}

message GeneratePlanResponse {
  // Empty while the run is still going; read it with GetPlanProposal.
  PlanProposal proposal = 1;
  string raw_ai_response = 2;
  string run_id = 3;
}

// Reads the result of an asynchronous GeneratePlan run (CONTRACT section 9 Q2, option a).
message GetPlanProposalRequest {
  string request_id = 1;
  string run_id = 2;
  // CR-REQ-045: 1-based version of the Plan to read (see ListPlanRevisions); 0 reads the run or the current version as before.
  int32 revision = 3;
}

message GetPlanProposalResponse {
  string run_id = 1;
  // running | succeeded | failed
  string status = 2;
  string error_code = 3;
  string error_message = 4;
  PlanProposal proposal = 5;
  string raw_ai_response = 6;
  // native | openspec. The fields below are set only for the openspec engine, whose Plan is read from an authored change.
  string engine = 7;
  PlanBundle bundle = 8;
  repeated PlanCheck checks = 9;
  PlanKnowledge knowledge = 10;
  // What the run's agent calls reported, and how long the run took from start to finish (0 while it runs).
  RunStats stats = 11;
  int64 elapsed_ms = 12;
  // CR-REQ-044: the automatic generation of the Plan. Unset by a server without it.
  PlanAutoState auto_plan = 13;
}

// PlanAutoState is where the automatic Plan generation of a Request stands (CR-REQ-044).
message PlanAutoState {
  // Whether Orca would start the Plan by itself for the project of this Request.
  bool enabled = 1;
  // pending | running | committing | done | gave_up | skipped | superseded; empty when no job applies.
  string state = 2;
  // event | retry | revision
  string origin = 3;
  int32 attempt = 4;
  int32 max_attempts = 5;
  // Why the job gave up, was skipped or is waiting for another try (a REQUEST_* code).
  string reason_code = 6;
  // RFC 3339; set only while a pending job waits for its next try after a failed attempt or a busy project.
  string next_attempt_at = 7;
}

// Queues one more automatic attempt after the Plan failed or gave up (CR-REQ-044). A job that is already working is returned instead.
message RetryPlanGenerationRequest {
  string request_id = 1;
}

message RetryPlanGenerationResponse {
  PlanAutoState auto_plan = 1;
}

// PlanBundle names the OpenSpec change a Plan was read from. Its files stay readable after the worktree is gone.
message PlanBundle {
  string change_id = 1;
  string branch = 2;
  string commit = 3;
  string tasks_md_digest = 4;
  repeated PlanBundleFile files = 5;
  // preparing | ready | archived | abandoned. After the Request completes the archive step moves it to archived; commit is then the
  // last commit on the proposal branch, the archive's.
  string status = 6;
  // in_sync | pending | failed: whether tasks.md has caught up with the Plan and the archive step is not stuck. A failed one gave up
  // after sync_attempts tries and shows sync_error; the Request stays completed.
  string sync_state = 7;
  string sync_error = 8;
  int32 sync_attempts = 9;
}

message PlanBundleFile {
  // Relative to the change directory, for example tasks.md or specs/ai/spec.md.
  string path = 1;
  int64 size = 2;
  // True when the file was too large to keep; only its size and hash are stored.
  bool omitted = 3;
  // CR-REQ-045: hex SHA-256 of the stored text (secrets masked); of the file itself when it is omitted. Empty when not known.
  string sha256 = 4;
  // added | changed | unchanged | removed, compared with the previous version; empty when there is none to compare with.
  string change = 5;
}

// PlanCheck is one finding shown to the approver. error means the change was refused; Orca never stores such a proposal,
// so approvers see warning and info only.
message PlanCheck {
  string code = 1;
  string where = 2;
  string message = 3;
  // info | warning | error
  string severity = 4;
}

// PlanKnowledge is what the authoring agent reported about the project's design knowledge. It is the agent's word, not a
// fact Orca checked.
message PlanKnowledge {
  bool available = 1;
  string snapshot = 2;
  repeated string read = 3;
  repeated string gaps = 4;
  repeated string conflicts = 5;
  string skill_hash = 6;
}

message GetPlanBundleFileRequest {
  string request_id = 1;
  // A path inside the change, relative to it (tasks.md) or in full (openspec/changes/<id>/tasks.md).
  string path = 2;
  // CR-REQ-045: 1-based version to read; 0 reads the current one.
  int32 revision = 3;
}

message GetPlanBundleFileResponse {
  string path = 1;
  string content = 2;
  bool omitted = 3;
}

message CommitPlanRequest {
  string request_id = 1;
  PlanProposal proposal = 2;
  string raw_ai_response = 3;
}

message CommitPlanResponse {
  string plan_task_id = 1;
  repeated string phase_task_ids = 2;
  repeated string task_ids = 3;
  bool already_exists = 4;
}

// Empty phase_task_id is valid only when the Plan has no Phase.
message StartPhaseRequest {
  string request_id = 1;
  string phase_task_id = 2;
}

message StartPhaseResponse {
  string phase_task_id = 1;
  bool already_started = 2;
  repeated string dispatched_task_ids = 3;
}

// Internal only: called by consumers or task-service, never by the gateway.
message ReportTaskOutcomeRequest {
  string event_id = 1;
  string request_id = 2;
  string task_id = 3;
  string task_type = 4;
  string previous_status = 5;
  string new_status = 6;
  string cause = 7;
  string execution_link_id = 8;
  string error_message = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

message ReportTaskOutcomeResponse {}

message RequestCheck {
  string id = 1;
  string request_id = 2;
  string kind = 3;
  string status = 4;
  string metrics_json = 5;
  string summary = 6;
  // manual | agent | orca_verified
  string source = 7;
  string task_id = 8;
  string recorded_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

message RecordRequestCheckRequest {
  string request_id = 1;
  string kind = 2;
  string status = 3;
  string metrics_json = 4;
  string summary = 5;
  string task_id = 6;
}

message RecordRequestCheckResponse {
  RequestCheck check = 1;
}

message ListRequestChecksRequest {
  string request_id = 1;
  string kind = 2;
}

message ListRequestChecksResponse {
  repeated RequestCheck checks = 1;
}

// CleanupRequestProposal removes the worktree of a Request's OpenSpec proposal. The branch and the stored change stay.
message CleanupRequestProposalRequest {
  string request_id = 1;
}

message CleanupRequestProposalResponse {
  // False when there was no worktree to remove.
  bool removed = 1;
  // True when the change was also marked abandoned (the Request is cancelled).
  bool abandoned = 2;
  string branch = 3;
}

// Lists the versions of the Plan of a Request, newest first (CR-REQ-045).
message ListPlanRevisionsRequest {
  string request_id = 1;
  // Default 20, at most 100.
  int32 page_size = 2;
  // The revision number the previous page ended with; empty for the first page.
  string page_token = 3;
}

message ListPlanRevisionsResponse {
  repeated PlanRevision revisions = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// PlanRevision is one successful Plan run of a Request. Its number is its place among those runs, oldest first.
message PlanRevision {
  int32 revision = 1;
  string run_id = 2;
  // current | superseded
  string status = 3;
  // native | openspec
  string engine = 4;
  // What the person asked to change; empty for a run without a request for changes and for answers to a clarification.
  string revision_feedback = 5;
  string actor_id = 6;
  google.protobuf.Timestamp generated_at = 7;
  // openspec only: the commit holding this version's documents.
  string commit = 8;
  // openspec only: files added, changed or removed against the previous version (all files for the first one).
  int32 files_changed = 9;
  int32 file_count = 10;
  // False once the text of an old version was dropped; its file list and hashes stay.
  bool text_kept = 11;
  RunStats stats = 12;
}
