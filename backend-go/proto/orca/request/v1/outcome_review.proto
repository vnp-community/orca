syntax = "proto3";

package orca.request.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

// Outcome Review (CR-OR-001): a review of what a Request delivered, at the level of the system rather than of lines of code.
// The review itself travels as JSON in model_json (schemaVersion 1) so the model can grow without a message per field; the
// columns beside it are what a client lists and compares by. RPCs live in RequestService.

message OutcomeReview {
  string review_id = 1;
  string request_id = 2;
  // design | delivered
  string phase = 3;
  // draft | ready | stale | approved | superseded
  string state = 4;
  string head_key = 5;
  string model_json = 6;
  string kg_snapshot = 7;
  int64 version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// EstimateOutcomeReview costs no agent run: it reads the database and git-gateway and says what GenerateOutcomeReview would do.
message EstimateOutcomeReviewRequest {
  string request_id = 1;
  // Ask what a regeneration would do (CR-OR-012): artifact | context | all, and the sections to draw for artifact. Empty scope asks
  // only about building the review.
  string scope = 2;
  repeated string sections = 3;
}

message EstimateOutcomeReviewResponse {
  string phase = 1;
  bool execution_finished = 2;
  bool review_exists = 3;
  string review_id = 4;
  bool stale = 5;
  string current_inputs_digest = 6;
  repeated string warnings = 7;
  // The context run (CR-OR-002): whether a checked result for these inputs is kept, whether the design is locked, and whether a run
  // could start on the project's dev server now. context_gaps say why not.
  bool context_cached = 8;
  bool design_locked = 9;
  bool context_runnable = 10;
  repeated string context_gaps = 11;
  RegenerationEstimate regeneration = 12;
}

// RegenerationEstimate is what a regeneration is expected to do and cost. Nothing is invented: without an earlier run that reported a
// cost, cost_known is false and cost_usd is 0.
message RegenerationEstimate {
  int32 agent_runs = 1;
  int32 diagrams_to_draw = 2;
  bool cost_known = 3;
  double cost_usd = 4;
  string last_context_cost = 5;
  string last_draw_cost = 6;
  bool confirm_required = 7;
  // True for a context regeneration: how many diagrams change is known only after the run.
  bool drawings_depend_on_result = 8;
}

message GenerateOutcomeReviewRequest {
  string request_id = 1;
  // Empty lets the service pick: delivered once execution is over, design before that.
  string phase = 2;
  // Also read the design (and, after coding, the code) with a read-only agent. The facts are built either way.
  bool run_context = 3;
  // Run without the knowledge graph when the project has none. Only for an after-code review; every item is then unverified.
  bool allow_code_only = 4;
  // Ignore the cache and the locked design and ask the agent again (regenerate).
  bool force = 5;
}

message GenerateOutcomeReviewResponse {
  OutcomeReview review = 1;
  // True when a review with the same inputs already existed and nothing was written.
  bool reused = 2;
  bool created = 3;
  // The context run that was started; the review gains its context when the run ends.
  OutcomeReviewRun run = 4;
  // True when a checked result for the same inputs was applied and no agent was called.
  bool context_cached = 5;
  // kg_unavailable when no run was started because the project has no knowledge graph.
  string context_skipped = 6;
  // The drawings (CR-OR-010): the run that was started when the context was already there, how many diagrams already had a drawing,
  // and the code of the error that kept the drawing from starting (for instance REQUEST_REVIEW_SKILL_MISSING).
  OutcomeReviewRun draw_run = 7;
  int32 drawings_cached = 8;
  int32 drawings_pending = 9;
  string draw_error = 10;
}

// OutcomeReviewRun is one agent run of a review. The run ends in succeeded, failed or cancelled; error_code says why it failed.
message OutcomeReviewRun {
  string run_id = 1;
  string review_id = 2;
  string request_id = 3;
  // context | draw
  string kind = 4;
  // queued | running | succeeded | failed | cancelled
  string status = 5;
  // design | delivered for a context run
  string scope = 6;
  string error_code = 7;
  string cost_estimate = 8;
  string cost_actual = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
}

message ListOutcomeReviewRunsRequest {
  string request_id = 1;
  // Empty means the newest review of the Request that is not superseded.
  string review_id = 2;
}

message ListOutcomeReviewRunsResponse {
  // Newest first.
  repeated OutcomeReviewRun runs = 1;
}

message GetOutcomeReviewRequest {
  // request_id is required: it is how the caller is authorized. With review_id the review must belong to that Request; without
  // it the newest review that is not superseded is returned.
  string review_id = 1;
  string request_id = 2;
}

message GetOutcomeReviewResponse {
  OutcomeReview review = 1;
  bool found = 2;
}

message ListOutcomeReviewsRequest {
  string request_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListOutcomeReviewsResponse {
  repeated OutcomeReview reviews = 1;
  string next_page_token = 2;
}

// ReviewArtifactMeta describes one stored drawing without its content.
message ReviewArtifactMeta {
  string artifact_id = 1;
  string request_id = 2;
  string section = 3;
  string variant = 4;
  string name = 5;
  string diagram_type = 6;
  string input_digest = 7;
  string preset_digest = 8;
  string skill_version = 9;
  int32 revision = 10;
  // active | superseded | failed
  string state = 11;
  // auto | regenerated
  string origin = 12;
  string reason = 13;
  string error_code = 14;
  string blob_digest = 15;
  int32 size_bytes = 16;
  string view_box = 17;
  string title = 18;
  string desc = 19;
  google.protobuf.Timestamp created_at = 20;
}

message GetReviewArtifactRequest {
  string request_id = 1;
  string artifact_id = 2;
  // The blob_digest the caller already holds; when it matches, no content is sent.
  string if_digest = 3;
}

message GetReviewArtifactResponse {
  ReviewArtifactMeta artifact = 1;
  bool not_modified = 2;
  string media_type = 3;
  // The drawing, already checked: a self-contained HTML page with one inline SVG. Show it in a sandboxed frame.
  string content = 4;
}

message ListReviewArtifactRevisionsRequest {
  string request_id = 1;
  string section = 2;
  string variant = 3;
  string name = 4;
}

message ListReviewArtifactRevisionsResponse {
  // Newest first.
  repeated ReviewArtifactMeta revisions = 1;
}

// Decisions (CR-OR-022). They exist only for an after-code review.
message OutcomeReviewDecision {
  string decision_id = 1;
  string review_id = 2;
  string item_key = 3;
  // accept_exception | send_back | dismiss
  string decision = 4;
  string note = 5;
  string child_request_id = 6;
  string decided_by = 7;
  google.protobuf.Timestamp decided_at = 8;
  // False for a decision that a later one replaced.
  bool active = 9;
  // True when the item the decision was about is no longer in the review after a regeneration.
  bool orphaned = 10;
}

message DecideOutcomeReviewItemRequest {
  string request_id = 1;
  string review_id = 2;
  string item_key = 3;
  string decision = 4;
  // Required for accept_exception and dismiss, at most 500 characters.
  string note = 5;
  // The version of the review the person was looking at.
  int64 expected_version = 6;
}

message DecideOutcomeReviewItemResponse {
  OutcomeReviewDecision decision = 1;
  int64 review_version = 2;
  string review_state = 3;
  int32 open_decisions = 4;
}

message ApproveOutcomeReviewRequest {
  string request_id = 1;
  string review_id = 2;
  string note = 3;
  int64 expected_version = 4;
}

message ApproveOutcomeReviewResponse {
  OutcomeReview review = 1;
}

message ListOutcomeReviewDecisionsRequest {
  string request_id = 1;
  string review_id = 2;
  // When set, the history of this item (every decision, newest first) instead of the decisions in force.
  string item_key = 3;
}

message ListOutcomeReviewDecisionsResponse {
  repeated OutcomeReviewDecision decisions = 1;
  // Items that ask for a decision and have none yet (after-code reviews only).
  int32 open_decisions = 2;
}

// LinkOutcomeReviewChildRequest records which child Request took the sent-back items. The Request must be a child of the review's.
message LinkOutcomeReviewChildRequest {
  string request_id = 1;
  string review_id = 2;
  repeated string item_keys = 3;
  string child_request_id = 4;
}

message LinkOutcomeReviewChildResponse {
  int32 linked = 1;
}

// Regeneration (CR-OR-012).
message RegenerateReviewArtifactsRequest {
  string request_id = 1;
  // artifact | context | all
  string scope = 2;
  repeated string sections = 3;
  // looks_wrong | kg_changed | code_changed | style_changed | retry_failed | other
  string reason = 4;
  string note = 5;
  bool confirm_cost = 6;
  // Makes a repeated request one run.
  string client_request_id = 7;
  // The version of the review the person was looking at; 0 skips the check.
  int64 expected_version = 8;
}

message RegenerateReviewArtifactsResponse {
  OutcomeReviewRun context_run = 1;
  OutcomeReviewRun draw_run = 2;
  bool replayed = 3;
  RegenerationEstimate estimate = 4;
  string skipped = 5;
}

message ModelDiff {
  repeated string added_nodes = 1;
  repeated string removed_nodes = 2;
  repeated string changed_nodes = 3;
  repeated string added_edges = 4;
  repeated string removed_edges = 5;
  repeated string changed_edges = 6;
}

message RestoreReviewArtifactRevisionRequest {
  string request_id = 1;
  string artifact_id = 2;
  string note = 3;
}

message RestoreReviewArtifactRevisionResponse {
  ReviewArtifactMeta artifact = 1;
  // What differs between the model of the drawing that was replaced and the one put back; absent when there was none.
  ModelDiff diff = 2;
  bool has_diff = 3;
}

message CompareReviewArtifactRevisionsRequest {
  string request_id = 1;
  string from_artifact_id = 2;
  string to_artifact_id = 3;
}

message CompareReviewArtifactRevisionsResponse {
  ModelDiff diff = 1;
}

// Drawing profile (CR-OR-013). project_id empty means the tenant layer.
message ReviewDrawingProfileLayer {
  string project_id = 1;
  string spec_json = 2;
  string spec_digest = 3;
  int64 version = 4;
  string updated_by = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetReviewDrawingProfileRequest {
  string project_id = 1;
}

message GetReviewDrawingProfileResponse {
  ReviewDrawingProfileLayer tenant_layer = 1;
  bool has_tenant_layer = 2;
  ReviewDrawingProfileLayer project_layer = 3;
  bool has_project_layer = 4;
  // The profile in force, as JSON, and the layer that decided each field (default | tenant | project).
  string effective_json = 5;
  map<string, string> sources = 6;
}

message SaveReviewDrawingProfileRequest {
  string project_id = 1;
  string spec_json = 2;
  // 0 creates the layer.
  int64 expected_version = 3;
}

message SaveReviewDrawingProfileResponse {
  ReviewDrawingProfileLayer layer = 1;
}

message ResetReviewDrawingProfileRequest {
  string project_id = 1;
  int64 expected_version = 2;
}

message ResetReviewDrawingProfileResponse {}
