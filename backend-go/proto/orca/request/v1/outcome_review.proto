syntax = "proto3";

package orca.request.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/request/v1;requestv1";

// Outcome Review (CR-OR-001): a review of what a Request delivered, at the level of the system rather than of lines of code.
// The review itself travels as JSON in model_json (schemaVersion 1) so the model can grow without a message per field; the
// columns beside it are what a client lists and compares by. RPCs live in RequestService.

message OutcomeReview {
  string review_id = 1;
  string request_id = 2;
  // design | delivered
  string phase = 3;
  // draft | ready | stale | approved | superseded
  string state = 4;
  string head_key = 5;
  string model_json = 6;
  string kg_snapshot = 7;
  int64 version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// EstimateOutcomeReview costs no agent run: it reads the database and git-gateway and says what GenerateOutcomeReview would do.
message EstimateOutcomeReviewRequest {
  string request_id = 1;
}

message EstimateOutcomeReviewResponse {
  string phase = 1;
  bool execution_finished = 2;
  bool review_exists = 3;
  string review_id = 4;
  bool stale = 5;
  string current_inputs_digest = 6;
  repeated string warnings = 7;
  // The context run (CR-OR-002): whether a checked result for these inputs is kept, whether the design is locked, and whether a run
  // could start on the project's dev server now. context_gaps say why not.
  bool context_cached = 8;
  bool design_locked = 9;
  bool context_runnable = 10;
  repeated string context_gaps = 11;
}

message GenerateOutcomeReviewRequest {
  string request_id = 1;
  // Empty lets the service pick: delivered once execution is over, design before that.
  string phase = 2;
  // Also read the design (and, after coding, the code) with a read-only agent. The facts are built either way.
  bool run_context = 3;
  // Run without the knowledge graph when the project has none. Only for an after-code review; every item is then unverified.
  bool allow_code_only = 4;
  // Ignore the cache and the locked design and ask the agent again (regenerate).
  bool force = 5;
}

message GenerateOutcomeReviewResponse {
  OutcomeReview review = 1;
  // True when a review with the same inputs already existed and nothing was written.
  bool reused = 2;
  bool created = 3;
  // The context run that was started; the review gains its context when the run ends.
  OutcomeReviewRun run = 4;
  // True when a checked result for the same inputs was applied and no agent was called.
  bool context_cached = 5;
  // kg_unavailable when no run was started because the project has no knowledge graph.
  string context_skipped = 6;
}

// OutcomeReviewRun is one agent run of a review. The run ends in succeeded, failed or cancelled; error_code says why it failed.
message OutcomeReviewRun {
  string run_id = 1;
  string review_id = 2;
  string request_id = 3;
  // context | draw
  string kind = 4;
  // queued | running | succeeded | failed | cancelled
  string status = 5;
  // design | delivered for a context run
  string scope = 6;
  string error_code = 7;
  string cost_estimate = 8;
  string cost_actual = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
}

message ListOutcomeReviewRunsRequest {
  string request_id = 1;
  // Empty means the newest review of the Request that is not superseded.
  string review_id = 2;
}

message ListOutcomeReviewRunsResponse {
  // Oldest first.
  repeated OutcomeReviewRun runs = 1;
}

message GetOutcomeReviewRequest {
  // request_id is required: it is how the caller is authorized. With review_id the review must belong to that Request; without
  // it the newest review that is not superseded is returned.
  string review_id = 1;
  string request_id = 2;
}

message GetOutcomeReviewResponse {
  OutcomeReview review = 1;
  bool found = 2;
}

message ListOutcomeReviewsRequest {
  string request_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListOutcomeReviewsResponse {
  repeated OutcomeReview reviews = 1;
  string next_page_token = 2;
}
