syntax = "proto3";

package orca.aiprovider.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/aiprovider/v1;aiproviderv1";

// AiProviderService owns provider account metadata + quota tracking; secret
// material always delegates to credential-broker-service. Never stores or
// forwards plaintext keys (closes TS Gap 2). See specs/backend-go/services/ai-provider-service.md.
service AiProviderService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc ResolveProvider(ResolveProviderRequest) returns (ResolveProviderResponse);
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  rpc GetUsageToday(GetUsageTodayRequest) returns (GetUsageTodayResponse);
}

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_ANTHROPIC = 1;
  PROVIDER_TYPE_OPENAI = 2;
  PROVIDER_TYPE_GOOGLE = 3;
  PROVIDER_TYPE_AZURE = 4;
  PROVIDER_TYPE_AWS_BEDROCK = 5;
  PROVIDER_TYPE_OLLAMA = 6;
  PROVIDER_TYPE_VLLM = 7;
}

message ProviderAccount {
  string id = 1;
  string tenant_id = 2;
  ProviderType type = 3;
  string status = 4; // active | rotating | revoked
  string credential_ref = 5; // credential-broker-service metadata id, never a secret value
}

message CreateAccountRequest {
  string tenant_id = 1;
  ProviderType type = 2;
}

message CreateAccountResponse {
  ProviderAccount account = 1;
}

// ResolveProvider implements the user-scope -> project-scope priority
// cascade and returns only a reference the caller uses to ask
// credential-broker-service (or the execution plane, for spawn-time use)
// for the actual secret — never a plaintext key.
message ResolveProviderRequest {
  string tenant_id = 1;
  string user_id = 2;
  string project_id = 3;
}

message ResolveProviderResponse {
  ProviderAccount account = 1;
}

message RotateKeyRequest {
  string account_id = 1;
}

message RotateKeyResponse {
  ProviderAccount account = 1;
}

message GetUsageTodayRequest {
  string account_id = 1;
}

message GetUsageTodayResponse {
  double cost_usd = 1;
  int64 request_count = 2;
}
