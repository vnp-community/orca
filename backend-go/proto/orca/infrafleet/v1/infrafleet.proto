syntax = "proto3";

package orca.infrafleet.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/infrafleet/v1;infrafleetv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// InfraFleetService owns SSH targets, dev server registry, connection lifecycle,
// the provider registry (connectionId -> host dispatch), and fleet health.
// See specs/backend-go/services/infra-fleet-service.md.
service InfraFleetService {
  rpc RegisterDevServer(RegisterDevServerRequest) returns (RegisterDevServerResponse);
  rpc ResolveConnection(ResolveConnectionRequest) returns (ResolveConnectionResponse);
  rpc CreateSshTarget(CreateSshTargetRequest) returns (CreateSshTargetResponse);
  rpc GetFleetHealth(GetFleetHealthRequest) returns (GetFleetHealthResponse);
  rpc ScanWorkspacePorts(ScanWorkspacePortsRequest) returns (ScanWorkspacePortsResponse);
  // ListDevServers backs the frontend's devServer.list channel — the
  // DevServerRepository.List method already existed but was never exposed
  // over gRPC before Epic A's second pass.
  rpc ListDevServers(ListDevServersRequest) returns (ListDevServersResponse);
  // CreateConnection is the write path for infra.connections
  // (migrations/0002_connections) — binds a dev server to a worktree/repo
  // path, producing the connectionId ResolveConnection/Relay resolve
  // against. Without this RPC, connections would be schema nobody writes to.
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  // Relay is the generic connectionId+method+params passthrough onto the Dev
  // Server Agent execution plane — see usecase.Relay's doc comment for why
  // this is a single generic RPC rather than one purpose-built RPC per
  // caller (git-gateway-service's git.*, workflow-service's agent.exec/
  // shell.exec/notification.send, wscompat's devServer.*/fleet.* channels
  // all go through this one).
  rpc Relay(RelayRequest) returns (RelayResponse);
  // ListSshTargets backs ssh.listTargets and ssh.getUserAccount (the
  // latter derives from this same read — see wscompat's registerSshChannels).
  rpc ListSshTargets(ListSshTargetsRequest) returns (ListSshTargetsResponse);
  // GetSshState is a local read (no dial) of whichever connection (if any)
  // currently binds this SSH target's dev server.
  rpc GetSshState(GetSshStateRequest) returns (GetSshStateResponse);
  // EstablishConnection performs the actual SSH + Dev Server Agent
  // handshake synchronously — it IS the connection-establishment act, not
  // a record of one requested. See usecase.EstablishConnection's doc comment.
  rpc EstablishConnection(EstablishConnectionRequest) returns (Connection);
  rpc KillWorkspacePort(KillWorkspacePortRequest) returns (KillWorkspacePortResponse);

  // CreateAgentToken/ListAgentTokens/RevokeAgentToken back BL-AWS-03's
  // persistent, named, per-DevServer agent token admin surface — see
  // specs/backend-go/bugs/logic-v1/solutions/SOL-AWS-03-agent-token-management.md.
  rpc CreateAgentToken(CreateAgentTokenRequest) returns (CreateAgentTokenResponse);
  rpc ListAgentTokens(ListAgentTokensRequest) returns (ListAgentTokensResponse);
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (google.protobuf.Empty);

  // --- Terminal/PTY lifecycle (control-plane, unary) ---
  rpc SpawnTerminalSession(SpawnTerminalSessionRequest) returns (SpawnTerminalSessionResponse);
  rpc ResizeTerminalSession(ResizeTerminalSessionRequest) returns (google.protobuf.Empty);
  rpc KillTerminalSession(KillTerminalSessionRequest) returns (google.protobuf.Empty);      // terminal.close
  rpc StopTerminalProcess(StopTerminalProcessRequest) returns (google.protobuf.Empty);      // terminal.stop — interrupt, not teardown
  rpc ListTerminalSessions(ListTerminalSessionsRequest) returns (ListTerminalSessionsResponse);
  rpc WaitTerminalSession(WaitTerminalSessionRequest) returns (WaitTerminalSessionResponse); // terminal.wait — bounded blocking poll
  rpc FocusTerminalSession(FocusTerminalSessionRequest) returns (google.protobuf.Empty);     // terminal.focus — bookkeeping touch
  rpc GetTerminalAgentStatus(GetTerminalAgentStatusRequest) returns (GetTerminalAgentStatusResponse); // backs BOTH terminal.agentStatus and terminal.isRunningAgent
  rpc InspectTerminalProcess(InspectTerminalProcessRequest) returns (InspectTerminalProcessResponse); // best-effort — see message doc comment

  // --- Terminal scrollback persistence (SOL-TM-03) — distinct from
  // AttachPty/live PTY I/O. NOT the same path as terminal.multiplex's
  // SnapshotRequest opcode, which resolves against a LIVE pty_id this flow
  // structurally cannot have (a fresh pty_id is spawned on worktree reopen).
  rpc SaveTerminalScrollbackSnapshot(SaveTerminalScrollbackSnapshotRequest) returns (google.protobuf.Empty);
  rpc GetTerminalScrollbackSnapshot(GetTerminalScrollbackSnapshotRequest) returns (GetTerminalScrollbackSnapshotResponse);
  // Called by git-gateway-service's RemoveWorktree on hard worktree deletion
  // — cleanup, not part of the save/restore flow itself.
  rpc DeleteTerminalScrollbackSnapshots(DeleteTerminalScrollbackSnapshotsRequest) returns (google.protobuf.Empty);

  // GetAgentTerminalSession resolves worktree_id -> the live TerminalSession
  // whose cwd matches that worktree's path, if one exists. Composes
  // ResolveConnection + ListTerminalSessions server-side so no caller
  // re-derives the match/tie-break logic itself.
  rpc GetAgentTerminalSession(GetAgentTerminalSessionRequest) returns (GetAgentTerminalSessionResponse);

  // SendTerminalInput writes directly to the pty's input, bypassing
  // AttachPty's stream — for stateless (REST/CLI) callers that never
  // attach. GUI callers keep using terminal.send/AttachPty for lower
  // latency; this is not a replacement for that path.
  rpc SendTerminalInput(SendTerminalInputRequest) returns (google.protobuf.Empty);

  // GetTerminalScrollback returns a flat-text capture of a pty's recent
  // output, for callers that want a redirectable string, not multiplex
  // frames.
  rpc GetTerminalScrollback(GetTerminalScrollbackRequest) returns (GetTerminalScrollbackResponse);

  // --- Terminal/PTY I/O ---
  // The "server-streaming terminal-data endpoint" infra-fleet-service.md §7
  // names but §3 never enumerates. Bidirectional, not server-streaming-only:
  // §3's RouteTerminalWrite only routes control-plane metadata, never per-
  // byte input, so a client->server data channel was still missing — this
  // RPC is opened once per terminal.create by api-gateway's wscompat bridge
  // (TASK-186) and piped into `push` frames via TASK-012's pipePush.
  rpc AttachPty(stream PtyClientFrame) returns (stream PtyServerFrame);

  // ListBrowserProfiles/CreateBrowserProfile/DeleteBrowserProfile back
  // api-gateway's browser.profileList/profileCreate/profileDelete channels
  // (SOL-006 Group C) — Postgres-backed metadata CRUD, mirroring
  // CreateSshTarget's shape. NOT the same as the 3 live-agent profile
  // operations (profileClearDefaultCookies/profileDetectBrowsers/
  // profileImportFromBrowser), which relay via Relay instead — see
  // specs/backend-go/bugs/missing-v1/solutions/SOL-006-browser-channels.md.
  rpc ListBrowserProfiles(ListBrowserProfilesRequest) returns (ListBrowserProfilesResponse);
  rpc CreateBrowserProfile(CreateBrowserProfileRequest) returns (CreateBrowserProfileResponse);
  rpc DeleteBrowserProfile(DeleteBrowserProfileRequest) returns (google.protobuf.Empty);

  // --- Emulator/simulator control, relayed to the Dev Server Agent (TASK-048) ---
  // Every RPC here except GetEmulatorAvailability requires connection_id —
  // there is deliberately no local/backend-host fallback (driving emulators
  // on the shared backend-go host is out of scope by design, see
  // usecase.EmulatorRelay's doc comment). agent/ has no device.* RPC surface
  // today (confirmed absent as of this pass) — every call below reaches a
  // real agent and fails with a typed, permanent FailedPrecondition until
  // agent/ gains one; see specs/backend-go/bugs/missing-v1/tasks/TASK-048.
  rpc ListEmulatorDevices(ListEmulatorDevicesRequest) returns (ListEmulatorDevicesResponse);
  rpc GetEmulatorAvailability(GetEmulatorAvailabilityRequest) returns (GetEmulatorAvailabilityResponse);
  rpc AttachEmulatorSession(AttachEmulatorSessionRequest) returns (EmulatorSession);
  rpc SendEmulatorTap(SendEmulatorTapRequest) returns (google.protobuf.Empty);
  rpc SendEmulatorGesture(SendEmulatorGestureRequest) returns (google.protobuf.Empty);
  rpc SendEmulatorButton(SendEmulatorButtonRequest) returns (google.protobuf.Empty);
  rpc RotateEmulator(RotateEmulatorRequest) returns (google.protobuf.Empty);
  rpc ShutdownEmulator(ShutdownEmulatorRequest) returns (google.protobuf.Empty);

  // GetHostCapabilities is the per-target WSL/pwsh/git-bash probe (TASK-070)
  // — connection_id empty resolves to the caller's own backend-go host and
  // is answered locally and honestly (false/[]), no relay attempted,
  // matching TASK-068's existing host.* stub semantics; a non-empty
  // connection_id relays to the agent's host.capabilities method, which
  // does not exist yet (confirmed absent as of this pass) — see
  // usecase.GetHostCapabilities's doc comment.
  rpc GetHostCapabilities(GetHostCapabilitiesRequest) returns (GetHostCapabilitiesResponse);

  // ImportFleetInventory is the batch YAML-import entry point for BL-FLEET-01
  // — upserts SshTargets by (tenant_id, host, user), see
  // usecase.ImportFleetInventory's doc comment.
  rpc ImportFleetInventory(ImportFleetInventoryRequest) returns (ImportFleetInventoryResponse);

  // BulkProvisionFleet fans out provisioning across a tenant's SSH targets
  // — unary (not streaming): bulk provisioning is N-servers-in-parallel,
  // not one server's steps in sequence, and BL-FLEET-02's own contract is
  // a single terminal summary object. See usecase.BulkProvisionFleet's doc
  // comment.
  rpc BulkProvisionFleet(BulkProvisionFleetRequest) returns (BulkProvisionFleetResponse);

  // DetectDevServerAgents/CheckDevServerPreflight close BL-FLEET-04 Steps
  // 3/4 (agent detection, remote preflight) — see usecase.DetectDevServerAgents
  // / usecase.CheckDevServerPreflight doc comments.
  rpc DetectDevServerAgents(DetectDevServerAgentsRequest) returns (DetectDevServerAgentsResponse);
  rpc CheckDevServerPreflight(CheckDevServerPreflightRequest) returns (CheckDevServerPreflightResponse);
}

enum ConnectionMode {
  CONNECTION_MODE_UNSPECIFIED = 0;
  CONNECTION_MODE_RELAY_SSH = 1;
  CONNECTION_MODE_RELAY_WEBSOCKET = 2;
  CONNECTION_MODE_DIRECT_WEBSOCKET = 3;
}

message DevServer {
  string id = 1;
  string tenant_id = 2;
  string host = 3;
  ConnectionMode mode = 4;
  // ssh_target_id links this dev server to the SshTarget sshconn.Connector
  // dials for cert-based SSH auth — required when mode is
  // CONNECTION_MODE_RELAY_SSH, empty for the other two modes. Closes the
  // "DevServer<->SshTarget linkage the domain model doesn't have yet" gap
  // this service's README flagged (Epic A third pass).
  string ssh_target_id = 5;
  // status is domain.DevServerStatus verbatim: pending|healthy|degraded|
  // unhealthy — see BulkProvisionFleet's doc comment (SOL-FLEET-02).
  string status = 6;
  // platform/arch/node_version/agent_version are handshake-derived facts
  // (SOL-FLEET-04) — the same columns SOL-FLEET-02's BulkProvisionFleet
  // also persists into (domain.DevServer), see
  // usecase.DevServerRepository.UpdateProvisionResult.
  string platform = 7;
  string arch = 8;
  string node_version = 9;
  string agent_version = 10;
}

message RegisterDevServerRequest {
  string tenant_id = 1;
  string host = 2;
  ConnectionMode mode = 3;
  string ssh_target_id = 4; // required when mode=CONNECTION_MODE_RELAY_SSH
  // relay_port: 0 = no daemon port — foreground stdio session, honest
  // placeholder until agent/ gains a daemon (see TASK-FLEET-02-08).
  int32 relay_port = 5;
}

message RegisterDevServerResponse {
  DevServer dev_server = 1;
}

// ResolveConnection is the core dispatch primitive every other service
// (git-gateway-service, project-service, task-service) calls to answer
// "which host owns this connectionId, and how do I reach it".
message ResolveConnectionRequest {
  // Exactly one of connection_id, dev_server_id, worktree_id is set. Empty
  // connection_id with both alternates also empty resolves nothing
  // (ResolveConnectionOutput{Connected: false}), matching today's
  // empty-connectionId short-circuit.
  string connection_id = 1;
  // dev_server_id resolves the dev server's current active connectionId,
  // the reverse of connection_id's lookup direction — used by
  // ai-provider-service's TestConnection (see
  // specs/backend-go/bugs/missing-v1/tasks/TASK-028-implement-aiprovider-test-connection-usecase.md).
  string dev_server_id = 2;
  // worktree_id resolves the connectionId currently bound to a worktree —
  // used by api-gateway's browser.* relay channels (see
  // specs/backend-go/bugs/missing-v1/tasks/TASK-034-add-browser-pane-relay-wscompat-channels.md).
  // Mirrors CreateConnectionRequest's (dev_server_id, repo_path,
  // worktree_id) tuple in reverse.
  string worktree_id = 3;
}

message ResolveConnectionResponse {
  bool connected = 1; // false => execute locally, no relay
  DevServer dev_server = 2;
  // repo_path/worktree_id are the per-connection metadata stored on
  // infra.connections (migrations/0002_connections) — empty when connected
  // is false. Callers like git-gateway-service's RelayExecutor need
  // repo_path alongside dev_server to know which path to operate on.
  string repo_path = 3;
  string worktree_id = 4;
  // connection_id is the resolved infra.connections.id — the value Relay's
  // RelayRequest.connection_id expects. Populated regardless of which
  // ResolveConnectionRequest key resolved this row, so a dev_server_id- or
  // worktree_id-keyed caller (TestConnection, browser.* channels) has a
  // valid Relay connection_id without re-deriving it from DevServer.id,
  // which is a different id space (dev_servers.id, not connections.id).
  string connection_id = 5;
  // node_version is the connected session's self-reported Node.js version
  // (devserveragent.HandshakeInfo.NodeVersion, captured at handshake time)
  // — empty when connected is false or the session predates this field.
  // Added for SOL-INT-03's preflight merge; not populated by any other RPC.
  string node_version = 6;
}

message ListDevServersRequest {
  // tenant_id is intentionally absent — pulled from request context (see
  // RegisterDevServerInput's doc comment for the same convention), never
  // trusted from the caller.
}

message ListDevServersResponse {
  repeated DevServer dev_servers = 1;
}

message CreateConnectionRequest {
  string dev_server_id = 1;
  string repo_path = 2;
  string worktree_id = 3;
}

message CreateConnectionResponse {
  string connection_id = 1;
}

message RelayRequest {
  string connection_id = 1;
  string method = 2;
  // params_json is a JSON-encoded object, mirroring
  // devserveragent.Client.Exec's own generic map[string]any passthrough —
  // no per-method typed message, since this RPC's whole point is not
  // needing one per agent method. Empty means no params.
  string params_json = 3;
}

message RelayResponse {
  // result_json is the agent's JSON-RPC result, JSON-encoded verbatim.
  string result_json = 1;
}

message CreateSshTargetRequest {
  string tenant_id = 1;
  string host = 2;
  string user = 3;
  string vault_ssh_role = 4; // Vault SSH secrets engine role for cert issuance
}

message CreateSshTargetResponse {
  string ssh_target_id = 1;
}

message GetFleetHealthRequest {
  string tenant_id = 1;
}

message DevServerHealth {
  string dev_server_id = 1;
  bool reachable = 2;
  double cpu_percent = 3;
  double ram_percent = 4;
  double disk_percent = 5;
  int64 latency_ms = 6;
}

message GetFleetHealthResponse {
  repeated DevServerHealth statuses = 1;
}

message ScanWorkspacePortsRequest {
  string connection_id = 1;
  string worktree_id = 2;
}

message ScanWorkspacePortsResponse {
  repeated int32 open_ports = 1;
}

message KillWorkspacePortRequest {
  string connection_id = 1;
  string worktree_id = 2;
  int32 pid = 3;
  int32 port = 4;
}

message KillWorkspacePortResponse {
  bool ok = 1;
  string reason = 2; // populated only when ok is false
}

message SshTarget {
  string id = 1;
  string tenant_id = 2;
  string host = 3;
  string user = 4;
  string vault_ssh_role = 5; // a Vault role pointer, never key material — safe to return (infra-fleet-service.md §9)
  string project = 6;  // "" = ungrouped
  repeated string tags = 7;
}

message ListSshTargetsRequest {
  // tenant_id intentionally absent — pulled from context, same convention
  // as ListDevServersRequest.
}

message ListSshTargetsResponse {
  repeated SshTarget ssh_targets = 1;
}

message GetSshStateRequest {
  string ssh_target_id = 1;
}

message GetSshStateResponse {
  bool connected = 1;
  string connection_id = 2;       // empty when not connected
  int64 last_activity_unix_ms = 3; // 0 when not connected or never active
}

message EstablishConnectionRequest {
  string ssh_target_id = 1;
}

message Connection {
  string id = 1;                 // the connectionId every other RPC keys on
  string dev_server_id = 2;
  string status = 3;             // "established" | "degraded" | "closed"
  int64 established_at_unix_ms = 4;
}
message SpawnTerminalSessionRequest {
  string connection_id = 1;  // empty = host-local; rejected in server-deployment mode, see usecase.SpawnTerminalSession
  string cwd = 2;
  string shell = 3;          // optional; agent applies its own default if empty
  int32  cols = 4;
  int32  rows = 5;
  // BR-TM-13 — opt-in shell-integration bootstrap (OSC 133). Forwarded
  // unexamined to the agent's pty.create; see SOL-TM-04. Defaults to
  // false — existing callers that don't set it see no behavior change.
  bool   shell_integration = 6;
  // command, when set, is the initial command line the spawned shell runs
  // (agent's pty.create `command` param) instead of an interactive shell
  // prompt — added for github.startAuthLogin/gitlab.startAuthLogin
  // (TASK-INT-01-01), which spawn `gh auth login`/`glab auth login`
  // directly rather than typing it into an interactive shell.
  string command = 7;
  // user_id engages pty-handler.ts's per-user GH_CONFIG_DIR/GLAB_CONFIG_DIR
  // env isolation for a `gh `/`glab `-prefixed command — see
  // pty-handler.ts:680-699. Always set from the caller's authenticated
  // identity server-side (wscompat), never trusted from client args.
  string user_id = 8;
}
message SpawnTerminalSessionResponse {
  TerminalSession session = 1;
}
message TerminalSession {
  string pty_id = 1;
  string connection_id = 2;
  string cwd = 3;
  int64  created_at_unix_ms = 4;
  int64  last_active_at_unix_ms = 5;
}

message SaveTerminalScrollbackSnapshotRequest {
  string worktree_id = 1;
  string pane_key    = 2;
  int32  cols = 3;
  int32  rows = 4;
  bytes  data  = 5;   // raw ANSI text, NOT pre-gzipped by the caller — usecase compresses it
  string last_title = 6;
}

message GetTerminalScrollbackSnapshotRequest {
  string worktree_id = 1;
  string pane_key    = 2;
}
message GetTerminalScrollbackSnapshotResponse {
  bool   found = 1;
  int32  cols = 2;
  int32  rows = 3;
  bytes  data = 4;      // decompressed
  string last_title = 5;
  int64  updated_at_unix_ms = 6;
}

message DeleteTerminalScrollbackSnapshotsRequest {
  string worktree_id = 1;
}

message ResizeTerminalSessionRequest { string pty_id = 1; int32 cols = 2; int32 rows = 3; }
message KillTerminalSessionRequest   { string pty_id = 1; }
message StopTerminalProcessRequest   { string pty_id = 1; } // sends an interrupt signal to the pty's foreground process
message ListTerminalSessionsRequest  { string connection_id = 1; } // empty = all sessions for the caller's tenant
message ListTerminalSessionsResponse { repeated TerminalSession sessions = 1; }

message WaitTerminalSessionRequest  {
  string pty_id = 1;
  int32  timeout_ms = 2; // capped server-side (default max 30s, see usecase.WaitTerminalSession)
}
message WaitTerminalSessionResponse { bool exited = 1; int32 exit_code = 2; bool timed_out = 3; }

message FocusTerminalSessionRequest { string pty_id = 1; }

message GetTerminalAgentStatusRequest  { string pty_id = 1; }
message GetTerminalAgentStatusResponse {
  bool   agent_running = 1;     // answers both terminal.agentStatus and terminal.isRunningAgent
  string agent_kind = 2;        // best-effort, e.g. "claude" | "codex" | "" if unknown
  bool   ready_for_input = 3;   // agentStatus's richer question: is it idle-and-ready, not just alive
}

message GetAgentTerminalSessionRequest  { string worktree_id = 1; }
message GetAgentTerminalSessionResponse {
  bool found = 1;
  TerminalSession session = 2; // unset when found=false
}

message SendTerminalInputRequest { string pty_id = 1; bytes data = 2; }

message GetTerminalScrollbackRequest  { string pty_id = 1; }
message GetTerminalScrollbackResponse {
  string text = 1;
  bool   truncated = 2; // true if the retention bound already dropped
                         // earlier output — an honest signal, not silently
                         // partial data
}

message InspectTerminalProcessRequest  { string pty_id = 1; }
message InspectTerminalProcessResponse {
  bool   known = 1;    // false when the agent can't answer — an honest "unknown", not a fabricated zero value
  int32  pid = 2;
  string command = 3;
  string cwd = 4;
}

message PtyClientFrame {
  oneof frame {
    AttachToSession attach = 1;  // first frame only: which pty_id this stream carries I/O for
    PtyInput        input  = 2;  // terminal.send
    PtyResize       resize = 3;  // low-latency in-stream resize (alternative to the unary RPC above)
  }
}
message AttachToSession { string pty_id = 1; }
message PtyInput  { bytes data = 1; }
message PtyResize { int32 cols = 1; int32 rows = 2; }

message PtyServerFrame {
  oneof frame {
    PtyOutput out    = 1;
    PtyExited exited = 2;
  }
}
message PtyOutput { bytes data = 1; }
message PtyExited { int32 exit_code = 1; }
message BrowserProfile {
  string id = 1;
  string tenant_id = 2;
  string dev_server_id = 3;
  string name = 4;
  string source_browser = 5; // e.g. "chrome", "firefox" — set by profileImportFromBrowser; empty if manually created
  bool is_default = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListBrowserProfilesRequest {
  string dev_server_id = 1; // required — a profile is dev-server-scoped, not tenant-wide
}
message ListBrowserProfilesResponse {
  repeated BrowserProfile profiles = 1;
}

message CreateBrowserProfileRequest {
  string dev_server_id = 1;
  string name = 2;
  string source_browser = 3; // optional
  bool is_default = 4;
}
message CreateBrowserProfileResponse {
  BrowserProfile profile = 1;
}

message DeleteBrowserProfileRequest {
  string id = 1;
}

// --- Emulator/simulator control (TASK-048) --------------------------------

message EmulatorDevice {
  string id = 1;
  string name = 2;
  string platform = 3; // "android" | "ios" — agent-reported, opaque passthrough
  string state = 4;    // e.g. "booted", "shutdown" — agent-reported, opaque passthrough
}

message ListEmulatorDevicesRequest {
  string connection_id = 1; // required — no backend-host fallback, see rpc doc comment
}
message ListEmulatorDevicesResponse {
  repeated EmulatorDevice devices = 1;
}

message GetEmulatorAvailabilityRequest {
  string connection_id = 1; // may be empty — see rpc doc comment
}
message GetEmulatorAvailabilityResponse {
  bool available = 1;
  string reason = 2; // populated when available is false
}

message EmulatorSession {
  string session_id = 1;
  string device_id = 2;
  string connection_id = 3; // which dev server this device runs on
  string platform = 4;      // "android" | "ios"
}

message AttachEmulatorSessionRequest {
  string connection_id = 1;
  string device_id = 2;
}

message SendEmulatorTapRequest {
  string connection_id = 1;
  string session_id = 2;
  int32 x = 3;
  int32 y = 4;
}

message SendEmulatorGestureRequest {
  string connection_id = 1;
  string session_id = 2;
  int32 start_x = 3;
  int32 start_y = 4;
  int32 end_x = 5;
  int32 end_y = 6;
  int32 duration_ms = 7;
}

message SendEmulatorButtonRequest {
  string connection_id = 1;
  string session_id = 2;
  string button = 3; // e.g. "home", "back", "volume_up" — agent-defined vocabulary
}

message RotateEmulatorRequest {
  string connection_id = 1;
  string session_id = 2;
  string orientation = 3; // "portrait" | "landscape"
}

message ShutdownEmulatorRequest {
  string connection_id = 1;
  string session_id = 2;
}

// --- Host capability probing (TASK-070) -----------------------------------

message GetHostCapabilitiesRequest {
  string connection_id = 1; // empty = caller's own backend-go host
}
message GetHostCapabilitiesResponse {
  bool wsl_available = 1;
  repeated string wsl_distros = 2;
  bool pwsh_available = 3;
  bool git_bash_available = 4;
}

// --- Fleet inventory import (BL-FLEET-01) ----------------------------------

message FleetServerInput {
  string host = 1;
  string user = 2;
  string vault_ssh_role = 3;
  string project = 4;
  repeated string tags = 5;
}

message ImportFleetInventoryRequest {
  repeated FleetServerInput servers = 1;
  bool dry_run = 2;
}
message ImportFleetInventoryError { string host = 1; string user = 2; string reason = 3; }
message ImportFleetInventoryResponse {
  int32 imported = 1;
  int32 updated = 2;
  int32 skipped = 3;
  repeated ImportFleetInventoryError errors = 4;
}

// --- Bulk fleet provisioning (BL-FLEET-02) ---------------------------------

message BulkProvisionFleetRequest {
  string project = 1; // "" = all
  int32 concurrency = 2; // 0 = default 5
}
message ProvisionOutcome { string dev_server_id = 1; string host = 2; string status = 3; string error = 4; }
message BulkProvisionFleetResponse {
  int32 success = 1; int32 failed = 2; int32 skipped = 3;
  repeated ProvisionOutcome outcomes = 4;
}

// --- Dev server onboarding: agent detection + remote preflight (BL-FLEET-04) ---

message AgentProbe {
  string id = 1;
  string cmd = 2;
  repeated string required_commands = 3;
  repeated string unsupported_runtimes = 4;
}
message DetectDevServerAgentsRequest {
  string dev_server_id = 1;
  repeated AgentProbe commands = 2;
}
message DetectDevServerAgentsResponse {
  repeated string agents = 1;
  string platform = 2;
}

message CheckDevServerPreflightRequest {
  string dev_server_id = 1;
  int32 probe_port = 2;
}
message CheckResult { bool installed = 1; string version = 2; bool meets_min = 3; }
message DiskCheckResult { double free_gb = 1; bool meets_min = 2; }
message PortCheckResult { int32 port = 1; bool available = 2; }
message CheckDevServerPreflightResponse {
  CheckResult git = 1;
  CheckResult node = 2;
  DiskCheckResult disk = 3;
  PortCheckResult port = 4;
  CheckResult gh = 5;
}

// --- Persistent agent tokens (BL-AWS-03) -----------------------------------

message CreateAgentTokenRequest  { string dev_server_id = 1; string name = 2; }
message CreateAgentTokenResponse {
  string id = 1;
  string token = 2; // plaintext — shown once, never returned again
  string name = 3;
  int64 created_at_unix_ms = 4;
}

message AgentTokenSummary {
  string id = 1;
  string name = 2;
  int64 created_at_unix_ms = 3;
  optional int64 last_used_at_unix_ms = 4;
}
message ListAgentTokensRequest  { string dev_server_id = 1; }
message ListAgentTokensResponse { repeated AgentTokenSummary tokens = 1; }

message RevokeAgentTokenRequest { string dev_server_id = 1; string id = 2; }
