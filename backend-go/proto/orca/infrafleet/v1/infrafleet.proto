syntax = "proto3";

package orca.infrafleet.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/infrafleet/v1;infrafleetv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// InfraFleetService owns SSH targets, dev server registry, connection lifecycle,
// the provider registry (connectionId -> host dispatch), and fleet health.
// See specs/backend-go/services/infra-fleet-service.md.
service InfraFleetService {
  rpc RegisterDevServer(RegisterDevServerRequest) returns (RegisterDevServerResponse);
  rpc ResolveConnection(ResolveConnectionRequest) returns (ResolveConnectionResponse);
  rpc CreateSshTarget(CreateSshTargetRequest) returns (CreateSshTargetResponse);
  rpc GetFleetHealth(GetFleetHealthRequest) returns (GetFleetHealthResponse);
  rpc ScanWorkspacePorts(ScanWorkspacePortsRequest) returns (ScanWorkspacePortsResponse);
  // ListDevServers backs the frontend's devServer.list channel — the
  // DevServerRepository.List method already existed but was never exposed
  // over gRPC before Epic A's second pass.
  rpc ListDevServers(ListDevServersRequest) returns (ListDevServersResponse);
  // ListDevServersByTag backs workflow-service's "fleet:tag:<tag>"
  // dispatch-target shape (TASK-WF-02-02/04) — load-balance across this
  // tenant's healthy dev servers carrying tag.
  rpc ListDevServersByTag(ListDevServersByTagRequest) returns (ListDevServersByTagResponse);
  // --- CR-DS-006 Phase 2 / CR-DS-007 / CR-DS-008 (dev server access control) ---
  rpc ApproveDevServer(ApproveDevServerRequest) returns (ApproveDevServerResponse);
  rpc RejectDevServer(RejectDevServerRequest) returns (RejectDevServerResponse);
  rpc AssignDevServerGroup(AssignDevServerGroupRequest) returns (AssignDevServerGroupResponse);
  rpc CreateDevServerGroup(CreateDevServerGroupRequest) returns (CreateDevServerGroupResponse);
  rpc ListDevServerGroups(ListDevServerGroupsRequest) returns (ListDevServerGroupsResponse);
  rpc GrantDevServerGroupAccess(GrantDevServerGroupAccessRequest) returns (GrantDevServerGroupAccessResponse);
  rpc RevokeDevServerGroupAccess(RevokeDevServerGroupAccessRequest) returns (RevokeDevServerGroupAccessResponse);
  rpc ListDevServerGroupGrants(ListDevServerGroupGrantsRequest) returns (ListDevServerGroupGrantsResponse);
  rpc ListDevServersForUser(ListDevServersForUserRequest) returns (ListDevServersForUserResponse);
  rpc CreateAccessRequest(CreateAccessRequestRequest) returns (CreateAccessRequestResponse);
  rpc ListPendingAccessRequests(ListPendingAccessRequestsRequest) returns (ListPendingAccessRequestsResponse);
  rpc ResolveAccessRequest(ResolveAccessRequestRequest) returns (ResolveAccessRequestResponse);
  // CreateConnection is the write path for infra.connections
  // (migrations/0002_connections) — binds a dev server to a worktree/repo
  // path, producing the connectionId ResolveConnection/Relay resolve
  // against. Without this RPC, connections would be schema nobody writes to.
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  // Relay is the generic connectionId+method+params passthrough onto the Dev
  // Server Agent execution plane — see usecase.Relay's doc comment for why
  // this is a single generic RPC rather than one purpose-built RPC per
  // caller (git-gateway-service's git.*, workflow-service's agent.exec/
  // shell.exec/notification.send, wscompat's devServer.*/fleet.* channels
  // all go through this one).
  rpc Relay(RelayRequest) returns (RelayResponse);
  // RelayStream is Relay's server-streaming counterpart (TASK-PW-03-08,
  // SOL-PW-03) — mirrors Relay's connectionId+method+params shape but for
  // agent methods that reply with multiple frames instead of one (currently
  // only git-gateway-service's PushStream/PullStream, relaying to the
  // agent's git.execStream — specs/agent/api/agent-rpc-catalog-git-fs.md's
  // "git.execStream streaming shape" section). Each frame_json is one
  // JSON-RPC response frame's result, encoded verbatim — same "no per-method
  // translation" contract as RelayResponse.result_json, just repeated.
  rpc RelayStream(RelayStreamRequest) returns (stream RelayStreamFrame);
  // RelayByDevServer is Relay's devServerId-keyed counterpart — see
  // usecase.RelayByDevServer's doc comment for why: a dev server has no
  // infra.connections row (what Relay resolves through) until a repo/
  // worktree is bound to it, but "browse this dev server's filesystem to
  // pick the first repo/worktree" needs to reach the agent BEFORE that
  // exists. Bypasses infra.connections entirely.
  rpc RelayByDevServer(RelayByDevServerRequest) returns (RelayResponse);
  // StreamFileChanges subscribes to fs.changed push notifications for one
  // watched path (BACKLOG-003) — Relay/RelayByDevServer above are unary
  // request/response only, so they can carry fs.watch's initial ack but not
  // the ongoing push stream the agent's watcher emits afterward. Same dual
  // connection_id/dev_server_id addressing as Relay/RelayByDevServer
  // (exactly one set); see devserveragent.Client.StreamFileChanges's doc
  // comment for the fs.watch/fs.unwatch/fs.changed wire contract this
  // subscribes to, and this RPC's own usecase for why it's plain
  // server-streaming (no inbound frame needed — unlike AttachPty/
  // AttachScreencast, there's no interactive input to send once watching
  // starts; the caller ends the subscription by canceling this call's ctx).
  rpc StreamFileChanges(StreamFileChangesRequest) returns (stream FileChangeEvent);
  // IsDevServerConnected answers "does this dev server have a live agent
  // session right now" — cheap, side-effect-free (never dials). Replaces
  // the hardcoded "disconnected" wscompat's devServer.list/listForUser used
  // to always report regardless of the agent's real state.
  rpc IsDevServerConnected(IsDevServerConnectedRequest) returns (IsDevServerConnectedResponse);
  // ListSshTargets backs ssh.listTargets and ssh.getUserAccount (the
  // latter derives from this same read — see wscompat's registerSshChannels).
  rpc ListSshTargets(ListSshTargetsRequest) returns (ListSshTargetsResponse);
  // GetSshState is a local read (no dial) of whichever connection (if any)
  // currently binds this SSH target's dev server.
  rpc GetSshState(GetSshStateRequest) returns (GetSshStateResponse);
  // GetFleetConnectivitySummary is CR-STORAGE-007's poll-driven health
  // summary — a plain Postgres read (no dial) over every connections row
  // scoped to the caller's tenant, joined with dev_servers. Request is
  // deliberately empty: tenant/user scoping comes from gRPC metadata
  // (identity), never a request field — see BE-SOL-STORAGE-002 §5.
  rpc GetFleetConnectivitySummary(GetFleetConnectivitySummaryRequest) returns (GetFleetConnectivitySummaryResponse);
  // EstablishConnection performs the actual SSH + Dev Server Agent
  // handshake synchronously — it IS the connection-establishment act, not
  // a record of one requested. See usecase.EstablishConnection's doc comment.
  rpc EstablishConnection(EstablishConnectionRequest) returns (Connection);
  // TeardownConnection serves two callers: BR-SSH-13's "Cancel" action
  // (marks the connection closed and stops any in-flight relaySSHReconnect
  // backoff loop) and the confirmed-logout explicit-close path
  // (BE-SOL-STORAGE-003 §5, TASK-BE-STORAGE-012) — the one deliberate
  // exception to the reconnect-resume grace period (BE-SOL-STORAGE-003 §2):
  // established|degraded -> closed immediately, no waiting for
  // grace_period_seconds to elapse.
  rpc TeardownConnection(TeardownConnectionRequest) returns (google.protobuf.Empty);
  rpc KillWorkspacePort(KillWorkspacePortRequest) returns (KillWorkspacePortResponse);

  // CreateAgentToken/ListAgentTokens/RevokeAgentToken back BL-AWS-03's
  // persistent, named, per-DevServer agent token admin surface — see
  // specs/backend-go/bugs/logic-v1/solutions/SOL-AWS-03-agent-token-management.md.
  rpc CreateAgentToken(CreateAgentTokenRequest) returns (CreateAgentTokenResponse);
  rpc ListAgentTokens(ListAgentTokensRequest) returns (ListAgentTokensResponse);
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (google.protobuf.Empty);

  // --- Auto port-forwarding (SOL-SSH-04) ---
  rpc CreatePortForward(CreatePortForwardRequest) returns (PortForward);
  rpc ListPortForwards(ListPortForwardsRequest) returns (ListPortForwardsResponse);
  rpc DeletePortForward(DeletePortForwardRequest) returns (google.protobuf.Empty);
  // StreamPortForwardEvents pushes port_opened/port_closed lifecycle events
  // for one connectionId — BR-SSH-15's "live push, no polling" requirement
  // (TASK-SSH-04-08), fed by internal/adapter/portevents.Broadcaster.
  rpc StreamPortForwardEvents(StreamPortForwardEventsRequest) returns (stream PortForwardEvent);

  // --- Terminal/PTY lifecycle (control-plane, unary) ---
  rpc SpawnTerminalSession(SpawnTerminalSessionRequest) returns (SpawnTerminalSessionResponse);
  rpc ResizeTerminalSession(ResizeTerminalSessionRequest) returns (google.protobuf.Empty);
  rpc KillTerminalSession(KillTerminalSessionRequest) returns (google.protobuf.Empty);      // terminal.close
  rpc StopTerminalProcess(StopTerminalProcessRequest) returns (google.protobuf.Empty);      // terminal.stop — interrupt, not teardown
  rpc ListTerminalSessions(ListTerminalSessionsRequest) returns (ListTerminalSessionsResponse);
  rpc WaitTerminalSession(WaitTerminalSessionRequest) returns (WaitTerminalSessionResponse); // terminal.wait — bounded blocking poll
  rpc FocusTerminalSession(FocusTerminalSessionRequest) returns (google.protobuf.Empty);     // terminal.focus — bookkeeping touch
  rpc GetTerminalAgentStatus(GetTerminalAgentStatusRequest) returns (GetTerminalAgentStatusResponse); // backs BOTH terminal.agentStatus and terminal.isRunningAgent
  rpc InspectTerminalProcess(InspectTerminalProcessRequest) returns (InspectTerminalProcessResponse); // best-effort — see message doc comment

  // --- Terminal scrollback persistence (SOL-TM-03) — distinct from
  // AttachPty/live PTY I/O. NOT the same path as terminal.multiplex's
  // SnapshotRequest opcode, which resolves against a LIVE pty_id this flow
  // structurally cannot have (a fresh pty_id is spawned on worktree reopen).
  rpc SaveTerminalScrollbackSnapshot(SaveTerminalScrollbackSnapshotRequest) returns (google.protobuf.Empty);
  rpc GetTerminalScrollbackSnapshot(GetTerminalScrollbackSnapshotRequest) returns (GetTerminalScrollbackSnapshotResponse);
  // Called by git-gateway-service's RemoveWorktree on hard worktree deletion
  // — cleanup, not part of the save/restore flow itself.
  rpc DeleteTerminalScrollbackSnapshots(DeleteTerminalScrollbackSnapshotsRequest) returns (google.protobuf.Empty);

  // GetAgentTerminalSession resolves worktree_id -> the live TerminalSession
  // whose cwd matches that worktree's path, if one exists. Composes
  // ResolveConnection + ListTerminalSessions server-side so no caller
  // re-derives the match/tie-break logic itself.
  rpc GetAgentTerminalSession(GetAgentTerminalSessionRequest) returns (GetAgentTerminalSessionResponse);

  // SendTerminalInput writes directly to the pty's input, bypassing
  // AttachPty's stream — for stateless (REST/CLI) callers that never
  // attach. GUI callers keep using terminal.send/AttachPty for lower
  // latency; this is not a replacement for that path.
  rpc SendTerminalInput(SendTerminalInputRequest) returns (google.protobuf.Empty);

  // GetTerminalScrollback returns a flat-text capture of a pty's recent
  // output, for callers that want a redirectable string, not multiplex
  // frames.
  rpc GetTerminalScrollback(GetTerminalScrollbackRequest) returns (GetTerminalScrollbackResponse);
  // DispatchPrompt is the ONE decision point BR-MB-09/10/12 all reduce to:
  // gate on agent readiness, queue if running, require confirmation to
  // overwrite an existing queued prompt.
  rpc DispatchPrompt(DispatchPromptRequest) returns (DispatchPromptResponse);
  rpc GetQueuedPrompt(GetQueuedPromptRequest) returns (GetQueuedPromptResponse);

  // --- Terminal/PTY I/O ---
  // The "server-streaming terminal-data endpoint" infra-fleet-service.md §7
  // names but §3 never enumerates. Bidirectional, not server-streaming-only:
  // §3's RouteTerminalWrite only routes control-plane metadata, never per-
  // byte input, so a client->server data channel was still missing — this
  // RPC is opened once per terminal.create by api-gateway's wscompat bridge
  // (TASK-186) and piped into `push` frames via TASK-012's pipePush.
  rpc AttachPty(stream PtyClientFrame) returns (stream PtyServerFrame);

  // AttachScreencast is browser.screencast's transport — the remote-
  // headless-browser live-view stream, mirroring AttachPty's bidi shape
  // exactly (see docs/execution-plan.md and TASK-036's "Status by layer"
  // section for why this exists: the agent+backend-go layers of the 12-op
  // browser.* relay were already real, but the live view was missing).
  // frame_data carries opaque, already-encoded bytes produced agent-side
  // by encodeBrowserScreencastFrame (frontend/src/shared/browser-screencast-protocol.ts,
  // copied verbatim into agent/src/shared/) — infra-fleet-service and
  // api-gateway never parse image bytes, they relay them byte-for-byte.
  // dialog/dialogClosed are deliberately NOT modeled here — see
  // channels_browser_screencast.go's doc comment for the scope cut.
  rpc AttachScreencast(stream ScreencastClientFrame) returns (stream ScreencastServerFrame);

  // ListBrowserProfiles/CreateBrowserProfile/DeleteBrowserProfile back
  // api-gateway's browser.profileList/profileCreate/profileDelete channels
  // (SOL-006 Group C) — Postgres-backed metadata CRUD, mirroring
  // CreateSshTarget's shape. NOT the same as the 3 live-agent profile
  // operations (profileClearDefaultCookies/profileDetectBrowsers/
  // profileImportFromBrowser), which relay via Relay instead — see
  // specs/backend-go/bugs/missing-v1/solutions/SOL-006-browser-channels.md.
  rpc ListBrowserProfiles(ListBrowserProfilesRequest) returns (ListBrowserProfilesResponse);
  rpc CreateBrowserProfile(CreateBrowserProfileRequest) returns (CreateBrowserProfileResponse);
  rpc DeleteBrowserProfile(DeleteBrowserProfileRequest) returns (google.protobuf.Empty);

  // --- Emulator/simulator control, relayed to the Dev Server Agent (TASK-048) ---
  // Every RPC here except GetEmulatorAvailability requires connection_id —
  // there is deliberately no local/backend-host fallback (driving emulators
  // on the shared backend-go host is out of scope by design, see
  // usecase.EmulatorRelay's doc comment). agent/ has no device.* RPC surface
  // today (confirmed absent as of this pass) — every call below reaches a
  // real agent and fails with a typed, permanent FailedPrecondition until
  // agent/ gains one; see specs/backend-go/bugs/missing-v1/tasks/TASK-048.
  rpc ListEmulatorDevices(ListEmulatorDevicesRequest) returns (ListEmulatorDevicesResponse);
  rpc GetEmulatorAvailability(GetEmulatorAvailabilityRequest) returns (GetEmulatorAvailabilityResponse);
  rpc AttachEmulatorSession(AttachEmulatorSessionRequest) returns (EmulatorSession);
  rpc SendEmulatorTap(SendEmulatorTapRequest) returns (google.protobuf.Empty);
  rpc SendEmulatorGesture(SendEmulatorGestureRequest) returns (google.protobuf.Empty);
  rpc SendEmulatorButton(SendEmulatorButtonRequest) returns (google.protobuf.Empty);
  rpc RotateEmulator(RotateEmulatorRequest) returns (google.protobuf.Empty);
  rpc ShutdownEmulator(ShutdownEmulatorRequest) returns (google.protobuf.Empty);

  // GetHostCapabilities is the per-target WSL/pwsh/git-bash probe (TASK-070)
  // — connection_id empty resolves to the caller's own backend-go host and
  // is answered locally and honestly (false/[]), no relay attempted,
  // matching TASK-068's existing host.* stub semantics; a non-empty
  // connection_id relays to the agent's host.capabilities method, which
  // does not exist yet (confirmed absent as of this pass) — see
  // usecase.GetHostCapabilities's doc comment.
  rpc GetHostCapabilities(GetHostCapabilitiesRequest) returns (GetHostCapabilitiesResponse);

  // ImportFleetInventory is the batch YAML-import entry point for BL-FLEET-01
  // — upserts SshTargets by (tenant_id, host, user), see
  // usecase.ImportFleetInventory's doc comment.
  rpc ImportFleetInventory(ImportFleetInventoryRequest) returns (ImportFleetInventoryResponse);

  // BulkProvisionFleet fans out provisioning across a tenant's SSH targets
  // — unary (not streaming): bulk provisioning is N-servers-in-parallel,
  // not one server's steps in sequence, and BL-FLEET-02's own contract is
  // a single terminal summary object. See usecase.BulkProvisionFleet's doc
  // comment.
  rpc BulkProvisionFleet(BulkProvisionFleetRequest) returns (BulkProvisionFleetResponse);

  // DetectDevServerAgents/CheckDevServerPreflight close BL-FLEET-04 Steps
  // 3/4 (agent detection, remote preflight) — see usecase.DetectDevServerAgents
  // / usecase.CheckDevServerPreflight doc comments.
  rpc DetectDevServerAgents(DetectDevServerAgentsRequest) returns (DetectDevServerAgentsResponse);
  rpc CheckDevServerPreflight(CheckDevServerPreflightRequest) returns (CheckDevServerPreflightResponse);

  // --- Agent sessions (SOL-AG-01..05) --------------------------------------

  // StartAgentSession spawns an AI-CLI agent (Claude Code, Codex, ...) via
  // the Dev Server Agent's real agent.spawn RPC — sibling to
  // SpawnTerminalSession, not a replacement (a bare shell PTY still uses
  // SpawnTerminalSession).
  rpc StartAgentSession(StartAgentSessionRequest) returns (AgentSession);

  // StopAgentSession sends agent.sendInput('\x03') — graceful interrupt,
  // BR-AG-05. Does not tear the session down; the transition to 'stopped'
  // happens once agent.exited arrives (TASK-AG-05's classifier) — status
  // transition is exit-driven, not request-driven.
  rpc StopAgentSession(StopAgentSessionRequest) returns (google.protobuf.Empty);

  // KillAgentSession sends agent.kill with the given signal (default
  // SIGKILL) — full teardown, mirrors KillTerminalSession's "mark closed
  // even if the agent call fails" discipline.
  rpc KillAgentSession(KillAgentSessionRequest) returns (google.protobuf.Empty);

  // ResumeAgentSession — loads the latest AgentSession for worktree_id,
  // validates BR-AG-08 (7-day expiry) and BR-AG-09 (agent version match),
  // then re-spawns via the same path as StartAgentSession with resume_id
  // populated.
  rpc ResumeAgentSession(ResumeAgentSessionRequest) returns (AgentSession);

  // SwitchAgentAccount — BL-AG-04's saga: force-kill the current session,
  // resolve a replacement account excluding the one just switched away
  // from, then resume/start with the new account.
  rpc SwitchAgentAccount(SwitchAgentAccountRequest) returns (AgentSession);

  // ListEphemeralVmRuntimes is a plain tenant-scoped Postgres read (no
  // relay) of every non-destroyed ephemeral_vm_runtimes row — SOL-004
  // Group 1's second read. Written to by EphemeralVmRelay (TASK-004).
  rpc ListEphemeralVmRuntimes(ListEphemeralVmRuntimesRequest) returns (ListEphemeralVmRuntimesResponse);

  // AttachEphemeralVmWorkspace is pure bookkeeping (no agent relay) — binds
  // an already-provisioned runtime to a workspace/worktree id. See
  // EphemeralVmRelay's doc comment for why this differs from SOL-004's own
  // sketch (which incorrectly modeled it as a create-command exec).
  rpc AttachEphemeralVmWorkspace(AttachEphemeralVmWorkspaceRequest) returns (EphemeralVmRuntime);
  // SuspendEphemeralVmWorkspace/ResumeEphemeralVmWorkspace/CleanupEphemeralVmWorkspace
  // relay `command` (the recipe's suspend/resume/destroy shell command,
  // resolved by api-gateway's wscompat layer via git-gateway-service's
  // ReadEphemeralVmRecipes — see TASK-005) to the repo's Dev Server via a
  // new agent-side `vm.exec` method that does not exist today. Every call
  // reaches a real agent and fails with a typed, permanent
  // INFRA_EPHEMERAL_VM_UNSUPPORTED FailedPrecondition until agent/ gains
  // one — see EmulatorRelay's identical, already-shipped pattern.
  rpc SuspendEphemeralVmWorkspace(SuspendEphemeralVmWorkspaceRequest) returns (EphemeralVmRuntime);
  rpc ResumeEphemeralVmWorkspace(ResumeEphemeralVmWorkspaceRequest) returns (EphemeralVmRuntime);
  rpc CleanupEphemeralVmWorkspace(CleanupEphemeralVmWorkspaceRequest) returns (EphemeralVmRuntime);

  // StreamVmProvision runs a recipe's provision command against the Dev
  // Server Agent and streams its stdout/stderr back live, mirroring
  // AttachScreencast/AttachPty's precedent (BE-SOL-EVM-002 §2) rather than a
  // unary call — provisioning a real VM can take minutes. The terminal
  // "result"-typed event carries VmProvisionResult; the "ssh" branch is
  // pass-through only here (no dial) — see BE-SOL-EVM-004 for that.
  rpc StreamVmProvision(StreamVmProvisionRequest) returns (stream VmProvisionEvent);
}

enum ConnectionMode {
  CONNECTION_MODE_UNSPECIFIED = 0;
  CONNECTION_MODE_RELAY_SSH = 1;
  CONNECTION_MODE_RELAY_WEBSOCKET = 2;
  CONNECTION_MODE_DIRECT_WEBSOCKET = 3;
}

// AgentKind distinguishes a Dev Server Agent registration (agent/, drives
// git/fs/pty/browser on the machine holding the project's code) from a
// Mobile Emulator Agent registration (emulator/, drives Android/iOS
// device.* control on whichever machine has Android Studio/Xcode) — both
// register through the same RegisterDevServer RPC and share this same
// registry/approval/grouping infra, they just carry a different kind. See
// docs/crs/v2/dev-server/CR-DS-009-mobile-emulator-agent-separation.md §3.1.
// UNSPECIFIED on RegisterDevServerRequest is treated as AGENT_KIND_DEV_SERVER
// by the usecase (back-compat default for agent/ builds that predate this
// field and never set it).
enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;
  AGENT_KIND_DEV_SERVER = 1;
  AGENT_KIND_MOBILE_EMULATOR = 2;
}

// ListEphemeralVmRuntimesRequest carries no fields — tenant scoping comes
// from the caller's gRPC metadata via tenant.RequireTenantID, the same
// convention EmulatorRelay's methods use.
message ListEphemeralVmRuntimesRequest {}
message ListEphemeralVmRuntimesResponse { repeated EphemeralVmRuntime runtimes = 1; }
message EphemeralVmRuntime {
  string id = 1;
  string repo_id = 2;
  string recipe_id = 3;
  string connection_type = 4;   // "orca-server" | "ssh" | "" (unset until create/resume's result is parsed)
  string status = 5;            // "provisioning" | "active" | "suspended" | "error" | "destroyed"
  string environment_id = 6;    // set once an orca-server-type recipe's pairing succeeds
  string workspace_id = 7;      // set by AttachWorkspace (TASK-004); empty until attached
  string last_error = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message AttachEphemeralVmWorkspaceRequest { string runtime_id = 1; string workspace_id = 2; }
message SuspendEphemeralVmWorkspaceRequest { string connection_id = 1; string workspace_id = 2; string command = 3; }
message ResumeEphemeralVmWorkspaceRequest { string connection_id = 1; string workspace_id = 2; string command = 3; }
message CleanupEphemeralVmWorkspaceRequest { string connection_id = 1; string runtime_id = 2; string command = 3; }

message StreamVmProvisionRequest {
  string connection_id = 1;
  string recipe_id = 2;
  string runtime_id = 3;
  // command is the recipe's resolved `create` shell command — resolved
  // server-side by api-gateway's wscompat layer via git-gateway-service's
  // ReadEphemeralVmRecipes (TASK-BE-EVM-005), the same pattern
  // Suspend/Resume/CleanupEphemeralVmWorkspaceRequest already use for their
  // own `command` field. infra-fleet-service must not gain a dependency on
  // git-gateway-service (EphemeralVmRelay's doc comment — the existing
  // dependency direction is the other way), so it cannot resolve this
  // itself; added here (missing from this message's original TASK-BE-EVM-002
  // pass) once TASK-BE-EVM-004's Provision usecase confirmed it needs one,
  // mirroring the 3 sibling request messages' shape.
  string command = 4;
}
message VmProvisionEvent {
  string type = 1;   // "stdout" | "stderr" | "result" | "error"
  string chunk = 2;
  VmProvisionResult result = 3; // set only when type == "result"
}
message VmProvisionResult {
  string type = 1;          // "orca-server" | "ssh"
  string pairing_code = 2;  // set when type == "orca-server"
  string project_root = 3;
  EphemeralVmRecipeSshTarget ssh_target = 4; // set when type == "ssh"
}
// EphemeralVmRecipeSshTarget mirrors frontend/src/shared/ephemeral-vm-recipes.ts's
// EphemeralVmRecipeSshTargetSchema field-for-field, with two deliberate
// omissions (BE-SOL-EVM-002 §6 field cross-check):
//  - config_host: frontend-only, display-label derived from the recipe's
//    source ssh/config Host entry — never used as SSH dial input, so it
//    carries nothing this pass-through result needs.
//  - port_forwards: local port-forward config for the actual SSH dial,
//    which is explicitly out of scope here (§5: the "ssh" branch is
//    pass-through only, never dialed — see BE-SOL-EVM-004/CR-EVM-005).
//    Add it to this message when that task wires a real dial.
// RecipePortForward mirrors frontend's SavedPortForward
// (frontend/src/shared/ssh-types.ts) field-for-field — see
// CR-EVM-008/TASK-BE-EVM-020. Named distinctly from PortForward below (the
// auto-port-forwarding feature's DB-row shape, SOL-SSH-04) — same English
// name, different concepts: this one is a recipe-supplied config value with
// no CRUD lifecycle of its own.
message RecipePortForward {
  int32 local_port = 1;
  string remote_host = 2;
  int32 remote_port = 3;
  string label = 4;
}

message EphemeralVmRecipeSshTarget {
  string label = 1;
  string host = 2;
  int32 port = 3;
  string username = 4;
  string identity_file = 5;
  string identity_agent = 6;
  bool identities_only = 7;
  string proxy_command = 8;
  string jump_host = 9;
  int32 relay_grace_period_seconds = 10;
  // port_forwards — CR-EVM-008/TASK-BE-EVM-020. Previously decoded and
  // deliberately dropped at ports.go/devserveragent/client.go (no proto
  // field existed to carry it through) — now wired end to end, see
  // TASK-BE-EVM-021/022 and agent's TASK-AG-EVM-011 (Hướng A).
  repeated RecipePortForward port_forwards = 11;
}

message DevServer {
  string id = 1;
  string tenant_id = 2;
  string host = 3;
  ConnectionMode mode = 4;
  // ssh_target_id links this dev server to the SshTarget sshconn.Connector
  // dials for cert-based SSH auth — required when mode is
  // CONNECTION_MODE_RELAY_SSH, empty for the other two modes. Closes the
  // "DevServer<->SshTarget linkage the domain model doesn't have yet" gap
  // this service's README flagged (Epic A third pass).
  string ssh_target_id = 5;
  // approval_status/group_id — CR-DS-006 Phase 2
  // (docs/crs/v2/dev-server/CR-DS-006-dev-server-approval-and-grouping.md).
  // Column named approval_status, not status: infra.dev_servers already has
  // an unrelated status column (health/bootstrap state) from a separate
  // migration — see migrations/0008_dev_server_approval_status_and_groups.up.sql's
  // header comment.
  string approval_status = 6; // pending_approval | approved | rejected
  string group_id = 7;        // empty = ungrouped
  // kind — CR-DS-009 §3.1. Every row registered before this field existed
  // backfills to AGENT_KIND_DEV_SERVER (migrations/0011_dev_server_kind).
  AgentKind kind = 8;
  // health_status is domain.DevServerHealthStatus verbatim: pending|healthy|
  // degraded|unhealthy — see BulkProvisionFleet's doc comment
  // (SOL-FLEET-02) and
  // docs/backlog/BACKLOG-007-dev-server-bootstrap-status-proto-field.md
  // (option 2: reuse this coarse status for bootstrap.ts instead of adding
  // a dedicated per-step bootstrap field). Distinct from approval_status
  // above (admin approval, not connectivity/health) — see
  // domain.DevServerHealthStatus's doc comment.
  string health_status = 9;
  // platform/arch/node_version/agent_version are handshake-derived facts
  // (SOL-FLEET-04) — the same columns SOL-FLEET-02's BulkProvisionFleet
  // also persists into (domain.DevServer), see
  // usecase.DevServerRepository.UpdateProvisionResult.
  string platform = 10;
  string arch = 11;
  string node_version = 12;
  string agent_version = 13;
  // tags is free-form, tenant-scoped (e.g. "gpu", "region:us-east"); also
  // BL-PRF-03's allowedServerTags match target and WF's ListDevServersByTag
  // dispatch-target key.
  repeated string tags = 14;
}

message RegisterDevServerRequest {
  string tenant_id = 1;
  string host = 2;
  ConnectionMode mode = 3;
  string ssh_target_id = 4; // required when mode=CONNECTION_MODE_RELAY_SSH
  // relay_port: 0 = no daemon port — foreground stdio session, honest
  // placeholder until agent/ gains a daemon (see TASK-FLEET-02-08).
  int32 relay_port = 5;
  repeated string tags = 6; // BL-PRF-03's allowedServerTags match target
  // kind — CR-DS-009 §3.1. AGENT_KIND_UNSPECIFIED defaults to
  // AGENT_KIND_DEV_SERVER server-side, see AgentKind's doc comment.
  AgentKind kind = 7;
}

message RegisterDevServerResponse {
  DevServer dev_server = 1;
}

// ResolveConnection is the core dispatch primitive every other service
// (git-gateway-service, project-service, task-service) calls to answer
// "which host owns this connectionId, and how do I reach it".
message ResolveConnectionRequest {
  // Exactly one of connection_id, dev_server_id, worktree_id is set. Empty
  // connection_id with both alternates also empty resolves nothing
  // (ResolveConnectionOutput{Connected: false}), matching today's
  // empty-connectionId short-circuit.
  string connection_id = 1;
  // dev_server_id resolves the dev server's current active connectionId,
  // the reverse of connection_id's lookup direction — used by
  // ai-provider-service's TestConnection (see
  // specs/backend-go/bugs/missing-v1/tasks/TASK-028-implement-aiprovider-test-connection-usecase.md).
  string dev_server_id = 2;
  // worktree_id resolves the connectionId currently bound to a worktree —
  // used by api-gateway's browser.* relay channels (see
  // specs/backend-go/bugs/missing-v1/tasks/TASK-034-add-browser-pane-relay-wscompat-channels.md).
  // Mirrors CreateConnectionRequest's (dev_server_id, repo_path,
  // worktree_id) tuple in reverse.
  string worktree_id = 3;
}

message ResolveConnectionResponse {
  bool connected = 1; // false => execute locally, no relay
  DevServer dev_server = 2;
  // repo_path/worktree_id are the per-connection metadata stored on
  // infra.connections (migrations/0002_connections) — empty when connected
  // is false. Callers like git-gateway-service's RelayExecutor need
  // repo_path alongside dev_server to know which path to operate on.
  string repo_path = 3;
  string worktree_id = 4;
  // connection_id is the resolved infra.connections.id — the value Relay's
  // RelayRequest.connection_id expects. Populated regardless of which
  // ResolveConnectionRequest key resolved this row, so a dev_server_id- or
  // worktree_id-keyed caller (TestConnection, browser.* channels) has a
  // valid Relay connection_id without re-deriving it from DevServer.id,
  // which is a different id space (dev_servers.id, not connections.id).
  string connection_id = 5;
  // node_version is the connected session's self-reported Node.js version
  // (devserveragent.HandshakeInfo.NodeVersion, captured at handshake time)
  // — empty when connected is false or the session predates this field.
  // Added for SOL-INT-03's preflight merge; not populated by any other RPC.
  string node_version = 6;
  // hidden_target_id (TASK-BE-EVM-018, BE-SOL-EVM-004 §4/§6c) is set ONLY
  // when this connection's worktree is attached to an ephemeral VM runtime
  // whose connection_type is "ssh" (Hướng A, agent-outbound) — by
  // convention, equal to that runtime's id. Empty for every other
  // connection (the overwhelming majority) — an orthogonal routing
  // attribute, NOT a new dev_server/host: dev_server above still points at
  // the SAME, ALREADY-EXISTING Dev Server that ran vm.provision (decision
  // 3 in BE-SOL-EVM-004's "Quyết định đã chốt"). git-gateway-service's
  // RelayExecutor uses this to pick a "<method>ViaHiddenTarget" agent
  // method instead of the normal one (TASK-BE-EVM-015).
  string hidden_target_id = 7;
}

message ListDevServersRequest {
  // tenant_id is intentionally absent — pulled from request context (see
  // RegisterDevServerInput's doc comment for the same convention), never
  // trusted from the caller.
  // kind — CR-DS-009 §3.1: AGENT_KIND_UNSPECIFIED (the zero value) returns
  // every dev server regardless of kind, matching this RPC's behavior
  // before this field existed — existing callers that never set it are
  // unaffected.
  AgentKind kind = 1;
}

message ListDevServersResponse {
  repeated DevServer dev_servers = 1;
}

message ListDevServersByTagRequest {
  string tag = 1;
  bool healthy_only = 2; // filters against GetFleetHealth's own reachability check
}

message ListDevServersByTagResponse {
  repeated DevServer dev_servers = 1;
}

// ── CR-DS-006 Phase 2: admin approval + grouping ────────────────────────
// docs/crs/v2/dev-server/CR-DS-006-dev-server-approval-and-grouping.md

message DevServerGroup {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string parent_group_id = 4; // empty = root of the tree
}

// ApproveDevServer/RejectDevServer/AssignDevServerGroup are admin-gated —
// see usecase.requireAdmin (internal/usecase/authorization.go), which reads
// the caller's role from common/tenant.Role(ctx). Fails closed
// (PermissionDenied) if the role claim is absent, per that gap's own
// documented "empty means unknown, never trust it" contract.
message ApproveDevServerRequest {
  string dev_server_id = 1;
}
message ApproveDevServerResponse {
  DevServer dev_server = 1;
}

message RejectDevServerRequest {
  string dev_server_id = 1;
  string reason = 2;
}
message RejectDevServerResponse {
  DevServer dev_server = 1;
}

message AssignDevServerGroupRequest {
  string dev_server_id = 1;
  string group_id = 2; // empty = unassign (ungroup)
}
message AssignDevServerGroupResponse {
  DevServer dev_server = 1;
}

message CreateDevServerGroupRequest {
  string name = 1;
  string parent_group_id = 2;
}
message CreateDevServerGroupResponse {
  DevServerGroup group = 1;
}

message ListDevServerGroupsRequest {
  // tenant_id intentionally absent — pulled from context, same convention
  // as ListDevServersRequest.
}
message ListDevServerGroupsResponse {
  repeated DevServerGroup groups = 1;
}

// ── CR-DS-007: department/team ↔ group access grants ────────────────────
// docs/crs/v2/dev-server/CR-DS-007-department-based-access-control.md
//
// Open decisions this proto encodes an answer to (recorded, not silently
// assumed — see that CR's §3 and this pass's own solution docs for the
// reasoning): ungrouped/unassigned dev servers are admin-only (never
// returned by ListDevServersForUser); a group's grants are inherited by
// every descendant group in its tree; department and team grants are OR'd
// together (either one is sufficient).

enum DevServerGroupGranteeKind {
  DEV_SERVER_GROUP_GRANTEE_KIND_UNSPECIFIED = 0;
  DEV_SERVER_GROUP_GRANTEE_KIND_DEPARTMENT = 1;
  DEV_SERVER_GROUP_GRANTEE_KIND_TEAM = 2;
}

message DevServerGroupGrant {
  string id = 1;
  string tenant_id = 2;
  string dev_server_group_id = 3;
  DevServerGroupGranteeKind grantee_kind = 4;
  string grantee_id = 5; // department_id or team_id — logical FK into tenant-service
}

// GrantDevServerGroupAccess/RevokeDevServerGroupAccess are admin-gated.
message GrantDevServerGroupAccessRequest {
  string dev_server_group_id = 1;
  DevServerGroupGranteeKind grantee_kind = 2;
  string grantee_id = 3;
}
message GrantDevServerGroupAccessResponse {
  DevServerGroupGrant grant = 1;
}

message RevokeDevServerGroupAccessRequest {
  string grant_id = 1;
}
message RevokeDevServerGroupAccessResponse {}

message ListDevServerGroupGrantsRequest {
  string dev_server_group_id = 1; // empty = every grant in the tenant
}
message ListDevServerGroupGrantsResponse {
  repeated DevServerGroupGrant grants = 1;
}

// ListDevServersForUser is NOT admin-gated (every authenticated tenant user
// calls this) — department_id/team_ids are supplied by the caller
// (api-gateway, having already resolved them via
// tenant-service.GetResolvedProfile), not looked up by infra-fleet-service
// itself. Matches the "multi-service view assembled at api-gateway's edge,
// not inside either owning service" pattern
// worktree.detectedList/registerWorktreeChannels already established — see
// that channel's doc comment. Keeps infra-fleet-service free of a new
// cross-service dependency on tenant-service.
message ListDevServersForUserRequest {
  string department_id = 1; // "" if the user has none
  repeated string team_ids = 2;
  // kind — CR-DS-009 §3.1, same "unspecified = no filter" convention as
  // ListDevServersRequest.kind.
  AgentKind kind = 3;
}
message ListDevServersForUserResponse {
  repeated DevServer dev_servers = 1;
}

// ── CR-DS-008: dev server access requests ───────────────────────────────
// docs/crs/v2/dev-server/CR-DS-008-first-login-department-gate-and-access-request.md

enum DevServerAccessRequestStatus {
  DEV_SERVER_ACCESS_REQUEST_STATUS_UNSPECIFIED = 0;
  DEV_SERVER_ACCESS_REQUEST_STATUS_PENDING = 1;
  DEV_SERVER_ACCESS_REQUEST_STATUS_APPROVED = 2;
  DEV_SERVER_ACCESS_REQUEST_STATUS_REJECTED = 3;
}

message DevServerAccessRequest {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string dev_server_group_id = 4;
  DevServerAccessRequestStatus status = 5;
  string message = 6;
  int64 created_at_unix_ms = 7;
  // grantee_kind/grantee_id — captured at request-creation time (computed
  // by api-gateway from the requester's tenant-service profile, same
  // "resolve at the edge" reasoning as ListDevServersForUserRequest's
  // department_id/team_ids), not re-derived at resolve time. When approved,
  // ResolveAccessRequest grants exactly this (kind, id) pair — see that
  // RPC's doc comment.
  DevServerGroupGranteeKind grantee_kind = 8;
  string grantee_id = 9;
}

// CreateAccessRequest is called by any authenticated tenant user — not
// admin-gated (the whole point is a non-admin asking for access).
// grantee_kind/grantee_id are supplied by the caller (api-gateway), same
// reasoning as DevServerAccessRequest.grantee_kind's doc comment — this
// service never looks up the requester's department/team itself.
message CreateAccessRequestRequest {
  string dev_server_group_id = 1;
  string message = 2;
  DevServerGroupGranteeKind grantee_kind = 3;
  string grantee_id = 4;
}
message CreateAccessRequestResponse {
  DevServerAccessRequest request = 1;
}

// ListPendingAccessRequests/ResolveAccessRequest are admin-gated.
message ListPendingAccessRequestsRequest {}
message ListPendingAccessRequestsResponse {
  repeated DevServerAccessRequest requests = 1;
}

message ResolveAccessRequestRequest {
  string request_id = 1;
  bool approve = 2; // false = reject
}
message ResolveAccessRequestResponse {
  DevServerAccessRequest request = 1;
  // grant is populated only when approve=true — the GrantDevServerGroupAccess
  // row this resolution created for the requester's department/team.
  DevServerGroupGrant grant = 2;
}

message CreateConnectionRequest {
  string dev_server_id = 1;
  string repo_path = 2;
  string worktree_id = 3;
}

message CreateConnectionResponse {
  string connection_id = 1;
}

message RelayRequest {
  string connection_id = 1;
  string method = 2;
  // params_json is a JSON-encoded object, mirroring
  // devserveragent.Client.Exec's own generic map[string]any passthrough —
  // no per-method typed message, since this RPC's whole point is not
  // needing one per agent method. Empty means no params.
  string params_json = 3;
}

message RelayResponse {
  // result_json is the agent's JSON-RPC result, JSON-encoded verbatim.
  string result_json = 1;
}

message RelayStreamRequest {
  string connection_id = 1;
  string method = 2;
  string params_json = 3; // same JSON-encoded-object convention as RelayRequest.params_json
}

message RelayStreamFrame {
  // frame_json is one streamed JSON-RPC response frame's result,
  // JSON-encoded verbatim (e.g. git.execStream's
  // {type:'stream.chunk',line,source?} / {type:'stream.end',exitCode}) —
  // git-gateway-service's grpcclient adapter decodes this into a
  // domain.GitProgressLine, this RPC itself stays method-agnostic like Relay.
  string frame_json = 1;
}

message RelayByDevServerRequest {
  string dev_server_id = 1;
  string method = 2;
  // params_json — same convention as RelayRequest.params_json.
  string params_json = 3;
}

// StreamFileChangesRequest — exactly one of connection_id/dev_server_id is
// set, same convention as Relay/RelayByDevServer's twin addressing. path is
// an ABSOLUTE path on the target host (git-gateway-service resolves
// worktree_id -> repoPath before calling this, the same resolution every
// other files.* method already does — see RelayExecutor.relay's doc
// comment).
message StreamFileChangesRequest {
  string connection_id = 1;
  string dev_server_id = 2;
  string path = 3;
}

// FileChangeEvent mirrors frontend's FsChangeEvent shape (frontend/src/shared/types.ts)
// field-for-field so wscompat can forward it with no reshaping. Only kind
// and absolute_path are ever populated today — old_absolute_path/
// is_directory exist for shape parity but the agent's Node fs.watch-backed
// primitive (agent/src/relay/fs-agent-extensions.ts's handleFsWatch) has no
// rename-pair or directory-vs-file signal to fill them from; false/empty is
// the honest default, never fabricated (same precedent as
// InspectProcessResult.Known=false).
message FileChangeEvent {
  string kind = 1;              // "create" | "update" | "delete" | "rename" | "overflow"
  string absolute_path = 2;
  string old_absolute_path = 3; // always empty today, see doc comment above
  bool is_directory = 4;        // always false today, see doc comment above
}

message IsDevServerConnectedRequest {
  string dev_server_id = 1;
}

message IsDevServerConnectedResponse {
  bool connected = 1;
}

message CreateSshTargetRequest {
  string tenant_id = 1;
  string host = 2;
  string user = 3;
  string vault_ssh_role = 4; // Vault SSH secrets engine role for cert issuance
  int32 port = 5;                     // 0 = default to 22, mirrors domain.NewSshTarget
  string known_hosts_fingerprint = 6; // optional; "" = unverified (documented gap)
  string jump_host_target_id = 7;     // optional; "" = no jump host
}

