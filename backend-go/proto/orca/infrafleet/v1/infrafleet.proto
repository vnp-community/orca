message PtyClientFrame {
  oneof frame {
    AttachToSession attach = 1;  // first frame only: which pty_id this stream carries I/O for
    PtyInput        input  = 2;  // terminal.send
    PtyResize       resize = 3;  // low-latency in-stream resize (alternative to the unary RPC above)
  }
}
message AttachToSession { string pty_id = 1; }
message PtyInput  { bytes data = 1; }
message PtyResize { int32 cols = 1; int32 rows = 2; }

message PtyServerFrame {
  oneof frame {
    PtyOutput out    = 1;
    PtyExited exited = 2;
  }
}
message PtyOutput { bytes data = 1; }
message PtyExited { int32 exit_code = 1; }

message ScreencastClientFrame {
  oneof frame {
    StartScreencast start = 1;  // first frame only: what/how to capture
    StopScreencast  stop  = 2;
  }
}
// Field bounds mirror the OLD TS backend's clamp bounds exactly
// (orca-runtime-browser.ts's clampInteger/clampOptionalInteger/
// clampOptionalNumber calls) — both api-gateway's wscompat handler and
// the agent-side capture loop clamp to these same ranges, so behavior is
// byte-identical to the pre-backend-go implementation.
message StartScreencast {
  string worktree_id = 1;
  string page = 2;
  string format = 3;                     // "jpeg" | "png"
  int32 quality = 4;                     // clamp 10-100, default 70
  int32 max_width = 5;                   // clamp 320-3840, default 1440
  int32 max_height = 6;                  // clamp 240-2160, default 1200
  optional int32 viewport_width = 7;     // clamp 320-3840
  optional int32 viewport_height = 8;    // clamp 240-2160
  optional double device_scale_factor = 9; // clamp 1-4
  bool mobile = 10;
  int32 every_nth_frame = 11;            // clamp 1-10, default 2
  int32 min_frame_interval_ms = 12;      // clamp 0-1000, default 0
}
message StopScreencast {}

message ScreencastServerFrame {
  oneof frame {
    ScreencastReady ready = 1;
    ScreencastFrame frame_data = 2;
    ScreencastEnded ended = 3;
    ScreencastError error = 4;
  }
}
message ScreencastReady {
  string subscription_id = 1;
  string browser_page_id = 2;
  string format = 3;
}
message ScreencastFrame { bytes data = 1; } // opaque — see AttachScreencast's doc comment
message ScreencastEnded {}
message ScreencastError { string message = 1; }

message BrowserProfile {
  string id = 1;
  string tenant_id = 2;
  string dev_server_id = 3;
  string name = 4;
  string source_browser = 5; // e.g. "chrome", "firefox" — set by profileImportFromBrowser; empty if manually created
  bool is_default = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListBrowserProfilesRequest {
  string dev_server_id = 1; // required — a profile is dev-server-scoped, not tenant-wide
}
message ListBrowserProfilesResponse {
  repeated BrowserProfile profiles = 1;
}

message CreateBrowserProfileRequest {
  string dev_server_id = 1;
  string name = 2;
  string source_browser = 3; // optional
  bool is_default = 4;
}
message CreateBrowserProfileResponse {
  BrowserProfile profile = 1;
}

message DeleteBrowserProfileRequest {
  string id = 1;
}

// --- Emulator/simulator control (TASK-048) --------------------------------

message EmulatorDevice {
  string id = 1;
  string name = 2;
  string platform = 3; // "android" | "ios" — agent-reported, opaque passthrough
  string state = 4;    // e.g. "booted", "shutdown" — agent-reported, opaque passthrough
}

message ListEmulatorDevicesRequest {
  string connection_id = 1; // required — no backend-host fallback, see rpc doc comment
}
message ListEmulatorDevicesResponse {
  repeated EmulatorDevice devices = 1;
}

message GetEmulatorAvailabilityRequest {
  string connection_id = 1; // may be empty — see rpc doc comment
}
message GetEmulatorAvailabilityResponse {
  bool available = 1;
  string reason = 2; // populated when available is false
}

message EmulatorSession {
  string session_id = 1;
  string device_id = 2;
  string connection_id = 3; // which dev server this device runs on
  string platform = 4;      // "android" | "ios"
}

message AttachEmulatorSessionRequest {
  string connection_id = 1;
  string device_id = 2;
}

message SendEmulatorTapRequest {
  string connection_id = 1;
  string session_id = 2;
  int32 x = 3;
  int32 y = 4;
}

message SendEmulatorGestureRequest {
  string connection_id = 1;
  string session_id = 2;
  int32 start_x = 3;
  int32 start_y = 4;
  int32 end_x = 5;
  int32 end_y = 6;
  int32 duration_ms = 7;
}

message SendEmulatorButtonRequest {
  string connection_id = 1;
  string session_id = 2;
  string button = 3; // e.g. "home", "back", "volume_up" — agent-defined vocabulary
}

message RotateEmulatorRequest {
  string connection_id = 1;
  string session_id = 2;
  string orientation = 3; // "portrait" | "landscape"
}

message ShutdownEmulatorRequest {
  string connection_id = 1;
  string session_id = 2;
}

// --- Host capability probing (TASK-070) -----------------------------------

message GetHostCapabilitiesRequest {
  string connection_id = 1; // empty = caller's own backend-go host
}
message GetHostCapabilitiesResponse {
  bool wsl_available = 1;
  repeated string wsl_distros = 2;
  bool pwsh_available = 3;
  bool git_bash_available = 4;
}

// --- Fleet inventory import (BL-FLEET-01) ----------------------------------

message FleetServerInput {
  string host = 1;
  string user = 2;
  string vault_ssh_role = 3;
  string project = 4;
  repeated string tags = 5;
}

message ImportFleetInventoryRequest {
  repeated FleetServerInput servers = 1;
  bool dry_run = 2;
}
message ImportFleetInventoryError { string host = 1; string user = 2; string reason = 3; }
message ImportFleetInventoryResponse {
  int32 imported = 1;
  int32 updated = 2;
  int32 skipped = 3;
  repeated ImportFleetInventoryError errors = 4;
}

// --- Bulk fleet provisioning (BL-FLEET-02) ---------------------------------

message BulkProvisionFleetRequest {
  string project = 1; // "" = all
  int32 concurrency = 2; // 0 = default 5
}
message ProvisionOutcome { string dev_server_id = 1; string host = 2; string status = 3; string error = 4; }
message BulkProvisionFleetResponse {
  int32 success = 1; int32 failed = 2; int32 skipped = 3;
  repeated ProvisionOutcome outcomes = 4;
}

// --- Dev server onboarding: agent detection + remote preflight (BL-FLEET-04) ---

message AgentProbe {
  string id = 1;
  string cmd = 2;
  repeated string required_commands = 3;
  repeated string unsupported_runtimes = 4;
}
message DetectDevServerAgentsRequest {
  string dev_server_id = 1;
  repeated AgentProbe commands = 2;
}
message DetectDevServerAgentsResponse {
  repeated string agents = 1;
  string platform = 2;
}

message CheckDevServerPreflightRequest {
  string dev_server_id = 1;
  int32 probe_port = 2;
}
message CheckResult { bool installed = 1; string version = 2; bool meets_min = 3; }
message DiskCheckResult { double free_gb = 1; bool meets_min = 2; }
message PortCheckResult { int32 port = 1; bool available = 2; }
message CheckDevServerPreflightResponse {
  CheckResult git = 1;
  CheckResult node = 2;
  DiskCheckResult disk = 3;
  PortCheckResult port = 4;
  CheckResult gh = 5;
}

// --- Persistent agent tokens (BL-AWS-03) -----------------------------------

message CreateAgentTokenRequest  { string dev_server_id = 1; string name = 2; }
message CreateAgentTokenResponse {
  string id = 1;
  string token = 2; // plaintext — shown once, never returned again
  string name = 3;
  int64 created_at_unix_ms = 4;
}

message AgentTokenSummary {
  string id = 1;
  string name = 2;
  int64 created_at_unix_ms = 3;
  optional int64 last_used_at_unix_ms = 4;
}
message ListAgentTokensRequest  { string dev_server_id = 1; }
message ListAgentTokensResponse { repeated AgentTokenSummary tokens = 1; }

message RevokeAgentTokenRequest { string dev_server_id = 1; string id = 2; }

// --- Agent sessions (SOL-AG-01..05) ---------------------------------------

message StartAgentSessionRequest {
  string connection_id = 1;     // -> DevServer, same resolution as SpawnTerminalSession
  string worktree_id   = 2;     // logical FK -> project-service; BR-AG-01 scope key
  string user_id       = 3;     // BR-AG-01: one agent per worktree PER USER
  string cwd           = 4;     // worktree path on the dev server
  string model_id      = 5;     // e.g. "claude", "gpt-4o", "gemini", "opencode", "ollama"
  string account_id    = 6;     // ai_provider.accounts.id — from aiProvider.resolve; "" for localInference models
  string trust_preset  = 7;     // "standard" | "full" | "none" — forwarded as-is, applied agent-side as CLI args
  int32  cols          = 8;
  int32  rows          = 9;
  // resolved_api_key is DELIBERATELY ABSENT — see TASK-AG-01-04 (credential
  // injection blocker). Adding it here would let a caller populate
  // agent.spawn's resolvedApiKey param, silently reintroducing Gap 2.
}

message AgentSession {
  string id              = 1;   // sessionId — agent_sessions.id
  string pty_id          = 2;
  string connection_id   = 3;   // -> DevServer, same resolution key as TerminalSession.connection_id
  string worktree_id     = 4;
  string dev_server_id   = 5;   // snapshot of the dev server resolved at spawn time, for display only
  string user_id         = 6;
  string model_id        = 7;
  string account_id      = 8;
  string status          = 9;   // spawning|idle|running|waiting|completed|error|stopped — see TASK-AG-05-*
  int64  started_at_unix_ms      = 10;
  int64  last_active_at_unix_ms  = 11;
}

message StopAgentSessionRequest { string session_id = 1; }
message KillAgentSessionRequest {
  string session_id = 1;
  string signal      = 2; // "SIGTERM" | "SIGKILL", default SIGKILL — mirrors agent.kill's own default
}

message ResumeAgentSessionRequest {
  string connection_id = 1;
  string worktree_id   = 2;
  string user_id       = 3;
  string cwd           = 4;
  int32  cols          = 5;
  int32  rows          = 6;
}

message SwitchAgentAccountRequest {
  string connection_id = 1;
  string worktree_id   = 2;
  string user_id       = 3;
  string project_id    = 4; // threaded into ResolveProvider's cascade exclusion
  string cwd           = 5;
}

// --- Mobile prompt dispatch (SOL-MB-03) ------------------------------------

message DispatchPromptRequest {
  string pty_id = 1;
  string prompt = 2;          // already decrypted by the caller (api-gateway) before this RPC
  bool   overwrite = 3;       // BR-MB-12: true only on a caller's explicit confirmation of a second dispatch
  string dispatched_by_device_id = 4; // audit/attribution — which paired mobile device sent this
}
message DispatchPromptResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    INJECTED_IMMEDIATELY = 1;  // BR-MB-09: agent was idle/waiting, written straight to the PTY
    QUEUED = 2;                // BR-MB-10: agent running, held for later
    REJECTED_NEEDS_CONFIRMATION = 3; // BR-MB-12: a prompt is already queued and overwrite=false
  }
  Outcome outcome = 1;
  string  existing_queued_prompt_preview = 2; // populated only for REJECTED_NEEDS_CONFIRMATION
}

message GetQueuedPromptRequest { string pty_id = 1; }
message GetQueuedPromptResponse {
  bool   has_queued_prompt = 1;
  string prompt = 2;
  int64  queued_at_unix_ms = 3;
}
