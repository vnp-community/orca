syntax = "proto3";

package orca.automation.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "orca/workflow/v1/workflow.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/automation/v1;automationv1";

// AutomationService owns schedule/trigger definitions + run history. Execution
// always delegates to workflow-service.ExecuteAdHocStep (closes TS Gap 3 —
// automation.runNow had no working execution path in TS).
// See specs/backend-go/services/automation-service.md.
service AutomationService {
  rpc CreateAutomation(CreateAutomationRequest) returns (CreateAutomationResponse);
  rpc RunNow(RunNowRequest) returns (RunNowResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);

  // HandleExternalTrigger maps an external trigger source's payload onto the
  // same run interactor RunNow uses (trigger=external instead of manual) —
  // see design doc's TS external-automations-handler.ts note. request_id is
  // the external source's own idempotency key, reused as-is for
  // automation_runs' (tenant_id, request_id) unique index.
  rpc HandleExternalTrigger(HandleExternalTriggerRequest) returns (HandleExternalTriggerResponse);

  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (UpdateAutomationResponse);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (google.protobuf.Empty);

  // WriteCleanupReport records one row per worktree per cleanup run —
  // workflow-service.CleanupWorktreesStepExecutor calls this (a
  // workflow-service -> automation-service call, the reverse of this
  // service's usual direction) since automation-service already owns run
  // bookkeeping. See BR-AT-14.
  rpc WriteCleanupReport(WriteCleanupReportRequest) returns (google.protobuf.Empty);
}

message Automation {
  string id = 1;
  string tenant_id = 2;
  string project_id = 9; // NEW — logical FK -> project-service.projects; empty = unscoped (back-compat)
  string name = 3;
  string rrule = 4;
  // step_type/step_config_json (fields 5/6) are DEPRECATED but left on the
  // wire for one release: UpdateAutomation on a pre-migration row without
  // `actions` set still round-trips through them. New/updated automations
  // populate `actions` instead — see AutomationAction below.
  string step_config_json = 5 [deprecated = true];
  orca.workflow.v1.StepType step_type = 6 [deprecated = true];
  bool enabled = 7;
  string dtstart = 8; // RFC3339; empty = defaults to created_at at creation time
  string timezone = 10; // renumbered from 9 to make room for project_id above; IANA tz name (e.g. "Asia/Ho_Chi_Minh"); empty = UTC
  repeated AutomationAction actions = 11; // NEW — ordered chain, BR-AT-01's schema
  TriggerType trigger_type = 12;      // NEW
  string trigger_event = 13;          // NEW — one of the 5 event names below; empty unless trigger_type=EVENT
  string trigger_filter_json = 14;    // NEW — BR-AT-09, e.g. {"agent":"claude"}; empty = no filter (always matches)
}

enum TriggerType {
  TRIGGER_TYPE_UNSPECIFIED = 0; // = CRON, for back-compat with existing rrule-only rows
  TRIGGER_TYPE_CRON = 1;
  TRIGGER_TYPE_MANUAL = 2;      // rrule/dtstart still stored but next_run_at never advances — RunNow-only
  TRIGGER_TYPE_EVENT = 3;
}

// AutomationAction is one step in an automation's ordered action chain.
message AutomationAction {
  orca.workflow.v1.StepType step_type = 1;
  string step_config_json = 2;
  // on_failure controls whether RunNow's action loop continues to the next
  // action or stops the run. Default (unspecified) = STOP.
  OnFailurePolicy on_failure = 3;
}

enum OnFailurePolicy {
  ON_FAILURE_POLICY_UNSPECIFIED = 0; // = STOP
  ON_FAILURE_POLICY_STOP = 1;
  ON_FAILURE_POLICY_CONTINUE = 2;
}

message CreateAutomationRequest {
  string tenant_id = 1;
  string name = 2;
  string rrule = 3;
  string step_config_json = 4 [deprecated = true];
  orca.workflow.v1.StepType step_type = 5 [deprecated = true];
  string dtstart = 6; // optional; empty = defaults to now at creation time
  string timezone = 7; // optional; empty = UTC
  string project_id = 8; // NEW — logical FK -> project-service.projects; empty = unscoped (back-compat)
  repeated AutomationAction actions = 9; // NEW — ordered chain, BR-AT-01's schema
  TriggerType trigger_type = 10;      // NEW
  string trigger_event = 11;          // NEW
  string trigger_filter_json = 12;    // NEW
}

message CreateAutomationResponse {
  Automation automation = 1;
}

message RunNowRequest {
  string automation_id = 1;
  string request_id = 2; // idempotency, since scheduler ticks are at-least-once
}

message AutomationRun {
  string id = 1;
  string automation_id = 2;
  string status = 3; // running|completed|failed
}

message RunNowResponse {
  AutomationRun run = 1;
}

message ListRunsRequest {
  string automation_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListRunsResponse {
  repeated AutomationRun runs = 1;
  string next_page_token = 2;
}

message HandleExternalTriggerRequest {
  string automation_id = 1;
  string request_id = 2; // external source's idempotency key
  string payload_json = 3; // opaque external payload; passed through as-is, not interpreted here
}

message HandleExternalTriggerResponse {
  AutomationRun run = 1;
}

message ListAutomationsRequest {
  string tenant_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}
message ListAutomationsResponse {
  repeated Automation automations = 1;
  string next_page_token = 2;
}

// UpdateAutomationRequest uses optional (wrapper-typed) fields rather than
// full-replace semantics — a partial edit (e.g. just toggling `enabled`) is
// the frontend's real use case (an automation's on/off switch in the UI
// list), and full-replace would force every caller to re-send fields it
// isn't changing.
message UpdateAutomationRequest {
  string id = 1;
  string tenant_id = 2;
  google.protobuf.StringValue name = 3;
  google.protobuf.StringValue rrule = 4;
  google.protobuf.StringValue step_config_json = 5 [deprecated = true];
  orca.workflow.v1.StepType step_type = 6 [deprecated = true]; // 0 (unspecified) = no change
  google.protobuf.BoolValue enabled = 7;
  google.protobuf.StringValue dtstart = 8;
  google.protobuf.StringValue timezone = 9;
  google.protobuf.StringValue project_id = 10; // NEW
  repeated AutomationAction actions = 11; // NEW — empty = no change
  TriggerType trigger_type = 12; // NEW — 0 (unspecified) = no change
  google.protobuf.StringValue trigger_event = 13; // NEW
  google.protobuf.StringValue trigger_filter_json = 14; // NEW
}
message UpdateAutomationResponse {
  Automation automation = 1;
}

message DeleteAutomationRequest {
  string id = 1;
  string tenant_id = 2;
}

message WriteCleanupReportRequest {
  string run_id = 1;
  repeated CleanupLogEntry entries = 2;
}
message CleanupLogEntry {
  string worktree_id = 1;
  string action = 2; // "deleted" | "skipped" | "would_delete"
  string reason = 3;
}
