syntax = "proto3";

package orca.notification.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/notification/v1;notificationv1";

import "google/protobuf/empty.proto";

// NotificationService: push subscriptions + VAPID metadata + WS fan-out.
// Primary consumer of the async event bus. See specs/backend-go/services/notification-service.md.
service NotificationService {
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc UnregisterPushSubscription(UnregisterPushSubscriptionRequest) returns (google.protobuf.Empty);
  rpc GetVapidPublicKey(GetVapidPublicKeyRequest) returns (GetVapidPublicKeyResponse);
  // StreamNotifications is a server-streaming RPC api-gateway opens per
  // connected WS client and pipes frames from directly to the browser/mobile.
  rpc StreamNotifications(StreamNotificationsRequest) returns (stream NotificationServiceStreamNotificationsResponse);

  // ListNotifications/MarkAsRead/MarkAllAsRead/GetUnreadCount — CR-NOTIF-001,
  // the in-app Notification Center's list/unread-state surface. See
  // specs/backend-go/crs/v4/notification/solutions/BE-NOTIF-SOL-001.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (google.protobuf.Empty);
  rpc MarkAllAsRead(MarkAllAsReadRequest) returns (google.protobuf.Empty);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
}

message SubscribeRequest {
  string user_id = 1;
  string endpoint = 2;
  string p256dh_key = 3;
  string auth_key = 4;
  string channel = 5;       // "web" (default when empty) | "ios" | "android"
  string device_label = 6;  // optional, shown in the "Paired Devices" UI
}

message SubscribeResponse {
  string subscription_id = 1;
}

message UnregisterPushSubscriptionRequest {
  string endpoint = 1; // matches push_subscriptions.endpoint's unique index
}

message GetVapidPublicKeyRequest {}

message GetVapidPublicKeyResponse {
  string public_key = 1;
}

message StreamNotificationsRequest {
  string user_id = 1;
}

message NotificationServiceStreamNotificationsResponse {
  string id = 1;
  string type = 2; // e.g. task.completed, workflow.execution.failed
  string payload_json = 3;
}

message ListNotificationsRequest {
  string user_id = 1;      // resolved server-side from authenticated identity by api-gateway — never trust a client-supplied user_id for a DIFFERENT user
  string cursor = 2;       // opaque; empty = first page
  int32 limit = 3;
  bool unread_only = 4;
}

message Notification {
  string id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  string deep_link = 5;
  string severity = 6;
  bool is_read = 7;
  string created_at = 8; // RFC3339
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_cursor = 2; // empty when there is no next page
}

message MarkAsReadRequest {
  string user_id = 1;
  string notification_id = 2;
}

message MarkAllAsReadRequest {
  string user_id = 1;
}

message GetUnreadCountRequest {
  string user_id = 1;
}

message GetUnreadCountResponse {
  int64 count = 1;
}
