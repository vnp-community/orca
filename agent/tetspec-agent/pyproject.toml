[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdd-agent"
version = "0.1.0"
description = "Agent runtime for TDD generation, impact analysis, change-spec authoring and prompt editing on a shared knowledge graph"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "mcp>=2.3,<3",
  "uvicorn>=0.30",
  # tsagent (agent sinh test specs)
  "httpx>=0.27",
  "pyyaml>=6",
  "markdown-it-py>=3",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "httpx2", "ruff>=0.6"]

[project.scripts]
tdd-agent = "tdd_agent.cli:main"
tsagent = "tsagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tdd_agent = ["skills/**/*", "py.typed", "agents/testspec/*.yaml"]
tsagent = ["ontology/*.yaml", "store/*.sql", "store/migrations/*.sql", "gateway/*.sql", "schemas/*.json", "schemas/v2/*.json",
           "validate/*.json", "analyze/prompts/*.md", "design/prompts/*.md", "specify/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not llm_real'"
markers = [
    "unit: tsagent, kiểm một module",
    "integration: tsagent, nhiều module cùng DB tạm",
    "system: tsagent, end-to-end, bảo mật, so với v1",
    "contract: tsagent, hợp đồng MCP",
    "llm_real: gọi LLM thật (bỏ qua mặc định; chạy bằng -m llm_real)",
]
