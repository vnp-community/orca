version: 0.4.0
packages:
  doc: Tài liệu và tri thức
  req: Yêu cầu thượng nguồn
  struct: Cấu trúc hệ thống
  iface: Giao diện và truy cập
  data: Dữ liệu
  behav: Hành vi và logic nghiệp vụ
  qual: Chất lượng và quan sát
  sec: Bảo mật và rủi ro
  decis: Quyết định, giả định và phần còn mở
  const: Hằng số và cấu hình
  deliv: Triển khai và kiểm thử
  change: Thay đổi và tác động
  present: Trình bày và dựng lại
groups:
  DESIGN:
  - Module
  - Component
  - Job
  - Algorithm
  - Formula
  - DecisionTable
  - Interface
  - Operation
  - Message
  - Event
  - Entity
  - DataStore
  - Flow
  - StateMachine
  - Transition
  - Control
  - Policy
  - Screen
  - Trigger
  - Decision
  - ConfigItem
  CODE:
  - Module
  - Component
  - Job
  - Algorithm
  - Operation
  - Trigger
  UPSTREAM_REQ:
  - Requirement
  - QualityTarget
  - BusinessRule
  - Scenario
  - Milestone
  - Constraint
  POLICY:
  - Policy
  - RoutePolicy
  - RateLimitProfile
  - RetentionPolicy
classes:
  Element:
    package: null
    parent: null
    vi: Phần tử
    desc: 'Lớp gốc: mọi thứ trong kho tri thức.'
    own_props:
    - name: id
      type: str
      level: M
      note: Bất biến, duy nhất toàn kho
    - name: name
      type: str
      level: M
      note: Tên ngắn dùng trong văn bản
    - name: summary
      type: text
      level: O
      note: Một câu
    - name: owner_doc
      type: ref:Document
      level: M
      note: Tài liệu sở hữu duy nhất
    - name: origin
      type: enum:Origin
      level: M
      note: own, upstream, external
    - name: lifecycle
      type: enum:LifecycleStatus
      level: M
      note: ''
    - name: maturity
      type: enum:Maturity
      level: M
      note: Mức chín muồi của chính phần tử
    - name: priority
      type: enum:PriorityLevel
      level: C
      note: Bắt buộc với phần tử thiết kế và đầu việc, kế thừa từ kế hoạch
    - name: scope_status
      type: enum:ScopeStatus
      level: O
      note: in_scope (mặc định), deferred, out_of_scope
    - name: deferred_to
      type: ref:Milestone
      level: C
      note: Bắt buộc khi scope_status=deferred
    - name: source_ref
      type: list:SourceRef
      level: M
      note: Khối nguồn, vị trí, quote_hash
    - name: version_introduced
      type: str
      level: M
      note: ''
    - name: version_removed
      type: str
      level: O
      note: ''
    - name: confidence
      type: num
      level: M
      note: 0 đến 1; 1 với dữ liệu xác định hoặc đã duyệt
    - name: extracted_by
      type: enum:ExtractionMethod
      level: M
      note: ''
    - name: review_status
      type: enum:ReviewStatus
      level: M
      note: ''
    - name: reviewed_by
      type: str
      level: C
      note: Bắt buộc khi review_status=approved
    - name: reviewed_at
      type: date
      level: C
      note: ''
    - name: gaps
      type: list:Gap
      level: O
      note: Các khuyết có chủ đích hoặc đã phát hiện, xem mục 6
    - name: tags
      type: list:str
      level: O
      note: ''
    - name: ext
      type: json
      level: O
      note: Thuộc tính ngoài lược đồ, chờ đưa vào lớp
  Document:
    package: doc
    parent: Element
    vi: Tài liệu
    desc: Một tài liệu thuộc họ tài liệu của dự án.
    own_props:
    - name: doc_type
      type: enum:DocumentType
      level: M
      note: ''
    - name: version
      type: str
      level: M
      note: ''
    - name: profile
      type: str
      level: M
      note: Hồ sơ loại tài liệu
  DocumentVersion:
    package: doc
    parent: Element
    vi: Phiên bản tài liệu
    desc: Một phiên bản có băm nội dung.
    own_props:
    - name: content_hash
      type: str
      level: M
      note: ''
    - name: released_at
      type: date
      level: O
      note: ''
  Baseline:
    package: doc
    parent: Element
    vi: Đường cơ sở
    desc: Bộ phiên bản được ghim cùng nhau.
    own_props:
    - name: members
      type: list:ref:DocumentVersion
      level: M
      note: ''
    - name: signed_by
      type: str
      level: C
      note: ''
  Section:
    package: doc
    parent: Element
    vi: Mục
    desc: Mục của tài liệu.
    own_props:
    - name: number
      type: str
      level: M
      note: ''
    - name: title
      type: str
      level: M
      note: ''
  SourceBlock:
    package: doc
    parent: Element
    vi: Khối nguồn
    desc: Khối văn bản nhỏ nhất có neo.
    own_props:
    - name: kind
      type: enum:BlockKind
      level: M
      note: ''
    - name: line
      type: int
      level: M
      note: ''
    - name: text_hash
      type: str
      level: M
      note: ''
  Term:
    package: doc
    parent: Element
    vi: Thuật ngữ
    desc: Thuật ngữ miền hoặc kỹ thuật.
    own_props:
    - name: definition
      type: text
      level: M
      note: ''
    - name: synonyms
      type: list:str
      level: O
      note: ''
  Standard:
    package: doc
    parent: Element
    vi: Chuẩn
    desc: Tiêu chuẩn, RFC, quy ước bên ngoài.
    own_props:
    - name: identifier
      type: str
      level: M
      note: ''
    - name: edition
      type: str
      level: O
      note: ''
  Stakeholder:
    package: req
    parent: Element
    vi: Bên liên quan
    desc: Nhóm hoặc vai trò có lợi ích trong hệ thống.
    own_props:
    - name: concerns
      type: list:str
      level: O
      note: ''
  Concern:
    package: req
    parent: Element
    vi: Mối quan tâm
    desc: Mối quan tâm của bên liên quan (ISO/IEC/IEEE 42010).
    own_props: []
  Requirement:
    package: req
    parent: Element
    vi: Yêu cầu
    desc: Yêu cầu chức năng, phi chức năng, ràng buộc, giao diện hoặc dữ liệu.
    own_props:
    - name: req_kind
      type: enum:RequirementKind
      level: M
      note: ''
    - name: statement
      type: text
      level: M
      note: ''
    - name: acceptance
      type: text
      level: C
      note: Bắt buộc với yêu cầu ưu tiên P0
  BusinessRule:
    package: req
    parent: Element
    vi: Quy tắc nghiệp vụ
    desc: Quy tắc nghiệp vụ có cấu trúc điều kiện và kết quả (mục 7.1).
    own_props:
    - name: rule_form
      type: json
      level: C
      note: when, then, otherwise, exceptions; bắt buộc khi quy tắc đã chín muồi
    - name: precedence
      type: int
      level: O
      note: Thứ tự ưu tiên khi nhiều quy tắc cùng áp dụng
    - name: rule_kind
      type: enum:BusinessRuleKind
      level: O
      note: ''
    - name: severity
      type: enum:RuleLevel
      level: O
      note: Mức tác động khi vi phạm
  Scenario:
    package: req
    parent: Element
    vi: Kịch bản
    desc: Ca sử dụng hoặc kịch bản người dùng.
    own_props:
    - name: actors
      type: list:ref:Stakeholder
      level: M
      note: ''
    - name: main_flow
      type: ref:Flow
      level: O
      note: ''
    - name: end_conditions
      type: text
      level: O
      note: ''
  Milestone:
    package: req
    parent: Element
    vi: Mốc
    desc: Mốc giao hàng hoặc mục tiêu POC có tiêu chí đo.
    own_props:
    - name: criteria
      type: list:str
      level: M
      note: ''
    - name: target_date
      type: date
      level: O
      note: ''
  PriorityLevel:
    package: req
    parent: Element
    vi: Mức ưu tiên
    desc: Mức ưu tiên theo mục tiêu POC.
    own_props: []
  QualityCharacteristic:
    package: req
    parent: Element
    vi: Đặc tính chất lượng
    desc: Đặc tính theo ISO/IEC 25010.
    own_props: []
  System:
    package: struct
    parent: Element
    vi: Hệ thống
    desc: Hệ thống đang thiết kế.
    own_props: []
  Layer:
    package: struct
    parent: Element
    vi: Tầng
    desc: Tầng kiến trúc.
    own_props: []
  Module:
    package: struct
    parent: Element
    vi: Mô-đun
    desc: Mô-đun theo SAD; đơn vị sở hữu dữ liệu và ranh giới.
    own_props:
    - name: responsibility
      type: text
      level: M
      note: ''
    - name: runtime_unit
      type: str
      level: O
      note: ''
  Component:
    package: struct
    parent: Element
    vi: Thành phần
    desc: Thành phần cài đặt (dịch vụ, gói, bộ điều hợp, ứng dụng).
    own_props:
    - name: component_kind
      type: enum:ComponentKind
      level: M
      note: ''
    - name: responsibility
      type: text
      level: M
      note: ''
    - name: tech
      type: str
      level: C
      note: Bắt buộc khi component_kind là service, ui_app, worker
    - name: package
      type: str
      level: O
      note: Đường dẫn gói mã
    - name: stateless
      type: bool
      level: O
      note: ''
    - name: scaling_unit
      type: str
      level: O
      note: ''
    - name: runtime_unit
      type: str
      level: O
      note: ''
    - name: db_role
      type: ref:DbRole
      level: O
      note: ''
  DeploymentUnit:
    package: struct
    parent: Element
    vi: Đơn vị triển khai
    desc: Tệp nhị phân, ảnh, gói triển khai.
    own_props:
    - name: artifact
      type: str
      level: O
      note: ''
    - name: scaling
      type: str
      level: O
      note: ''
  Environment:
    package: struct
    parent: Element
    vi: Môi trường
    desc: Môi trường chạy (dev, staging, prod).
    own_props: []
  ExternalSystem:
    package: struct
    parent: Element
    vi: Hệ thống ngoài
    desc: Hệ thống không do dự án sở hữu.
    own_props:
    - name: contract
      type: str
      level: O
      note: ''
    - name: trust_level
      type: str
      level: O
      note: ''
  Dependency:
    package: struct
    parent: Element
    vi: Phụ thuộc ngoài
    desc: Thư viện hoặc dịch vụ bên thứ ba.
    own_props:
    - name: license
      type: str
      level: M
      note: ''
    - name: version
      type: str
      level: C
      note: Bắt buộc khi phụ thuộc là thư viện
    - name: approved
      type: bool
      level: O
      note: Thuộc danh mục công nghệ được duyệt
  Artefact:
    package: struct
    parent: Element
    vi: Tệp liên kết
    desc: OpenAPI, DDL, YAML, tài liệu ngoài.
    own_props:
    - name: path
      type: str
      level: M
      note: ''
    - name: format
      type: str
      level: O
      note: ''
    - name: artefact_kind
      type: enum:ArtefactKind
      level: O
      note: ''
  Screen:
    package: struct
    parent: Element
    vi: Màn hình
    desc: Màn hình hoặc luồng giao diện người dùng.
    own_props:
    - name: route
      type: str
      level: O
      note: ''
    - name: roles
      type: list:ref:Role
      level: O
      note: ''
  Interface:
    package: iface
    parent: Element
    vi: Giao diện
    desc: Điểm giao tiếp giữa các phần.
    own_props:
    - name: protocol
      type: enum:Protocol
      level: M
      note: ''
    - name: style
      type: str
      level: O
      note: ''
    - name: contract_ref
      type: ref:Artefact
      level: C
      note: Bắt buộc khi protocol là http hoặc grpc
    - name: authn
      type: str
      level: O
      note: ''
    - name: versioning
      type: str
      level: O
      note: ''
    - name: timeout
      type: qty
      level: O
      note: ''
  Operation:
    package: iface
    parent: Element
    vi: Thao tác
    desc: Thao tác của giao diện, ví dụ điểm cuối API.
    own_props:
    - name: method
      type: str
      level: C
      note: Bắt buộc với giao diện http
    - name: path_or_name
      type: str
      level: M
      note: ''
    - name: idempotent
      type: bool
      level: M
      note: ''
    - name: idempotency_key
      type: bool
      level: C
      note: Bắt buộc khi thao tác ghi và idempotent
    - name: concurrency_control
      type: enum:ConcurrencyControl
      level: C
      note: Bắt buộc với thao tác sửa
    - name: authn
      type: str
      level: O
      note: ''
    - name: timeout
      type: qty
      level: O
      note: ''
    - name: roles
      type: list:ref:Role
      level: O
      note: ''
    - name: sla_ref
      type: ref:Slo
      level: O
      note: ''
  Message:
    package: iface
    parent: Element
    vi: Thông điệp
    desc: Cấu trúc dữ liệu vào, ra hoặc sự kiện.
    own_props:
    - name: schema_ref
      type: ref:Artefact
      level: O
      note: ''
  Event:
    package: iface
    parent: Element
    vi: Sự kiện
    desc: Sự kiện miền hoặc tích hợp.
    own_props:
    - name: topic
      type: str
      level: M
      note: ''
    - name: channel
      type: enum:EventChannel
      level: M
      note: ''
    - name: delivery
      type: enum:DeliverySemantics
      level: M
      note: ''
    - name: ordering_key
      type: str
      level: O
      note: ''
    - name: payload
      type: ref:Message
      level: O
      note: ''
  ErrorCode:
    package: iface
    parent: Element
    vi: Mã lỗi
    desc: Mã lỗi nghiệp vụ hoặc kỹ thuật.
    own_props:
    - name: code
      type: str
      level: M
      note: ''
    - name: http_status
      type: int
      level: M
      note: ''
    - name: slug
      type: str
      level: O
      note: ''
    - name: retryable
      type: bool
      level: M
      note: ''
    - name: when
      type: text
      level: M
      note: Điều kiện phát sinh
    - name: handling
      type: text
      level: O
      note: ''
  Scope:
    package: iface
    parent: Element
    vi: Quyền
    desc: Scope của token hoặc quyền thao tác.
    own_props: []
  Role:
    package: iface
    parent: Element
    vi: Vai trò
    desc: Vai trò người dùng hoặc máy.
    own_props:
    - name: principal_type
      type: enum:PrincipalType
      level: O
      note: ''
  Credential:
    package: iface
    parent: Element
    vi: Thông tin xác thực
    desc: Token, cookie, khoá, bí mật và vòng đời của chúng.
    own_props:
    - name: credential_kind
      type: enum:CredentialKind
      level: M
      note: ''
    - name: storage
      type: str
      level: M
      note: ''
    - name: lifetime
      type: qty
      level: C
      note: Bắt buộc khi có hạn dùng
    - name: rotation
      type: text
      level: C
      note: ''
    - name: revocation
      type: text
      level: C
      note: ''
  Policy:
    package: iface
    parent: Element
    vi: Chính sách
    desc: Chính sách áp dụng cho thao tác, dữ liệu hoặc luồng.
    own_props: []
  RoutePolicy:
    package: iface
    parent: Policy
    vi: Chính sách định tuyến
    desc: Chính sách của một tuyến ở cổng vào.
    own_props:
    - name: upstream
      type: str
      level: M
      note: ''
    - name: auth
      type: str
      level: M
      note: ''
    - name: principals
      type: str
      level: O
      note: ''
    - name: rate_limit
      type: ref:RateLimitProfile
      level: M
      note: ''
    - name: timeout
      type: qty
      level: M
      note: ''
    - name: retry
      type: enum:RetryMode
      level: M
      note: ''
    - name: max_body
      type: qty
      level: M
      note: ''
  RateLimitProfile:
    package: iface
    parent: Policy
    vi: Hạn mức tần suất
    desc: Hồ sơ giới hạn tần suất.
    own_props:
    - name: limit
      type: qty
      level: M
      note: ''
    - name: key_by
      type: str
      level: M
      note: ip, principal, project
  RetentionPolicy:
    package: iface
    parent: Policy
    vi: Chính sách lưu giữ
    desc: Thời hạn lưu và cách xoá.
    own_props:
    - name: period
      type: qty
      level: M
      note: ''
    - name: action
      type: enum:RetentionAction
      level: M
      note: ''
    - name: legal_basis
      type: str
      level: O
      note: ''
  DataStore:
    package: data
    parent: Element
    vi: Kho dữ liệu
    desc: CSDL, hàng đợi, hệ lưu tệp.
    own_props:
    - name: technology
      type: str
      level: M
      note: ''
    - name: owner_module
      type: ref:Module
      level: O
      note: ''
  Schema:
    package: data
    parent: Element
    vi: Lược đồ CSDL
    desc: Không gian tên của bảng, sở hữu bởi một mô-đun.
    own_props:
    - name: owner_role
      type: ref:DbRole
      level: O
      note: ''
  Entity:
    package: data
    parent: Element
    vi: Thực thể
    desc: Thực thể nghiệp vụ hoặc bảng vật lý.
    own_props:
    - name: level
      type: enum:EntityLevel
      level: M
      note: logical hoặc physical
    - name: table_name
      type: str
      level: C
      note: Bắt buộc khi level=physical
    - name: store
      type: ref:DataStore
      level: C
      note: ''
    - name: pk
      type: str
      level: C
      note: Bắt buộc khi level=physical
    - name: soft_delete
      type: bool
      level: O
      note: ''
    - name: partition
      type: str
      level: O
      note: ''
    - name: data_class
      type: enum:DataClassVocab
      level: O
      note: ''
    - name: fillfactor
      type: int
      level: O
      note: ''
  Attribute:
    package: data
    parent: Element
    vi: Cột hoặc thuộc tính
    desc: Thuộc tính dữ liệu hoặc cột.
    own_props:
    - name: datatype
      type: str
      level: M
      note: ''
    - name: nullable
      type: bool
      level: M
      note: ''
    - name: default
      type: str
      level: O
      note: ''
    - name: enum_ref
      type: ref:Enumeration
      level: O
      note: ''
    - name: enum_values
      type: list:str
      level: O
      note: ''
    - name: unit
      type: str
      level: O
      note: ''
    - name: pii
      type: bool
      level: O
      note: ''
    - name: pk
      type: bool
      level: O
      note: ''
    - name: unique
      type: bool
      level: O
      note: ''
    - name: constraint
      type: expr
      level: O
      note: ''
  Index:
    package: data
    parent: Element
    vi: Chỉ mục
    desc: Chỉ mục của bảng.
    own_props:
    - name: columns
      type: list:str
      level: M
      note: ''
    - name: unique
      type: bool
      level: M
      note: ''
    - name: partial
      type: expr
      level: O
      note: ''
    - name: method
      type: str
      level: O
      note: ''
  View:
    package: data
    parent: Element
    vi: Khung nhìn
    desc: View hoặc view vật hoá.
    own_props:
    - name: definition
      type: expr
      level: O
      note: ''
    - name: materialized
      type: bool
      level: O
      note: ''
  Sequence:
    package: data
    parent: Element
    vi: Dãy số
    desc: Sequence của CSDL.
    own_props:
    - name: gap_allowed
      type: bool
      level: O
      note: ''
  Trigger:
    package: data
    parent: Element
    vi: Trigger CSDL
    desc: Trigger thi hành quy tắc ở tầng dữ liệu.
    own_props:
    - name: timing
      type: str
      level: M
      note: ''
    - name: enforces_text
      type: text
      level: O
      note: ''
  DbRole:
    package: data
    parent: Element
    vi: Vai trò CSDL
    desc: Vai trò truy cập CSDL.
