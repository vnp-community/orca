name: backend-go / credential-broker-service

# CR-DB-002/CR-DB-003 acceptance criteria, extended from usage-service's
# pilot workflow (backend-go-usage-service.yml) to credential-broker-service
# (batch 1 of the 15-service rollout — see
# specs/backend-go/crs/v4/multi-database/tasks/ROLLOUT-TRACKING.md): run
# credential-broker-service's migrations + integration tests on BOTH
# dialects (Postgres, MySQL) on every PR that touches it.
on:
  pull_request:
    paths:
      - "backend-go/common/**"
      - "backend-go/services/credential-broker-service/**"
      - "backend-go/go.work"
      - ".github/workflows/backend-go-credential-broker-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golang-migrate CLI (${{ matrix.dialect }} driver only)
        # golang-migrate/migrate's cmd/migrate gates each database driver
        # behind a build tag of the same name to keep the binary small —
        # same syntax confirmed for usage-service's identical CI step, see
        # that workflow's comment of the same name.
        run: |
          go install -tags '${{ matrix.dialect }}' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: go build
        working-directory: backend-go/services/credential-broker-service
        run: go build ./...
      - name: go vet
        working-directory: backend-go/services/credential-broker-service
        run: go vet ./...
      - name: Unit tests (no Docker)
        working-directory: backend-go/services/credential-broker-service
        run: go test ./...
      - name: Integration tests (${{ matrix.dialect }}, testcontainers)
        working-directory: backend-go/services/credential-broker-service
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            go test -tags=integration ./internal/adapter/postgres/... -v
          else
            go test -tags=integration ./internal/adapter/mysql/... -v
          fi
