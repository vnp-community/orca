name: backend-go / usage-service

# CR-DB-002/CR-DB-003 acceptance criteria: run usage-service's migrations +
# integration tests on BOTH dialects (Postgres, MySQL) on every PR that
# touches it. First backend-go CI workflow in this repo — none existed
# before (see backend-go/Makefile's opa-test target's own comment,
# confirmed by `ls .github/workflows/` having no backend-go-* file prior
# to this task) — scoped to usage-service only per
# specs/backend-go/crs/v4/multi-database/tasks/README.md's "Phạm vi".
on:
  pull_request:
    paths:
      - "backend-go/common/**"
      - "backend-go/services/usage-service/**"
      - "backend-go/go.work"
      - ".github/workflows/backend-go-usage-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golang-migrate CLI (${{ matrix.dialect }} driver only)
        # golang-migrate/migrate's cmd/migrate gates each database driver
        # behind a build tag of the same name to keep the binary small —
        # confirmed by installing single-tag binaries locally and running
        # them against real Postgres 16 and MySQL 8 containers before
        # locking this syntax in (not guessed from the module's README
        # alone).
        run: |
          go install -tags '${{ matrix.dialect }}' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: go build
        working-directory: backend-go/services/usage-service
        run: go build ./...
      - name: go vet
        working-directory: backend-go/services/usage-service
        run: go vet ./...
      - name: Unit tests (no Docker)
        working-directory: backend-go/services/usage-service
        run: go test ./...
      - name: Integration tests (${{ matrix.dialect }}, testcontainers)
        working-directory: backend-go/services/usage-service
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            go test -tags=integration ./internal/adapter/postgres/... -v
          else
            go test -tags=integration ./internal/adapter/mysql/... -v
          fi
