name: backend-go / request contracts

# TASK-E2E-029. Guards that no per-service workflow runs, each born from a bug that only showed in the e2e suite:
#  - check-agent-methods-called: every method a service relays to the agent exists in the agent (fs.checkPath was missing for weeks);
#  - check-grpc-dials: service-to-service gRPC goes through grpcmw.NewClient so tenant and user travel with the call;
#  - api-gateway contract tests: every RequestService RPC has a WS channel (clarification.* were missing) and the channel
#    inventory still matches the golden file the frontend reads;
#  - agent capability golden and the fake claude fixture used by orca-flows-e2e.
on:
  pull_request:
    paths:
      - "agent/src/relay/**"
      - "backend-go/common/**"
      - "backend-go/services/**"
      - "backend-go/proto/**"
      - "backend-go/ci/**"
      - "backend-go/Makefile"
      - "backend-go/go.work"
      - "tests/stages/e2e/orca-flows/**"
      - ".github/workflows/backend-go-request-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Backend methods exist in the agent
        working-directory: backend-go
        run: make check-agent-methods-called
      - name: No bare gRPC dials
        working-directory: backend-go
        run: make check-grpc-dials
      - name: Agent capability golden copies match
        working-directory: backend-go
        run: make check-agent-capability-golden

  gateway-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: grpcmw forwards tenant and user (common)
        working-directory: backend-go/common
        run: go test ./grpcmw/... -count=1
      - name: RequestService RPC to WS channel parity and channel inventory golden (api-gateway)
        working-directory: backend-go/services/api-gateway
        run: go test ./internal/adapter/wscompat/ -run 'TestRequestRPCChannelParity|TestChannelInventoryMatchesGolden' -count=1 -v

  fake-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fake claude self-test
        run: python3 -m unittest tests/stages/e2e/orca-flows/fake_claude_cli/test_fake_claude_cli.py
      - name: Fake claude answers pass request-service's real parsers and validators
        run: bash tests/stages/e2e/orca-flows/fake_claude_cli/verify-against-request-service.sh
