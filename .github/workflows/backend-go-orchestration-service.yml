name: backend-go / orchestration-service

# CR-DB-002/CR-DB-003 acceptance criteria: run orchestration-service's
# migrations + integration tests on BOTH dialects (Postgres, MySQL) on
# every PR that touches it — batch 2 of the 15-service multi-database
# rollout (specs/backend-go/crs/v4/multi-database/tasks/ROLLOUT-TRACKING.md),
# copying backend-go-usage-service.yml's structure unchanged (only
# path/service name differ), per that rollout's §"Pattern dùng lại nguyên
# vẹn".
on:
  pull_request:
    paths:
      - "backend-go/common/**"
      - "backend-go/services/orchestration-service/**"
      - "backend-go/go.work"
      - ".github/workflows/backend-go-orchestration-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golang-migrate CLI (${{ matrix.dialect }} driver only)
        run: |
          go install -tags '${{ matrix.dialect }}' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: go build
        working-directory: backend-go/services/orchestration-service
        run: go build ./...
      - name: go vet
        working-directory: backend-go/services/orchestration-service
        run: go vet ./...
      - name: Unit tests (no Docker)
        working-directory: backend-go/services/orchestration-service
        run: go test ./...
      - name: Integration tests (${{ matrix.dialect }}, testcontainers)
        working-directory: backend-go/services/orchestration-service
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            go test -tags=integration ./internal/adapter/postgres/... -v
          else
            go test -tags=integration ./internal/adapter/mysql/... -v
          fi
