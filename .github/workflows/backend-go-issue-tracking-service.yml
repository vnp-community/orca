name: backend-go / issue-tracking-service

# CR-DB-002/CR-DB-003 rollout (BE-DB-SOL-004/TASK-BE-DB-009): run
# issue-tracking-service's migrations + integration tests on BOTH dialects
# (Postgres, MySQL) on every PR that touches it — same shape as
# backend-go-usage-service.yml (the pilot's workflow), scoped to
# issue-tracking-service only.
on:
  pull_request:
    paths:
      - "backend-go/common/**"
      - "backend-go/services/issue-tracking-service/**"
      - "backend-go/go.work"
      - ".github/workflows/backend-go-issue-tracking-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golang-migrate CLI (${{ matrix.dialect }} driver only)
        run: |
          go install -tags '${{ matrix.dialect }}' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: go build
        working-directory: backend-go/services/issue-tracking-service
        run: go build ./...
      - name: go vet
        working-directory: backend-go/services/issue-tracking-service
        run: go vet ./...
      - name: Unit tests (no Docker)
        working-directory: backend-go/services/issue-tracking-service
        run: go test ./...
      - name: Integration tests (${{ matrix.dialect }}, testcontainers)
        working-directory: backend-go/services/issue-tracking-service
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            go test -tags=integration ./internal/adapter/postgres/... -v
          else
            go test -tags=integration ./internal/adapter/mysql/... -v
          fi
