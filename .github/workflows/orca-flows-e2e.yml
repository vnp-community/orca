name: orca-flows-e2e

# TASK-E2E-029. The cross-layer acceptance suite (tests/stages/e2e/orca-flows) on the real docker stack: gateway,
# request-service, workflow, task, the Dev Server Agent started on the runner, and the deterministic FAKE claude
# (--ai-stub) because CI has no Claude account. A green run proves wiring and contracts, never AI quality.
#
#   nightly  platform workflow request matrix exits ai plan   (Mon-Sat)
#   weekly   every suite, --strict, only MCP-01/02 may stay BLOCKED (Sun)
#
# Not yet a merge gate: it becomes one after five green nights in a row (see TASK-E2E-029). This workflow has not run
# on a hosted runner yet; the script it calls was only exercised in pieces on a developer machine.
on:
  schedule:
    - cron: "0 20 * * 1-6"
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly | weekly | custom"
        type: choice
        options: [nightly, weekly, custom]
        default: nightly
      custom_args:
        description: "custom mode only: arguments for run_acceptance.py, e.g. --ai-stub request ai"
        type: string
        default: "--ai-stub request ai plan"

permissions:
  contents: read
  issues: write # opens an issue when a scheduled run is red

concurrency:
  group: orca-flows-e2e
  cancel-in-progress: false

jobs:
  orca-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 20 * * 0' && 'weekly' || 'nightly') || inputs.mode }}
      CUSTOM_ARGS: ${{ inputs.custom_args }}
      ORCA_FLOWS_ARTIFACT_DIR: ${{ github.workspace }}/orca-flows-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The product is not involved: this checks the fake claude itself and that its answers still pass request-service's
      # real parsers, so a drifted prompt fails here with a clear message rather than as a vague e2e timeout.
      - name: Fake claude self-test
        run: python3 -m unittest tests/stages/e2e/orca-flows/fake_claude_cli/test_fake_claude_cli.py
      - name: Fake claude against request-service validators
        run: bash tests/stages/e2e/orca-flows/fake_claude_cli/verify-against-request-service.sh

      - name: Build the stack and run orca-flows (${{ env.MODE }}, fake claude)
        run: |
          mkdir -p "$ORCA_FLOWS_ARTIFACT_DIR"
          if [ "$MODE" = custom ]; then
            # shellcheck disable=SC2086 # custom_args is meant to be split into words
            bash tests/stages/e2e/orca-flows/ci/run-orca-flows-ci.sh custom -- $CUSTOM_ARGS
          else
            bash tests/stages/e2e/orca-flows/ci/run-orca-flows-ci.sh "$MODE"
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f "$ORCA_FLOWS_ARTIFACT_DIR/last-run.md" ]; then
            cat "$ORCA_FLOWS_ARTIFACT_DIR/last-run.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-flows-${{ env.MODE }}-${{ github.run_id }}
          path: orca-flows-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Open an issue when a scheduled run is red
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `orca-flows ${process.env.MODE} run is red`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              'AI answers in this run come from the fake claude, so the failure is in wiring, contracts or the stack, not in AI quality. ' +
              'Reports and service logs are in the run artifacts.';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
