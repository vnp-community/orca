name: backend-go / tenant-service

# CR-DB-002/CR-DB-003 acceptance criteria: run tenant-service's migrations +
# integration tests on BOTH dialects (Postgres, MySQL) on every PR that
# touches it. Copied from backend-go-usage-service.yml's structure (the
# multi-dialect pilot) per
# specs/backend-go/crs/v4/multi-database/tasks/ROLLOUT-TRACKING.md's batch
# 3+4+5 — only path/service name changed.
on:
  pull_request:
    paths:
      - "backend-go/common/**"
      - "backend-go/services/tenant-service/**"
      - "backend-go/go.work"
      - ".github/workflows/backend-go-tenant-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golang-migrate CLI (${{ matrix.dialect }} driver only)
        run: |
          go install -tags '${{ matrix.dialect }}' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: go build
        working-directory: backend-go/services/tenant-service
        run: go build ./...
      - name: go vet
        working-directory: backend-go/services/tenant-service
        run: go vet ./...
      - name: Unit tests (no Docker)
        working-directory: backend-go/services/tenant-service
        run: go test ./...
      - name: Integration tests (${{ matrix.dialect }}, testcontainers)
        working-directory: backend-go/services/tenant-service
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            go test -tags=integration ./internal/adapter/postgres/... -v
          else
            go test -tags=integration ./internal/adapter/mysql/... -v
          fi
