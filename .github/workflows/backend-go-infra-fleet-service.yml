name: backend-go / infra-fleet-service

# CR-DB-002/CR-DB-003 acceptance criteria: run infra-fleet-service's
# migrations + integration tests on BOTH dialects (Postgres, MySQL) on
# every PR that touches it. Copies usage-service's workflow structure
# (the multi-dialect pilot, .github/workflows/backend-go-usage-service.yml)
# verbatim, path/service name swapped — see
# specs/backend-go/crs/v4/multi-database/tasks/TASK-BE-DB-022-infra-fleet-service-mysql-rollout.md.
#
# infra-fleet-service is this rollout's LARGEST service (15 repository
# files, 62 migrations — see ROLLOUT-TRACKING.md's audit table) — ALL 62
# migrations (both dialects) are complete and verified against real
# Postgres/MySQL 8, and ALL 15 repository units have a MySQL adapter that
# compiles and passes `go vet`. Integration test coverage below is real but
# NOT exhaustive for every one of the ~130 methods across all 15 units — see
# BE-DB-SOL-017's "Kết quả thực tế" checklist table for the precise
# per-repository test-coverage state. `go test -tags=integration
# ./internal/adapter/mysql/...` below runs whatever exists today and will
# keep gating future PRs as coverage grows, same as any other service here.
on:
  pull_request:
    paths:
      - "backend-go/common/**"
      - "backend-go/services/infra-fleet-service/**"
      - "backend-go/go.work"
      - ".github/workflows/backend-go-infra-fleet-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golang-migrate CLI (${{ matrix.dialect }} driver only)
        run: |
          go install -tags '${{ matrix.dialect }}' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: go build
        working-directory: backend-go/services/infra-fleet-service
        run: go build ./...
      - name: go vet
        working-directory: backend-go/services/infra-fleet-service
        run: go vet ./...
      - name: Unit tests (no Docker)
        working-directory: backend-go/services/infra-fleet-service
        run: go test ./...
      - name: Integration tests (${{ matrix.dialect }}, testcontainers)
        working-directory: backend-go/services/infra-fleet-service
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            go test -tags=integration ./internal/adapter/postgres/... -v
          else
            go test -tags=integration ./internal/adapter/mysql/... -v
          fi
