# Orca Server — Production Docker Compose
#
# Usage:
#   docker compose -f deploy/prod/docker-compose.yml up -d
#   docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/.env up -d
#
# See .env.example for configurable variables.

services:
  orca-server:
    image: ${ORCA_IMAGE:-vnpblc/orca-server}:${ORCA_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
    container_name: orca-server
    restart: unless-stopped

    environment:
      - ORCA_PORT=6768
      - ORCA_HTTP_PORT=6769
      - ORCA_VERSION=${ORCA_VERSION:-0.0.0}
      - ORCA_USER_DATA_PATH=/data/orca
      - NODE_ENV=production

      # ── Multi-User & Authentication ──────────────────────────
      # Set ORCA_MULTI_USER=1 để enable login screen + per-user process isolation
      - ORCA_MULTI_USER=${ORCA_MULTI_USER:-0}
      # 'none' = PairCode only | 'local' = email+password | 'sso' = Phase 2
      - ORCA_AUTH_MODE=${ORCA_AUTH_MODE:-none}
      # Admin credentials (để trống → auto-generate + in ra stdout lần đầu boot)
      - ORCA_ADMIN_EMAIL=${ORCA_ADMIN_EMAIL:-}
      - ORCA_ADMIN_PASSWORD=${ORCA_ADMIN_PASSWORD:-}

      # ── Fleet Monitoring ─────────────────────────────────────
      # Bật để expose GET /metrics (Prometheus text format)
      - ORCA_FLEET_METRICS_ENABLED=${ORCA_FLEET_METRICS_ENABLED:-false}
      - ORCA_FLEET_ALERT_WEBHOOK_URL=${ORCA_FLEET_ALERT_WEBHOOK_URL:-}

      # ── Database (uncomment for non-SQLite backends) ─────────
      # - ORCA_DB_URL=mysql://orca_user:${DB_PASSWORD}@db:3306/orca_prod
      # - ORCA_DB_URL=postgresql://orca_user:${DB_PASSWORD}@db:5432/orca_prod
      # - ORCA_DB_URL=tidb://orca_user:${DB_PASSWORD}@tidb:4000/orca_prod


    volumes:
      # Persistent data: SQLite database, encryption keys, relay binaries
      # Multi-user mode: orca-data/users/<userId>/ created automatically per user
      - orca-data:/data/orca

    ports:
      # WebSocket/RPC port — frontend clients connect here
      - "${ORCA_RPC_PORT:-6768}:6768"
      # HTTP port — web UI static files served here
      - "${ORCA_WEB_PORT:-6769}:6769"

    networks:
      - orca-net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6769/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  orca-data:
    driver: local

networks:
  orca-net:
    driver: bridge
