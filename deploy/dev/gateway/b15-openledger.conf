# ══════════════════════════════════════════════════════════════════
# b15-openledger.conf
# Gateway Server : 103.67.184.32 (public) / 172.20.2.16 (internal)
# Domain         : b15.openledger.vn
# Orca Server    : 172.20.2.39
#   :6768  → WebSocket/RPC (Orca client pairing + runtime commands)
#   :6769  → HTTP (web UI static files + /health/*)
# Dev Server     : 172.20.2.31 (SSH target — fleet member)
#
# Traffic flow:
#   [Browser / Orca App]
#     → [Gateway 103.67.184.32:443 — vnp-proxy-nginx]
#       → [ws/*]      → 172.20.2.39:6768 (WebSocket RPC)
#       → [/ health]  → 172.20.2.39:6769 (HTTP static + health)
#
# Quản lý bởi: orca/deploy/dev/gateway/b15-openledger.conf
# ══════════════════════════════════════════════════════════════════

# ── Upstream: WS/RPC port (6768) ─────────────────────────────────
upstream orca_b15_ws {
    server 172.20.2.39:6768 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── Upstream: HTTP port (6769) — web UI + health endpoints ───────
upstream orca_b15_http {
    server 172.20.2.39:6769 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# ── HTTP → HTTPS Redirect + Certbot ACME Challenge ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name b15.openledger.vn;

    # Let's Encrypt ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b15.openledger.vn;

    # ── TLS / SSL (Let's Encrypt — managed by certbot) ───────────
    ssl_certificate      /etc/letsencrypt/live/b15.openledger.vn/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/b15.openledger.vn/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL_b15:10m;
    ssl_session_timeout  10m;

    # ── Security Headers ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN                                     always;
    add_header X-Content-Type-Options    nosniff                                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    client_max_body_size 50M;

    # ── Timeouts — Orca WebSocket session kéo dài nhiều giờ ─────
    proxy_connect_timeout  10s;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;

    # ── Common Proxy Headers ──────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ── Nginx health check (self) ─────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Orca health endpoints → HTTP port 6769 ───────────────────
    # /health, /health/ready, /health/metrics
    location ^~ /health {
        proxy_pass         http://orca_b15_http;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        access_log         off;
    }

    # ── WebSocket + Orca runtime protocol → WS port 6768 ─────────
    # Orca client kết nối WS để E2EE pairing + runtime RPC
    location ~ ^/(ws|runtime|api)(/|$) {
        proxy_pass         http://orca_b15_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Root WebSocket upgrade (Orca default connect path) ───────
    # Khi Orca client connect đến wss://b15.openledger.vn
    # (không prefix /ws/) → upgrade đến WS port 6768
    location = / {
        # Nếu là WebSocket upgrade → route đến WS port
        set $is_ws 0;
        if ($http_upgrade = "websocket") {
            set $is_ws 1;
        }

        # WebSocket: route đến port 6768
        proxy_pass         http://orca_b15_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_buffering off;
    }

    # ── Static assets (JS/CSS bundles) → HTTP port 6769 ──────────
    location ~* \.(js|css|woff2?|png|svg|ico|html|map)$ {
        proxy_pass         http://orca_b15_http;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;

        # Cache static assets 1 ngày
        proxy_cache_valid  200 1d;
        add_header         Cache-Control "public, max-age=86400";
        proxy_buffering    on;
    }

    # ── Web UI (SPA fallback) → HTTP port 6769 ───────────────────
    location / {
        proxy_pass         http://orca_b15_http;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_buffering off;
    }

    # ── Error pages ───────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ── Logs ──────────────────────────────────────────────────────
    access_log /var/log/nginx/b15-access.log combined;
    error_log  /var/log/nginx/b15-error.log  warn;
}
