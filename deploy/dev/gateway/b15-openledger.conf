# ══════════════════════════════════════════════════════════════════
# b15-openledger.conf
# Gateway Server : 172.20.2.16 | Public IP: 103.67.184.32
# Domain         : b15.openledger.vn
# Orca Server    : 172.20.2.39
#   :6768  → WebSocket/RPC  (E2EE pairing + runtime commands)
#   :6769  → HTTP           (Web UI static SPA + /health/*)
# Dev Server     : 172.20.2.31 (SSH fleet member — Orca SSHes vào đây)
#
# Traffic flow:
#   [Browser / Orca Desktop]
#     → [Gateway 103.67.184.32:443 — vnp-proxy-nginx]
#       WS upgrade (Orca pairing) → 172.20.2.39:6768
#       HTTP / web UI / health    → 172.20.2.39:6769
#         → [Orca Server container: 172.20.2.39]
#             SSH relay            → 172.20.2.31 (dev machine)
#
# Quản lý bởi: vnp-domain/proxy/conf.d/b15-openledger.conf
# Deploy: ./deploy.sh sync && ./deploy.sh reload
# ══════════════════════════════════════════════════════════════════

# ── Upstream: WebSocket/RPC port 6768 ────────────────────────────
# Dùng bởi: Orca Desktop pairing, web client E2EE WS connection
upstream orca_b15_ws {
    server 172.20.2.39:6768 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── Upstream: HTTP port 6769 ──────────────────────────────────────
# Dùng bởi: Web UI static SPA, /health/*, /assets/*
upstream orca_b15_http {
    server 172.20.2.39:6769 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# ── HTTP → HTTPS Redirect + Certbot ACME Challenge ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name b15.openledger.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b15.openledger.vn;

    # ── TLS / SSL (Let's Encrypt — managed by certbot) ───────────
    ssl_certificate      /etc/letsencrypt/live/b15.openledger.vn/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/b15.openledger.vn/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL_b15:10m;
    ssl_session_timeout  10m;

    # ── Security Headers ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN                                     always;
    add_header X-Content-Type-Options    nosniff                                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    client_max_body_size 50M;

    # ── Timeouts — Orca WebSocket session kéo dài nhiều giờ ─────
    proxy_connect_timeout  10s;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;

    # ── Common Proxy Headers ──────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ── Nginx self health check ───────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Orca health endpoints → HTTP port 6769 ───────────────────
    # /health, /health/ready, /health/metrics
    location ^~ /health {
        proxy_pass         http://orca_b15_http;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        access_log         off;
    }

    # ── Agent WebSocket → HTTP port 6769 (direct-websocket mode)
    location = /agent {
        proxy_pass         http://orca_b15_http;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
        proxy_cache         off;
        access_log /var/log/nginx/b15-agent-access.log combined;
    }

    # ── Browser Session WebSocket → HTTP port 6769 (WsSessionRouter) ─────
    # /ws path: Browser web mode dùng session cookie auth (không phải E2EE)
    # WsSessionRouter (port 6769) validate cookie và proxy đến per-user process.
    # Fix: BUG-PC-002 + Nginx routing fix (trước đây /ws bị route sai đến 6768)
    location = /ws {
        proxy_pass         http://orca_b15_http;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
        proxy_cache         off;
        access_log /var/log/nginx/b15-ws-session-access.log combined;
    }

    # ── RPC WebSocket / API → WS port 6768 (E2EE pairing + runtime) ──────
    # /runtime /api: Desktop client + E2EE pair code path (port 6768)
    # Note: /ws đã được handle riêng bên trên (đến port 6769)
    location ~ ^/(runtime|api)(/|$) {
        proxy_pass         http://orca_b15_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Root catch-all: WS → 6768, HTTP → 6769 ───────────────────
    # Orca Desktop connect trực tiếp: wss://b15.openledger.vn (no path prefix)
    # → nếu Upgrade: websocket → route đến WS port 6768
    # → nếu HTTP request (browser) → route đến HTTP port 6769 (web SPA)
    location / {
        set $upstream orca_b15_http;
        if ($http_upgrade = "websocket") {
            set $upstream orca_b15_ws;
        }

        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_buffering off;
    }

    # ── Error pages ───────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ── Logs ──────────────────────────────────────────────────────
    access_log /var/log/nginx/b15-access.log combined;
    error_log  /var/log/nginx/b15-error.log  warn;
}
