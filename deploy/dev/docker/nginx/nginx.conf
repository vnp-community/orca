# Nginx global config — tối ưu cho Orca WebSocket
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format combined '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time';

    access_log /var/log/nginx/access.log combined;

    # ── Performance ──────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip ─────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      application/wasm;

    # ── WebSocket upgrade map ─────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting (chống brute-force pairing) ────────────
    limit_req_zone $binary_remote_addr zone=orca_pair:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=orca_ws:10m   rate=20r/s;

    # ── Include site configs ─────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
