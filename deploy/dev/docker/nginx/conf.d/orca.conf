# ============================================================
# Nginx Config — Orca Server Reverse Proxy
# ============================================================
# Chức năng:
#   - HTTP → HTTPS redirect
#   - HTTPS → Orca WebSocket runtime (proxy_pass wss://)
#   - Serve Orca Web UI bundle (React SPA)
#   - WebSocket upgrade headers
# ============================================================

# ── HTTP: redirect all to HTTPS ─────────────────────────────
server {
    listen 80;
    server_name _;

    # Health check (cho Docker healthcheck, không cần HTTPS)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect mọi traffic khác sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Orca Web UI + WebSocket runtime ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── TLS ────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security Headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options            SAMEORIGIN                             always;
    add_header X-Content-Type-Options     nosniff                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"      always;

    # ── Timeouts ────────────────────────────────────────────
    # WebSocket sessions có thể kéo dài nhiều giờ
    proxy_connect_timeout  10s;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;

    # ── Upstream: Orca server (Docker service "orca") ──────
    # 6768 = WebSocket/RPC | 6769 = HTTP static + /health/*
    set $orca_ws   http://orca:6768;
    set $orca_http http://orca:6769;

    # ── Health check (expose health endpoints publicly) ─────
    # Proxied to HTTP port 6769 — no auth required (k8s probes)
    location /health {
        proxy_pass         $orca_http;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        access_log         off;
    }

    # ── Health check ───────────────────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── WebSocket upgrade (Orca runtime protocol) ──────────
    # Orca client (browser/app) kết nối WS tới đây
    location ~ ^/(ws|runtime|api)(/|$) {
        proxy_pass         $orca_ws;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Không buffer WebSocket frames
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Agent WebSocket endpoint (direct-websocket mode) ───
    # Agent (Python/Go/Node) trên dev server kết nối VÀO ĐÂY.
    # Orca server lắng nghe tại /agent (same port 6768).
    # Auth: agentToken trong agent.handshake RPC call.
    location /agent {
        proxy_pass         $orca_http;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connection: agent giữ WS mở trong suốt session
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
        proxy_cache         off;

        access_log /var/log/nginx/agent-access.log combined;
    }

    # ── Orca Web UI bundle + mọi request còn lại ───────────
    # Nếu là WebSocket upgrade → route tới RPC port 6768
    # Nếu là HTTP request thường → route tới static port 6769
    location / {
        # Why: Orca browser client kết nối WebSocket trực tiếp tới root (/)
        # Dùng $http_upgrade để phân biệt WS vs HTTP request.
        set $upstream $orca_http;
        if ($http_upgrade = "websocket") {
            set $upstream $orca_ws;
        }

        proxy_pass         $upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets (JS/CSS bundle)
        location ~* \.(js|css|woff2|png|svg|ico)$ {
            proxy_pass       $orca_http;
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        proxy_buffering off;
    }

    # ── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/orca-access.log combined;
    error_log  /var/log/nginx/orca-error.log  warn;
}
