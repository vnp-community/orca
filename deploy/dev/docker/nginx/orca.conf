# ============================================================
# Nginx config — frontend static SPA + reverse proxy to api-gateway
# ============================================================
# HTTP only. TLS termination for this dev-server deploy is expected to
# happen at a host-level reverse proxy/load balancer in front of this
# container (the same layering deploy/old/gateway/ used for the TS
# backend) — not duplicated here, since that's a per-environment concern
# independent of "how does the frontend container serve traffic."
# Bind-mounted read-only into a stock nginx:1.27-alpine — see
# docker-compose.yml's "frontend" service and ../README.md.
# ============================================================

server {
    listen 8080;
    server_name _;

    # 127.0.0.11 = Docker's embedded DNS server on any user-defined bridge
    # network (orca-go-net here). Required because proxy_pass below uses a
    # variable ($api_gateway) — nginx only does DYNAMIC (request-time) DNS
    # resolution for variable-based proxy_pass targets, and that requires an
    # explicit resolver; without one every proxied route 502s with "no
    # resolver defined" (found live — see docs/execution-plan.md).
    resolver 127.0.0.11 valid=10s;

    # Docker healthcheck target — no auth, no proxy hop.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # api-gateway is the single backend-go entry point (see
    # specs/backend-go/architecture/08-inter-service-communication.md) —
    # every REST/WS route the frontend calls goes through it, never
    # directly to an individual service.
    set $api_gateway http://api-gateway:8081;

    # /auth/* — plain HTTP (login/session/logout/config), all outside any
    # WS-upgrade handling. Matches specs/frontend/api/http-endpoints.md
    # exactly (paths auth-api-client.ts calls). A regex location (not N
    # separate `location =` blocks) since they share identical proxy config.
    # "callback" added alongside the original 4 for CR-LOGIN-001 (SSO) —
    # api-gateway's GET /auth/callback (the OAuth2/OIDC redirect target).
    # "refresh" was missing entirely (found live 2026-09-13: every POST
    # /auth/refresh fell through to the SPA fallback below, which 405s any
    # non-GET/HEAD method against a static file) — auth-api-client.ts's
    # refreshSession() POSTs here to rotate the session before it expires,
    # so a silent failure here eventually logs every session out.
    location ~ ^/auth/(local|me|logout|config|callback|refresh)$ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /auth/sso/{provider} — CR-LOGIN-001 SSO login start (github/google/
    # keycloak), a prefix (not exact) match since {provider} is a path
    # variable. `^~` so nginx stops checking regex locations once this
    # prefix wins (see nginx's location-matching precedence) — otherwise it
    # would incorrectly compete with the regex block above, which only
    # matches the fixed-name paths.
    location ^~ /auth/sso/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/trace-stream — SSE debug-trace stream (TracePanel,
    # Ctrl+Shift+T). Long-lived, unbuffered, matching /ws's timeout profile.
    location = /api/trace-stream {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # /ws — the legacy channel-based RPC WebSocket transport
    # (backend-go/services/api-gateway/internal/adapter/wscompat) the
    # deployed frontend/'s WebSocketRpcClient actually speaks. Auth is the
    # orca_session cookie, validated once at upgrade time inside the Go
    # handler, not here.
    location = /ws {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /v1/notifications/stream {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s; # notification streams are long-lived
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # /admin/api/* — api-gateway's admin console REST surface
    # (httpgateway/admin_routes.go). Same proxy shape as /v1/ above; kept
    # as its own block (not folded into /v1/, which it doesn't share a
    # prefix with) so route-specific config (e.g. a tighter rate limit)
    # can be added here later without touching /v1/'s.
    location /admin/api/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # POST/GET/DELETE /mcp — MCP Streamable HTTP endpoint (BE-MCP-SOL-002/003).
    # GET opens a long-lived SSE stream, so: no buffering/caching, a read
    # timeout far above the stream heartbeat, HTTP/1.1 keep-alive upstream.
    # Request headers are forwarded untouched (nginx's default) — the MCP
    # protocol depends on Mcp-Session-Id, MCP-Protocol-Version, Last-Event-ID,
    # Authorization and Origin reaching api-gateway, so NEVER add
    # proxy_hide_header / proxy_set_header overrides for them here
    # (ci/check-nginx-mcp-routing.sh enforces this). Auth is a bearer token
    # checked inside api-gateway; the session cookie is rejected there.
    location ^~ /mcp {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m; # matches MCP_MAX_REQUEST_BYTES default
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # RFC 9728 / RFC 8414 discovery documents (oauth-protected-resource,
    # oauth-authorization-server), public and unauthenticated by design.
    location ^~ /.well-known/oauth- {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # /oauth/consent is a FRONTEND page (the SPA renders the consent UI, then
    # calls mcp.consent.decide over /ws). It must NOT be proxied to
    # api-gateway, and it must not be frameable (clickjacking), cacheable, or
    # leak its query string via Referer. Exact matches beat the ^~ prefix
    # below. `always` keeps the headers on error responses too.
    location = /oauth/consent {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /web-index.html =404;
    }
    location = /oauth/consent/ {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /web-index.html =404;
    }

    # Every other /oauth/* path (authorize, token, register, revoke) is
    # served by api-gateway -> auth-service (BE-MCP-SOL-005/006).
    location ^~ /oauth/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA fallback — everything else serves the built frontend bundle.
    # NOTE: frontend/vite.config.ts's real entry points are web-index.html
    # (main SPA) and admin-index.html (admin console) — there is no plain
    # index.html in the build output. Admin console: /admin/ below.
    root /usr/share/nginx/html;
    index web-index.html;
    location /admin/ {
        try_files $uri $uri/ /admin-index.html;
    }
    location / {
        try_files $uri $uri/ /web-index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
