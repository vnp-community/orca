# ============================================================
# docker-compose.orca.yml — Chạy trên server Orca: 172.20.2.39
# ============================================================
#
# Kiến trúc 2-server:
#
#   [Internet] → b15.openledger.vn
#       ↓
#   [Gateway Server: 103.67.184.32 / 172.20.2.16]
#     Nginx container (port 80/443) → upstream tới 172.20.2.39:6768
#       ↓ (internal network 172.20.x.x)
#   [Orca Server: 172.20.2.39]
#     Orca container (port 6768 WS + port 6769 HTTP — chỉ listen trên internal interface)
#
#   [Developer Remote Machine: 172.20.2.31]
#     → Orca SSH vào đây để chạy code (SSH Target / Fleet Member)
#
# Deploy:
#   rsync source/ → ubuntu@172.20.2.39:~/orca-deploy/
#   docker compose -f docker-compose.orca.yml up -d --build
# ============================================================

services:

  # ----------------------------------------------------------
  # Postgres — shared database for main process + EVERY user-process
  # (ORCA_MULTI_USER=1 forks 1 process per authenticated user; without a
  # shared DB each fork gets its own isolated SQLite file — see
  # docs/guides/postgres-shared-database-design.md, BUG-BE-RPC-001/002/003).
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORCA_DB_USER:-orca}
      POSTGRES_PASSWORD: ${ORCA_DB_PASSWORD:?ORCA_DB_PASSWORD required — set in .env}
      POSTGRES_DB: ${ORCA_DB_NAME:-orca}
    volumes:
      - orca-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCA_DB_USER:-orca} -d ${ORCA_DB_NAME:-orca}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - orca-net

  # ----------------------------------------------------------
  # Orca Server — Node.js pure backend (server mode)
  # Expose port 6768 (WS) + 6769 (HTTP) ra internal interface (172.20.2.39)
  # KHÔNG expose ra public internet
  # ----------------------------------------------------------
  orca:
    build:
      context: ../../
      dockerfile: deploy/dev/docker/backend/Dockerfile
      # Why: frontend Vite build needs ~2-3GB RAM. Without shm-size, Docker
      # defaults to 64MB shared memory which causes build OOM crashes.
      shm_size: '2gb'
    image: vnpblc/orca-server:${ORCA_VERSION:-latest}
    container_name: orca-server
    restart: unless-stopped
    # Why: limit runtime memory so the container doesn't starve other services.
    # Build stage is NOT limited here (only runtime container gets deploy resources).
    deploy:
      resources:
        limits:
          memory: 1g

    environment:
      # Domain public mà người dùng truy cập (cho pairing URL)
      ORCA_DOMAIN: ${ORCA_DOMAIN:-b15.openledger.vn}
      ORCA_PORT: ${ORCA_PORT:-6768}
      ORCA_HTTP_PORT: ${ORCA_HTTP_PORT:-6769}
      ORCA_USER_DATA_PATH: /data/orca
      ORCA_VERSION: ${ORCA_VERSION:-0.0.0}
      # Explicit app root so getDaemonEntryPath() resolves correctly
      # (NodeAdapter.__dirname → out/server, not app root)
      ORCA_APP_PATH: /opt/orca/app
      NODE_ENV: production
      # Set ORCA_TRACE=1 in .env to enable structured trace logs (wsSession, agentWs, relay flows)
      ORCA_TRACE: ${ORCA_TRACE:-}
      # TEMP DIAG BUG-FE-PTY-001: set ORCA_SSH_MUX_DEBUG=1 in .env to log a full
      # stack trace on every SshChannelMultiplexer.dispose() call — pinpoints
      # what's actually closing the dev-01 agent WS connection.
      ORCA_SSH_MUX_DEBUG: ${ORCA_SSH_MUX_DEBUG:-}

      # ── Multi-User & Auth ─────────────────────────────────────
      # Set ORCA_MULTI_USER=1 để enable login + per-user process isolation
      ORCA_MULTI_USER: ${ORCA_MULTI_USER:-0}
      # 'none' = single-user (PairCode only) | 'local' = email+password login
      ORCA_AUTH_MODE: ${ORCA_AUTH_MODE:-none}
      # Admin credentials (chỉ dùng khi ORCA_MULTI_USER=1)
      # Nếu để trống → auto-generate + in ra stdout lần đầu boot
      ORCA_ADMIN_EMAIL: ${ORCA_ADMIN_EMAIL:-}
      ORCA_ADMIN_PASSWORD: ${ORCA_ADMIN_PASSWORD:-}

      # ── Fleet Monitoring ──────────────────────────────────────
      ORCA_FLEET_METRICS_ENABLED: ${ORCA_FLEET_METRICS_ENABLED:-false}
      ORCA_FLEET_ALERT_WEBHOOK_URL: ${ORCA_FLEET_ALERT_WEBHOOK_URL:-}

      # ── Security ──────────────────────────────────────────────
      # Master secret cho WebCredentialStore AES-256-GCM encryption
      ORCA_SERVER_SECRET: ${ORCA_SERVER_SECRET:-}
      # Secret để xác thực POST /api/agent-token (agents dùng để lấy token)
      ORCA_AGENT_API_SECRET: ${ORCA_AGENT_API_SECRET:-}

      # AI API Keys (shared hoặc để trống, developer set qua UI)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # Shared Postgres — see "postgres" service above. loadDatabaseConfig()
      # (backend/src/main/db/config-loader.ts) picks this up ahead of any
      # SQLite fallback; propagates automatically to every forked user-process
      # (SessionManager.spawnUserProcess() spreads ...process.env into the child).
      ORCA_DB_URL: postgresql://${ORCA_DB_USER:-orca}:${ORCA_DB_PASSWORD:?ORCA_DB_PASSWORD required — set in .env}@postgres:5432/${ORCA_DB_NAME:-orca}


    volumes:
      # Persistent data: SQLite database, encryption keys, relay binaries
      # Multi-user mode: orca-data/users/<userId>/ per user (auto-created)
      - orca-data:/data/orca
      # SSH key để Orca Server SSH vào các Dev Servers
      - ./docker/backend/ssh:/home/orca/.ssh:ro
      # Project repos
      - orca-projects:/srv/projects


    # Expose ra internal network — CHỈ bind vào interface nội bộ
    # Expose ra internal network — CHỈ bind vào interface nội bộ (Orca server: 172.20.2.39)
    # Gateway server (172.20.2.16) sẽ kết nối vào đây
    ports:
      - "172.20.2.39:${ORCA_PORT:-6768}:6768"
      - "172.20.2.39:${ORCA_HTTP_PORT:-6769}:6769"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ORCA_HTTP_PORT:-6769}/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - orca-net

# ----------------------------------------------------------
# Networks & Volumes
# ----------------------------------------------------------
networks:
  orca-net:
    driver: bridge

volumes:
  orca-data:
    driver: local
  orca-projects:
    driver: local
  orca-postgres-data:
    driver: local
