# Local-only overlay: runs a throwaway dev-mode Vault (in-memory, wiped on restart)
# instead of the shared vnp-domain Vault. Use with .env.local — see README "Fully local".
services:
  vault:
    image: hashicorp/vault:1.17
    container_name: orca-go-vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [orca-go-net]

  # Dev-mode Vault starts empty: enable the engines orca-policy.hcl documents as prerequisites.
  vault-init:
    image: hashicorp/vault:1.17
    container_name: orca-go-vault-init
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vault secrets enable transit || true
        vault secrets enable -path=credential-secrets kv-v2 || true
    restart: "no"
    networks: [orca-go-net]
