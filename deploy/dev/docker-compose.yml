    volumes: ["./bin/annotation-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/annotation?sslmode=disable", "up"]
  migrate-notification:
    <<: *migrate-defaults
    volumes: ["./bin/notification-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/notification?sslmode=disable", "up"]
  migrate-usage:
    <<: *migrate-defaults
    volumes: ["./bin/usage-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/usage?sslmode=disable", "up"]
  migrate-credential:
