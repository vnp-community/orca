# ============================================================
# docker-compose.yml — backend-go + frontend, MOUNT-based deploy
# ============================================================
# Flow this file implements (see scripts/build-local.sh + sync-to-server.sh):
#   (1) build binary locally  →  (2) rsync to server  →  (3) mount into container
#
# 16 of the 17 backend-go services, plus the frontend, run from PUBLIC,
# UNMODIFIED images — gcr.io/distroless/static-debian12 (~2MB, no shell, CA
# certs + tzdata only) for the Go services, nginx:1.27-alpine for the
# frontend. No Dockerfile is built for either: the compiled binary / built
# static assets are bind-mounted read-only into the stock image at a fixed
# path, per the explicit "mount into container, smallest possible image"
# requirement — there is no smaller image than "don't build a custom one at
# all." See ../README.md for the full rationale and the production caveats
# (no mTLS/service-mesh here — this is the same convenience-over-rigor
# tradeoff deploy/old made for the TS backend). Vault is NOT run locally by
# this file — see x-go-common-env's VAULT_ADDR/VAULT_TOKEN comment and
# ../VAULT-SHARED-MIGRATION.md.
#
# git-gateway-service is the one exception — see its own service block
# below and docker/git-gateway-runtime.Dockerfile for why it needs a real
# `git` binary and a writable volume that the shared distroless image and
# read_only:true convention can't provide.
#
# Service catalog / DB ownership: specs/backend-go/services/00-service-catalog.md
# ============================================================

name: orca-go

x-go-image: &go-image gcr.io/distroless/static-debian12:nonroot

# Env vars every backend-go container gets, regardless of whether that
# particular service reads all of them — harmless if unused, and avoids
# needing to track which of the 17 services' stub gRPC-client adapters
# picked which exact env var name (see docs/execution-plan.md Epic B/C —
# several of these addresses are still stub-only on the Go side; wiring
# the address here doesn't make the stub real, it just means "once that
# service's client stops being a stub, it already has the right address").
x-go-common-env: &go-common-env
  # Shared vnp-domain Vault (172.20.2.21) — see ../VAULT-SHARED-MIGRATION.md.
  # No insecure default token here (unlike the old dev-mode Vault's
  # ${VAULT_TOKEN:-dev-root-token}): an unset VAULT_TOKEN now fails loudly at
  # `docker compose up` instead of silently degrading to a well-known value.
  VAULT_ADDR: http://172.20.2.21:8200
  VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN required — the orca-scoped token from the shared Vault, see VAULT-SHARED-MIGRATION.md}
  NATS_URL: nats://nats:4222
  OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
  AUTH_SERVICE_ADDR: auth-service:9090
  TENANT_SERVICE_ADDR: tenant-service:9090
  PROJECT_SERVICE_ADDR: project-service:9090
  INFRA_FLEET_SERVICE_ADDR: infra-fleet-service:9090
  # infra-fleet-service's own HTTP listener, NOT the gRPC one above — only
  # api-gateway reads this (Config.InfraFleetHTTPAddr), to raw-proxy the Dev
  # Server Agent's /agent (WS) + /api/agent-token routes there (see
  # api-gateway/internal/adapter/httpgateway/agent_proxy_routes.go). Those
  # two routes are mounted on infra-fleet-service's HTTP_PORT alongside its
  # usual /healthz/readyz/metrics (infra-fleet-service/cmd/server/main.go),
  # so this is deliberately a second address distinct from the 9090 one.
  INFRA_FLEET_SERVICE_HTTP_ADDR: infra-fleet-service:8080
  GIT_GATEWAY_SERVICE_ADDR: git-gateway-service:9090
  SCM_INTEGRATION_SERVICE_ADDR: scm-integration-service:9090
  ISSUE_TRACKING_SERVICE_ADDR: issue-tracking-service:9090
  AI_PROVIDER_SERVICE_ADDR: ai-provider-service:9090
  WORKFLOW_SERVICE_ADDR: workflow-service:9090
  TASK_SERVICE_ADDR: task-service:9090
  ORCHESTRATION_SERVICE_ADDR: orchestration-service:9090
  AUTOMATION_SERVICE_ADDR: automation-service:9090
  ANNOTATION_SERVICE_ADDR: annotation-service:9090
  NOTIFICATION_SERVICE_ADDR: notification-service:9090
  USAGE_SERVICE_ADDR: usage-service:9090
  CREDENTIAL_BROKER_SERVICE_ADDR: credential-broker-service:9090
  CREDENTIAL_BROKER_ADDR: credential-broker-service:9090 # ai-provider-service's own (slightly differently-named) var — see docs/execution-plan.md

x-go-defaults: &go-defaults
  image: *go-image
  entrypoint: ["/app/bin/orca"]
  restart: unless-stopped
  read_only: true # the whole point of distroless + mounted binary: no writable image layer needed
  security_opt:
    - no-new-privileges:true
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"
  networks:
    - orca-go-net
  # mem_limit/mem_reservation: NONE of this file had any memory cap before
  # this pass — with 17 unconstrained Go services + Postgres + Vault + NATS
  # + frontend on one small VM, a single leaking/spiking service could (and
  # on 172.20.2.39, did) exhaust host RAM entirely and hang the box past
  # SSH/HTTP reachability, not just crash its own process. mem_limit turns
  # that into a contained, cgroup-level OOM-kill of the ONE offending
  # container — restart: unless-stopped above brings it back automatically
  # — instead of a host-wide freeze. 128m is generous for these: small,
  # single-purpose gRPC services, no in-process caches of consequence.
  # Bumped explicitly below for the two services with real reason to need
  # more (git-gateway-service, api-gateway). Classic (non-swarm) compose
  # keys — honored by plain `docker compose up -d`, no swarm mode needed.
  mem_limit: 128m
  mem_reservation: 64m

x-migrate-defaults: &migrate-defaults
  image: migrate/migrate:v4.17.0
  profiles: ["migrate"] # never starts on a plain `docker compose up` — see scripts/migrate.sh
  networks:
    - orca-go-net
  depends_on:
    postgres:
      condition: service_healthy
  # Short-lived one-shot migration runners — minimal footprint, never
  # accumulate load.
  mem_limit: 64m

services:
  # ------------------------------------------------------------
  # Infra: Postgres (database-per-service, one instance/many DBs for this
  # dev-server deploy — see specs/backend-go/architecture/05-data-architecture.md
  # on when physical instance-per-service is warranted instead), NATS
  # JetStream. Vault is external/shared (172.20.2.21) — see
  # x-go-common-env above and ../VAULT-SHARED-MIGRATION.md, not a service
  # defined in this file.
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orca-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set in .env}
      POSTGRES_DB: postgres
    volumes:
      - orca-go-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    networks:
      - orca-go-net
    # See x-go-defaults' doc comment above (root cause of the
    # 172.20.2.39 host-wide hang this pass fixes) — Postgres is the one
    # service here that genuinely needs real headroom (shared_buffers,
    # per-connection work_mem across 17 services' pools), so it gets more
    # than the Go services, still capped rather than unlimited.
    mem_limit: 512m
    mem_reservation: 256m

  # Vault: NOT a local service in this file anymore (2026-09-07) — orca now
  # points at the shared, persistent vnp-domain Vault (172.20.2.21) instead
  # of running its own throwaway dev-mode instance. The dev-mode Vault this
  # file used to define here lost all data on every host reboot (real
  # incident, 2026-09-06 — auth-service/credential-broker-service crash-
  # looped until manual `vault-init` recovery), which the shared Vault's
  # real `file` storage backend doesn't have. See
  # ../VAULT-SHARED-MIGRATION.md for the full migration record and
  # ../orca-policy.hcl for exactly what's granted. VAULT_ADDR/VAULT_TOKEN
  # below (x-go-common-env) now point at that shared instance directly —
  # no local `vault`/`vault-init` service, no `depends_on: vault` needed.

  nats:
    image: nats:2.10-alpine
    container_name: orca-go-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"] # -m enables the HTTP monitoring endpoint the healthcheck below needs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    networks:
      - orca-go-net
    mem_limit: 128m

  # ------------------------------------------------------------
  # backend-go services — 15 own a database (bind-mount ./bin/<svc>/orca +
  # DATABASE_DSN), 2 don't (git-gateway, api-gateway — see
  # specs/backend-go/services/00-service-catalog.md).
  # Every container: same public distroless image, no build step, binary
  # bind-mounted read-only at /app/bin/orca.
  # ------------------------------------------------------------

  auth-service:
    <<: *go-defaults
    container_name: orca-go-auth
    volumes:
      - ./bin/auth-service/orca:/app/bin/orca:ro
      # OPA bundle for requireAdminActor's embedded evaluator — see
      # specs/backend-go/bugs/missing-v2/BUG-003/SOL-003/TASK-006. Mounted
      # at the same absolute path config.go's OPABundlePath now defaults
      # to, so no OPA_BUNDLE_PATH override is needed here.
      #
      # Source is relative ("./policy/..."), not "../../backend-go/policy/..."
      # — the latter assumed a full monorepo checkout on the server, but
      # sync-to-server.sh only ships this directory's own tree. That mismatch
      # meant every admin-actor check failed closed for every caller
      # regardless of role (Docker silently bind-mounts an empty directory
      # for a missing host path instead of erroring) — live-verified
      # 2026-08-29. build-local.sh now copies backend-go/policy/orca-authz/
      # into deploy/dev/policy/ on every build so this path is always real.
      - ./policy/orca-authz:/policy/orca-authz:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
      # First-boot admin bootstrap (internal/usecase/bootstrap.go) — no-op
      # once any user exists; leave BOOTSTRAP_ADMIN_PASSWORD unset to
      # auto-generate + log it once instead of setting it here.
      # BOOTSTRAP_COMPANY_NAME (optional) replaces the old BOOTSTRAP_TENANT_ID
      # — tenant-service now originates the tenant id itself via a
      # CreateCompany call bootstrap.go makes at startup; see
      # specs/backend-go/bugs/missing-v2/BUG-002/SOL-002/TASK-003. An
      # operator-supplied BOOTSTRAP_TENANT_ID here would no longer do
      # anything (the field was removed from BootstrapConfig).
      BOOTSTRAP_COMPANY_NAME: ${BOOTSTRAP_COMPANY_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # CR-LOGIN-001 SSO (internal/adapter/oauth, internal/adapter/oauthstate)
      # — see .env.example's "SSO" section. Every var here defaults to
      # empty: an unset SSO_*_CLIENT_ID means that provider is simply
      # absent from the SsoExchangerRegistry (StartSsoLogin surfaces
      # AUTH_SSO_PROVIDER_UNSUPPORTED for it), so leaving this whole block
      # unset is a no-op — local-password login is unaffected either way.
      SSO_STATE_SECRET: ${SSO_STATE_SECRET:-}
      SSO_GITHUB_CLIENT_ID: ${SSO_GITHUB_CLIENT_ID:-}
      SSO_GITHUB_CLIENT_SECRET: ${SSO_GITHUB_CLIENT_SECRET:-}
      SSO_GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_GOOGLE_CLIENT_SECRET: ${SSO_GOOGLE_CLIENT_SECRET:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_DISCOVERY_URL: ${SSO_OIDC_DISCOVERY_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
      tenant-service: { condition: service_started } # bootstrap.go now calls tenant-service.CreateCompany at startup

  tenant-service:
    <<: *go-defaults
    container_name: orca-go-tenant
    volumes:
      - ./bin/tenant-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/tenant?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  project-service:
    <<: *go-defaults
    container_name: orca-go-project
    volumes:
      - ./bin/project-service/orca:/app/bin/orca:ro
      # See auth-service's identical mount above — BUG-003/SOL-003/TASK-006.
      - ./policy/orca-authz:/policy/orca-authz:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/project?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      workflow-service: { condition: service_started }
      task-service: { condition: service_started }

  infra-fleet-service:
    <<: *go-defaults
    container_name: orca-go-infra-fleet
    volumes:
      - ./bin/infra-fleet-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/infra?sslmode=disable
      # Gates POST/GET /api/agent-token (proxied in from api-gateway, see
      # INFRA_FLEET_SERVICE_HTTP_ADDR above) — must match deploy/agent/.env's
      # ORCA_AGENT_API_SECRET on every Dev Server Agent, or token issuance
      # fail-secure-rejects every request (agentwsserver's own startup log
      # warns loudly when this is empty).
      ORCA_AGENT_API_SECRET: ${ORCA_AGENT_API_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }

  ai-provider-service:
    <<: *go-defaults
    container_name: orca-go-ai-provider
    volumes:
      - ./bin/ai-provider-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/aiprovider?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      credential-broker-service: { condition: service_started }

  workflow-service:
    <<: *go-defaults
    container_name: orca-go-workflow
    volumes:
      - ./bin/workflow-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/workflow?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      infra-fleet-service: { condition: service_started }

  task-service:
    <<: *go-defaults
    container_name: orca-go-task
    volumes:
      - ./bin/task-service/orca:/app/bin/orca:ro
      # See auth-service's identical mount above — BUG-003/SOL-003/TASK-006.
      - ./policy/orca-authz:/policy/orca-authz:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/task?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      tenant-service: { condition: service_started }

  orchestration-service:
    <<: *go-defaults
    container_name: orca-go-orchestration
    volumes:
      - ./bin/orchestration-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/orchestration?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  automation-service:
    <<: *go-defaults
    container_name: orca-go-automation
    volumes:
      - ./bin/automation-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/automation?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      workflow-service: { condition: service_started } # real gRPC client — see docs/execution-plan.md

  annotation-service:
    <<: *go-defaults
    container_name: orca-go-annotation
    volumes:
      - ./bin/annotation-service/orca:/app/bin/orca:ro
      # See auth-service's identical mount above — BUG-003/SOL-003/TASK-006.
      - ./policy/orca-authz:/policy/orca-authz:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/annotation?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  notification-service:
    <<: *go-defaults
    container_name: orca-go-notification
    volumes:
      - ./bin/notification-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/notification?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      # VAPID Transit signing now goes through credential-broker-service's
      # SignVapidPayload RPC (Epic B, docs/execution-plan.md §8) — this
      # service no longer talks to Vault directly, so the vault dependency
      # this block used to carry is gone, replaced by the real one.
      credential-broker-service: { condition: service_started }
      nats: { condition: service_healthy }

  usage-service:
    <<: *go-defaults
    container_name: orca-go-usage
    volumes:
      - ./bin/usage-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/usage?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  credential-broker-service:
    <<: *go-defaults
    container_name: orca-go-credential-broker
    volumes:
      - ./bin/credential-broker-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/credential?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  # 2 services with no database:
  #
  # git-gateway-service is the one exception to every other service's
  # "shared, unmodified distroless image, no writes anywhere" shape — its
  # host-local dispatch path (internal/adapter/localgit) needs a real `git`
  # binary AND somewhere writable to run it against (git-gateway-runtime.
  # Dockerfile installs the former; the read_only override + repos volume
  # below provide the latter). Per specs/backend-go/tdd/services/
  # git-gateway-service.md §2, host-local exec is "retained for local/dev
  # deployments" — this dev deploy IS that case, not a hypothetical.
  #
  # git-gateway-repos is where any repo NOT bound to a remote dev server
  # (Project.dev_server_id empty — e.g. a repo added via the sidebar's bare
  # "Add Project"/repo.add, which has no dev-server-selection step) actually
  # lives on disk for git-gateway-service's local git/worktree operations
  # to succeed against. This is a new convention, not one the codebase
  # already had anywhere (checked: no existing volume/path convention for
  # git-gateway-service's local storage) — /data/repos was picked as a
  # clear, generic root; it is NOT retroactive for any repo whose url/path
  # already points elsewhere (e.g. a stale /opt/repos/<name> row from
  # before this volume existed), which still needs re-adding under this
  # root (or its own dev-server binding) to actually work.
  git-gateway-service:
    <<: *go-defaults
    image: orca-git-gateway-runtime:${ORCA_GO_VERSION:-dev}
    container_name: orca-go-git-gateway
    read_only: false # see comment above — this service alone needs to write real git/worktree data
    # Overrides go-defaults' 128m: real git clone/checkout/worktree-add
    # operations on caller repos of unbounded size — the one Go service
    # here with a genuine reason to need more than a stateless gRPC
    # handler.
    mem_limit: 384m
    mem_reservation: 128m
    volumes:
      - ./bin/git-gateway-service/orca:/app/bin/orca:ro
      - git-gateway-repos:/data/repos
    environment: *go-common-env
    depends_on:
      infra-fleet-service: { condition: service_started }
      project-service: { condition: service_started }
      # ai-provider-service: DiscoverCommitMessageModels (TASK-211) dials it
      # directly. grpc.NewClient is lazy (non-blocking), so this is
      # startup-ordering hygiene, not a hard requirement.
      ai-provider-service: { condition: service_started }

  scm-integration-service:
    <<: *go-defaults
    container_name: orca-go-scm-integration
    volumes:
      - ./bin/scm-integration-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      # Owns scm.rate_limit_cache/webhook_delivery_log as of Phase 3
      # (docs/execution-plan.md §3) — see cmd/server/main.go's doc comment.
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/scm?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      credential-broker-service: { condition: service_started }

  issue-tracking-service:
    <<: *go-defaults
    container_name: orca-go-issue-tracking
    volumes:
      - ./bin/issue-tracking-service/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      # Epic G (docs/execution-plan.md): outbox-only database, not a
      # queryable copy of issue data — see that service's
      # internal/adapter/postgres package doc comment.
      DATABASE_DSN: postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/issuetracking?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      credential-broker-service: { condition: service_started }
      nats: { condition: service_healthy }

  api-gateway:
    <<: *go-defaults
    container_name: orca-go-api-gateway
    read_only: false # writes nothing itself, but see README — kept false pending confirmation it needs no writable path; flip to true once verified
    # Overrides go-defaults' 128m: fans out every browser session's
    # WebSocket (wscompat) connections through this single process —
    # more concurrent connection state than a typical backend service here.
    mem_limit: 192m
    mem_reservation: 96m
    volumes:
      - ./bin/api-gateway/orca:/app/bin/orca:ro
    environment:
      <<: *go-common-env
      PUBLIC_PORT: "8081"
      # CR-LOGIN-001 SSO (internal/adapter/httpgateway/auth_routes.go) —
      # see .env.example's "SSO" section. PUBLIC_BASE_URL is REQUIRED for
      # SSO to work at all: GET /auth/sso/{provider} builds redirect_uri as
      # exactly "${PUBLIC_BASE_URL}/auth/callback", deliberately never
      # derived from the request's Host header (see that handler's doc
      # comment on the Host-header-injection risk this avoids) — it must
      # match, byte-for-byte, whatever redirect URI is registered with each
      # configured IdP. Left empty, GET /auth/sso/{provider} degrades to a
      # 501 (same as before this feature existed) and /auth/config never
      # advertises any provider, regardless of AUTH_MODE or the client ids
      # below — local-password login is unaffected.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      AUTH_MODE: ${AUTH_MODE:-both}
      # Client IDs only (never secrets — those stay auth-service-only, see
      # SsoRouteConfig's doc comment) — gate which providers GET
      # /auth/config advertises to the login page. Must match the
      # SSO_*_CLIENT_ID values set on auth-service above.
      SSO_GITHUB_CLIENT_ID: ${SSO_GITHUB_CLIENT_ID:-}
      SSO_GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
    ports:
      # SERVER_BIND_IP lets a specific deploy reuse a specific host port/IP
      # (e.g. to slot into an existing external gateway's hardcoded upstream
      # — see ../README.md's "Reusing the old TS backend's ports" section)
      # instead of always publishing on every interface.
      - "${SERVER_BIND_IP:-0.0.0.0}:${API_GATEWAY_PUBLIC_PORT:-8081}:8081"
    depends_on:
      usage-service: { condition: service_started }
      notification-service: { condition: service_started }
      auth-service: { condition: service_started }

  # ------------------------------------------------------------
  # Frontend — stock nginx:alpine, built static assets bind-mounted
  # read-only, config bind-mounted read-only. No custom image.
  # ------------------------------------------------------------
  frontend:
    image: nginx:1.27-alpine
    container_name: orca-go-frontend
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx/orca.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SERVER_BIND_IP:-0.0.0.0}:${FRONTEND_HTTP_PORT:-8080}:8080"
    depends_on:
      - api-gateway
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    networks:
      - orca-go-net
    mem_limit: 64m # static assets only, no app logic

  # ------------------------------------------------------------
  # Migrations — one-shot per DB-owning service, `profiles: [migrate]` so
  # `docker compose up` never runs these; invoked explicitly by
  # scripts/migrate.sh (called from sync-to-server.sh before `up -d`).
  # Official migrate/migrate image (small, purpose-built) — not the
  # distroless-static services above, which have no shell for this kind of
  # one-shot tooling anyway.
  # ------------------------------------------------------------
  migrate-auth:
    <<: *migrate-defaults
    volumes: ["./bin/auth-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable", "up"]
  migrate-tenant:
    <<: *migrate-defaults
    volumes: ["./bin/tenant-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/tenant?sslmode=disable", "up"]
  migrate-project:
    <<: *migrate-defaults
    volumes: ["./bin/project-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/project?sslmode=disable", "up"]
  migrate-infra:
    <<: *migrate-defaults
    volumes: ["./bin/infra-fleet-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/infra?sslmode=disable", "up"]
  migrate-aiprovider:
    <<: *migrate-defaults
    volumes: ["./bin/ai-provider-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/aiprovider?sslmode=disable", "up"]
  migrate-workflow:
    <<: *migrate-defaults
    volumes: ["./bin/workflow-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/workflow?sslmode=disable", "up"]
  migrate-task:
    <<: *migrate-defaults
    volumes: ["./bin/task-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/task?sslmode=disable", "up"]
  migrate-orchestration:
    <<: *migrate-defaults
    volumes: ["./bin/orchestration-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/orchestration?sslmode=disable", "up"]
  migrate-automation:
    <<: *migrate-defaults
    volumes: ["./bin/automation-service/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgresql://orca:${POSTGRES_PASSWORD}@postgres:5432/automation?sslmode=disable", "up"]
  migrate-annotation:
