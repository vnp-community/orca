# ============================================================
# docker-compose.orca.artifact.yml — ARTIFACT MODE variant of
# docker-compose.orca.yml
# ============================================================
# Identical to docker-compose.orca.yml except `build.dockerfile` points at
# Dockerfile.artifact (single-stage, no server-side compile — see that
# file's header comment) and shm_size is dropped since there's no Vite
# build running in-container anymore. Used by
# deploy/dev/scripts/sync-to-server-artifact.sh; docker-compose.orca.yml
# (source-sync + server-side build) is untouched and still works.
# ============================================================

services:

  # ----------------------------------------------------------
  # Postgres — shared database for main process + EVERY user-process
  # (ORCA_MULTI_USER=1 forks 1 process per authenticated user; without a
  # shared DB each fork gets its own isolated SQLite file — see
  # docs/guides/postgres-shared-database-design.md, BUG-BE-RPC-001/002/003).
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORCA_DB_USER:-orca}
      POSTGRES_PASSWORD: ${ORCA_DB_PASSWORD:?ORCA_DB_PASSWORD required — set in .env}
      POSTGRES_DB: ${ORCA_DB_NAME:-orca}
    volumes:
      - orca-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCA_DB_USER:-orca} -d ${ORCA_DB_NAME:-orca}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - orca-net

  orca:
    build:
      context: ../../
      dockerfile: deploy/dev/docker/backend/Dockerfile.artifact
    image: vnpblc/orca-server:${ORCA_VERSION:-latest}
    container_name: orca-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

    environment:
      ORCA_DOMAIN: ${ORCA_DOMAIN:-b15.openledger.vn}
      ORCA_PORT: ${ORCA_PORT:-6768}
      ORCA_HTTP_PORT: ${ORCA_HTTP_PORT:-6769}
      ORCA_USER_DATA_PATH: /data/orca
      ORCA_VERSION: ${ORCA_VERSION:-0.0.0}
      ORCA_APP_PATH: /opt/orca/app
      NODE_ENV: production
      ORCA_TRACE: ${ORCA_TRACE:-}
      ORCA_SSH_MUX_DEBUG: ${ORCA_SSH_MUX_DEBUG:-}
      ORCA_MULTI_USER: ${ORCA_MULTI_USER:-0}
      ORCA_AUTH_MODE: ${ORCA_AUTH_MODE:-none}
      ORCA_ADMIN_EMAIL: ${ORCA_ADMIN_EMAIL:-}
      ORCA_ADMIN_PASSWORD: ${ORCA_ADMIN_PASSWORD:-}
      ORCA_FLEET_METRICS_ENABLED: ${ORCA_FLEET_METRICS_ENABLED:-false}
      ORCA_FLEET_ALERT_WEBHOOK_URL: ${ORCA_FLEET_ALERT_WEBHOOK_URL:-}
      ORCA_SERVER_SECRET: ${ORCA_SERVER_SECRET:-}
      ORCA_AGENT_API_SECRET: ${ORCA_AGENT_API_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # TEMP DISABLED (2026-08-14, BUG-BE-RPC-003 follow-up): migrations 0001-0017
      # are SQLite-flavored SQL (e.g. datetime()) — they fail against Postgres
      # ("function datetime(unknown) does not exist"), leaving orca_users
      # missing → server crash-loops on boot. postgres service + orca/agent
      # code (PooledDatabaseAdapter etc.) stay in place; re-enable this line
      # once the migrations are made dialect-portable. See
      # docs/guides/postgres-shared-database-design.md.
      # ORCA_DB_URL: postgresql://${ORCA_DB_USER:-orca}:${ORCA_DB_PASSWORD:?ORCA_DB_PASSWORD required — set in .env}@postgres:5432/${ORCA_DB_NAME:-orca}

    volumes:
      - orca-data:/data/orca
      - ./docker/backend/ssh:/home/orca/.ssh:ro
      - orca-projects:/srv/projects

    ports:
      - "172.20.2.39:${ORCA_PORT:-6768}:6768"
      - "172.20.2.39:${ORCA_HTTP_PORT:-6769}:6769"

    # TEMP DISABLED alongside ORCA_DB_URL above — postgres service still runs
    # (harmless, healthy) but orca no longer waits on / requires it.
    # depends_on:
    #   postgres:
    #     condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ORCA_HTTP_PORT:-6769}/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - orca-net

networks:
  orca-net:
    driver: bridge

volumes:
  orca-data:
    driver: local
  orca-projects:
    driver: local
  orca-postgres-data:
    driver: local
